  <script id="novel-data" type="application/json">[{"title":"序章：珠江与长江的经济学寓言","book":"潮涌双城记","chapter":0,"slug":"prologue","type":"chapter","paragraphs":["（卷首说明：本书为经济题材长篇小说。自二〇二二年起，粤苏经济轨迹、统计数字和区域政策进入虚构推演。书中的“一线功能城市”是虚构制度，按产业服务、公共服务、交通可达和运营能力评估。经济史案例取自已注明的公开资料。）","一九八八年夏，广州珠江边，刚从中山大学毕业的林怀南和在广州做调查的苏慕白正对坐品茶。江面上货轮鸣笛，对岸的吊塔如林。林怀南指着江水说：“慕白，你看这珠江，水流湍急，直入南海，像极了广东开放的气魄。”苏慕白却望向北方，沉吟道：“怀南，长江更长，流域更广，只是尚未奔涌而已。”","谁也没想到，这句闲谈竟成了后来数十年的谶语。","多年后，在南京长江大桥旁的一间会议室里，两位已见白发的学者正对着两省的生产总值图。广东的线仍在上面，江苏的线紧随其后。两根线都比早年长了许多，末端只隔着一小段。","“慕白，你还记得我们年轻时争论的‘后发优势’理论吗？”林怀南指着江苏的数据，“江苏的人均GDP在某几年里曾超过广东，这就是后发优势的体现——江苏有更均衡的区域发展，苏南、苏中、苏北的梯度差远小于珠三角与非珠三角地区的差距。”","苏慕白推了推眼镜，在玻璃板上画了几个圈：“你看广州、深圳、东莞、佛山，它们挨得近，各有各的长处。企业靠近以后，找人、采购都方便。可地价和通勤一涨，这笔省下的钱也会从别处花掉。能不能把分工接到附近的城去，就看那些城接不接得住。”","窗外的长江水缓缓东流，江面上货船如织。两位学者都知道，这场中国经济的“双城记”，才刚刚拉开序幕。"],"characters":617},{"title":"第一章：苏南模式——县域经济的突围","book":"潮涌双城记","chapter":1,"slug":"chapter-001","type":"chapter","paragraphs":["二〇一六年春，苏州工业园区管委会的会议室里，灯火通明。墙上挂着一幅巨大的长三角城市群规划图，苏州、无锡、常州、镇江被红线圈成一个紧密的经济板块。","“各位，江苏的短板在服务业，长板在制造业。”时任江苏省发改委副主任的周明远用激光笔点着图表，“广东的服务业占比已经超过52%，而我们只有48%左右。但是，请注意这个数字——”他切换到另一张图，“江苏的制造业增加值连续八年全国第一，尤其是电子信息、装备制造、化工这三个万亿级产业集群。”","台下坐着一百多位市县干部和经济学家。苏慕白坐在第一排，笔记本上密密麻麻记满了数字。他太清楚了，江苏手里有一张广东没有的牌——县域经济。","昆山是全国百强县榜单上常居前列的地方，面积约九百三十平方公里，上一年已做出三千多亿元的生产总值。昆山开发区管委会主任陈建国在会上说：“招商时我们先找一家愿意在这里长期生产的企业。友达光电和仁宝电脑来了，做面板、零部件和维修的人才跟来。零件有了销路，来做零件的人才敢买机器。”","散会后，苏慕白拉着陈建国去了昆山开发区的展示厅。巨大的沙盘上，密密麻麻的工厂模型排列有序。陈建国指着其中一片蓝色区域说：“苏教授，这里是我们新规划的小核酸生物医药产业园。十年前这里还是农田，如今已经集聚了五十多家生物医药企业。”","“这倒是产业集聚的好处。”苏慕白说，“各家共用基础设施，遇上缺人有地方招，遇上难题有同行可问。广东不少集群先从市场交易长起来，苏南一些园区是地方先把路和厂房备下。长起来以后，谁都要经得住订单的检验。”","陈建国点点头，又叹了口气：“县域经济往下做，地可用得不多了。按刚才的数，昆山每平方公里的生产总值在三亿多。深圳要高得多。不过我们不能只问每亩能产多少钱。厂房移远了，车间的师傅肯不肯跟着走，也是一笔账。”","这个数字让苏慕白心头一紧。他想起林怀南前些天在电话里提到的概念——“亩产论英雄”。广东已经开始推行“工业上楼”，把工厂搬进高层厂房，而江苏的大片式工厂布局，确实面临土地瓶颈。","回南京的高铁上，苏慕白打开笔记本电脑，查了金融危机那几年的数据。按当时公布的初步口径，二〇〇八年广东增长百分之十点一，江苏约百分之十二点五。一次危机还说明不了长期波动的大小。他把年份往前拨了几页，准备把景气时和衰退时的变化都列出来。","“外需依存度的差异。”苏慕白在论文中写道，“广东的外贸依存度一度高达150%，而江苏只有80%左右。更高的外需依存度意味着更大的外部冲击风险，但也意味着更强的反弹韧性。这是把双刃剑。”","他保存文档，抬头望向窗外。列车正经过无锡惠山区，夕阳下，一排排整齐的厂房反射着金光。这些苏南乡镇企业改制的硕果，曾经创造了“苏南模式”的辉煌，如今正面临着转型升级的阵痛。","口袋里手机震动，是林怀南发来的微信：“去年国务院已同意珠三角国家高新区建设国家自主创新示范区。我刚见了几个做国际专利的深圳企业。你们谈到昆山，我想请你也看看他们这几年花钱的方向。”","苏慕白盯着这行字看了很久，最后只回了一个字：“看。”","窗外的暮色渐浓，长三角的万家灯火次第亮起。他知道，真正的较量才刚刚开始。","（本章经济学知识点：后发优势理论、聚集效应、边际效益递减、产业链招商、产业集聚、土地开发强度指标、外贸依存度）"],"characters":1320},{"title":"第二章：深圳的加速度——创新生态的裂变","book":"潮涌双城记","chapter":2,"slug":"chapter-002","type":"chapter","paragraphs":["二〇一七年春，深圳南山区科技园，腾讯大厦顶层的会议室里，林怀南正和几位年轻的经济学家讨论一个现象级的变化。","“你们看这组数据。”林怀南投影出一张图表，“深圳研发投入的主体是企业。要看这种投入能长多久，还得问两个问题：钱花到了哪里，订单一少企业肯不肯继续花。”","研究的好处往往有一部分落在别人手里，投入者未必收得回来。林怀南想起阿罗关于发明活动的研究。深圳企业愿多花钱做应用研发，和有现成客户可试产品有关；基础研究的周期更长，所需的合作又是另一层事。","华为就是一个例子。按年报，二〇一六年它花在研发上的钱约七百六十四亿元人民币，折合约一百一十亿美元；苹果当财年披露的研发支出约一百亿美元。两者的会计期间和统计口径并不完全一样。林怀南把名字写在两栏，基础研究那一格没有填数，留待查证。","苏慕白在南京看到这份报告，在旁边写了一句：“代工做久了，培养出的技工、供应商和工艺经验也可以用到新行业。深圳后来走得快，不能把那一段路划掉。”","他向江苏省委提交了一份长达五十页的咨询报告，标题是《从“苏南制造”到“江苏智造”的技术升级路径》。报告中提出了一个尖锐的问题：“广东的人均专利产出是江苏的1.8倍，发明专利占比高出江苏15个百分点。江苏的追赶，不是GDP数字的追赶，而是创新质量的追赶。”","报告送到省政府那天，苏慕白请助手找来国务院二〇一五年批复的材料。珠三角国家自主创新示范区以区域内的国家高新区为依托。他在地图上标出园区的位置，各处之间还隔着城市、道路和许多年没有打过交道的企业。","这意味着什么？苏慕白立刻组织了一场专题研讨。南京大学经济学院的刘教授在会上分析：“这是典型的‘创新极核扩散’战略。珠三角九市连成一片，人才、资本、技术可以在两小时内流动。广州的大学、深圳的企业、东莞的工厂、佛山的市场，形成了一个完整的创新价值链。”","“这不就是我们要做的吗？”一位年轻的副处长忍不住插话，“苏南五市加上上海，我们也有完整的产业链啊。”","苏慕白摇摇头：“不一样的。珠三角的要素流动障碍更小——粤港澳大湾区内部，深圳是创新中心，香港是金融中心，广州是商贸中心，东莞是制造中心。这种功能分工的耦合度，长三角暂时还比不上。尤其是香港的国际化资本市场，是上海暂时替代不了的。”"],"characters":921},{"title":"第三章：错失的窗口——江苏的结构性困境","book":"潮涌双城记","chapter":3,"slug":"chapter-003","type":"chapter","paragraphs":["二〇一八年，中美贸易摩擦陡然升级。东莞的电子厂、苏州的笔记本代工厂，同时感受到了寒意。","林怀南在东莞调研时，亲眼看到一家为美国品牌代工的电子厂在三个月内订单减少四成。老板姓黄，四十出头，在东莞打拼二十年，从一个小作坊做到两千人的规模。他苦笑着对林怀南说：“林教授，我们做代工的毛利率就三到五个点，关税一加，就是亏本生意。要么搬去越南，要么关门。”","“为什么不转型做自主品牌？”林怀南问。","黄老板指了指仓库里积压的货物：“没有渠道、没有设计能力、没有品牌信誉。我们连天猫店都开不好，怎么跟人家打？”","这句话让林怀南陷入了沉思。他在笔记本上写下了一个经典的经济学概念——“资源诅咒”的变形版本：“代工诅咒”。一个地区长期依赖代工模式，会产生路径依赖：赚快钱太容易，反而失去了建立自主创新能力的动力。珠三角也经历过这个阶段，但更早转向了自主品牌，华为、中兴、格力、美的都是例子。","同样的故事也在江苏上演。苏慕白在苏州工业园区调研时，发现了一个更隐蔽的结构性问题：江苏的外资依存度虽然低于广东，但“外资依赖”的性质不同。广东的外资更多是港资和侨资，与本地经济融合更深；而江苏的外资更多是日韩和欧美的跨国公司在华生产基地，一旦成本优势消失，随时可能转移。","更让人担忧的是产业内部结构。苏慕白带着团队做了一个投入产出分析，发现江苏不少工厂做的是中间品。有些部件代替起来容易，订单一撤损失就大；有些精密部件恰恰定价高，客户却过于集中。他把两个问题分在两张纸上，免得一提中间品便一律喊着要换行。","“我们在微笑曲线的最低端。”苏慕白在一次省政府常务会议上直言不讳，“珠三角已经开始向曲线两端延伸——研发设计和品牌营销。我们还在加工组装环节打转。”","会议室里一片沉默。副省长沉吟半晌，问：“苏教授，您的建议？”","“三个转变。”苏慕白竖起三根手指，“一是从外资依赖向内资驱动转变，重点培育本土龙头企业。二是从代工生产向自主品牌转变，给中小企业搭建出海平台。三是从离散产业向产业集群转变，不能只是工厂扎堆，要形成技术关联和知识溢出。”","省长点了点头，但提出一个现实问题：“第三个转变，我们一直在做。但产业集群的形成不是一天两天的事，需要时间。”","苏慕白当然知道。在经济学史上，产业集群的形成通常需要二十到三十年的周期。硅谷从仙童半导体八叛逆到英特尔崛起，用了二十年；深圳华强北从电子元器件市场到自主品牌诞生，也用了近二十年。","问题是，时间不等人。"],"characters":999},{"title":"第四章：大湾区的野望——制度创新的降维打击","book":"潮涌双城记","chapter":4,"slug":"chapter-004","type":"chapter","paragraphs":["二〇一九年二月，《粤港澳大湾区发展规划纲要》正式发布。这个涵盖香港、澳门和珠三角九座城市的经济体，总面积5.6万平方公里，人口超过7000万，2018年的GDP总量达到1.64万亿美元，超过了旧金山湾区，接近纽约湾区。","林怀南在广州参加了一场大湾区研讨会。会上，香港中文大学的一位教授展示了这样一组对比数据：","“大湾区内部，有三种法律体系、三种货币、三个关税区。这看起来是障碍，但如果制度创新做得好，反而可以成为优势——企业可以利用香港的普通法体系做国际商事仲裁，利用深圳的科技创新生态做研发，利用东莞的低成本制造做量产，利用香港的自由港做国际贸易。这在全球任何一个湾区都做不到。”","这就是制度经济学的核心命题：制度是重要的。诺斯（Douglass North）在《制度、制度变迁与经济绩效》中论证过，有效的制度安排能够降低交易成本，促进分工与专业化，从而推动经济增长。","大湾区的制度创新，恰恰在降低交易成本上做文章。比如“深港通”让两地资本流动更顺畅，“港澳药械通”让香港的先进药品可以在大湾区内地城市使用，“跨境理财通”让居民可以双向投资两地金融产品。","苏慕白在南京关注着这一切，心中的焦虑越来越重。他给林怀南发了一条信息：“怀南，大湾区这套制度组合拳，我们长三角短期内接不住。香港的特殊地位，上海替代不了。”","林怀南回复：“慕白，你说得对。但我担心的是另一个问题——大湾区内部的整合程度，目前还远远不够。制度差异带来的交易成本，有时比关税壁垒还高。香港的律师不能在大湾区内地的法庭出庭，跨境资金流动仍有额度限制，‘一小时生活圈’在通关环节卡住了。”","这倒是苏慕白没有深入想的。他立刻组织团队做了一个对比研究：大湾区内部，跨城市的要素流动成本与长三角相比如何？","结果出人意料：如果只看交通时间成本，长三角更优。上海到南京高铁一小时，南京到杭州一小时十五分钟。而广州到香港，虽然物理距离更近，但加上通关和换汇的时间，平均需要两个半小时。如果把制度摩擦的时间成本折合成货币，珠三角内部跨关区的交易成本，甚至高于苏州到上海的跨省交易成本。","“所以，大湾区目前的比较优势在于制度多样性带来的功能互补，劣势在于制度差异带来的交易成本。”苏慕白在给省领导的报告中写道，“江苏的策略应该是：趁大湾区内部整合尚未完成，加速推进长三角一体化，降低省际要素流动成本，把‘网格化优势’发挥到极致。”","这份报告得到了高度重视。两个月后，江苏、浙江、安徽、上海三省市一市的主要领导在南京举行座谈会，共同签署了《长三角地区一体化发展三年行动计划》。","长三角一体化的加速，开始了。","（本章经济学知识点：阿罗悖论、开放式创新、技术追赶理论、微笑曲线、资源诅咒、产业集群形成周期、制度经济学、交易成本、网格化优势与极核式结构对比）"],"characters":1138},{"title":"第五章：长三角一体化的破局——网格化优势的爆发","book":"潮涌双城记","chapter":5,"slug":"chapter-005","type":"chapter","paragraphs":["二〇一九年十一月，长三角生态绿色一体化发展示范区挂牌不久，苏慕白到了横跨沪苏两地的元荡湖。青浦与吴江正谋划打通康力大道和东航路。后来接起两条路的元荡公路桥长一百八十米，岸边另一座约五百八十多米的桥，则是让人步行、骑车的慢行桥。","苏慕白站在等人测量的路头，身边站着上海市发改委的一位副主任和浙江省发改委的一位处长。那一截没有贯通的路就在跟前，民房后头有人推着自行车绕行。三个人在那里看了一会儿。","“苏教授，您觉得示范区最大的难点在哪？”上海的那位副主任问。","苏慕白想了想，用手指在空气中画了个三角形：“难点不在修路架桥，而在利益分配。跨省经济合作，经济学上叫‘跨界外部性’——你把污染治理好了，下游的浙江受益；你把高铁修通了，沿途的城市都受益。这种正外部性，如果没有补偿机制，谁有动力去做？”","这正是公共经济学里经典的“搭便车”问题。在一个行政区分割的市场中，地方政府优先考虑的是本辖区的GDP、税收和就业。跨省基础设施的收益被多个地区共享，但建设成本由本地承担，这就导致了公共品供给的不足。","示范区要做的事，就是破解这个难题。","浙江省那位处长接过话茬：“可以商量让受益的地方一道出钱。谁得益要先说明白，车流变了也得有复核的办法。企业迁走以后，原地留下工人和没还完的账，这一部分也应当单列出来商量。”","苏慕白点了点头。这在经济学上叫“财政协同”——通过制度设计，将外部性内部化，让地方政府从竞争关系走向合作关系。","事实上，长三角一体化的优势正在于此。与粤港澳大湾区“一国两制三关税区”的复杂格局相比，长三角的行政壁垒虽然存在，但属于同一法律体系、同一货币体系下的省际壁垒，通过政策协调就可以大幅降低。","粤港澳大湾区的优势是制度多样性带来的功能互补，短板是制度摩擦成本高。长三角的优势是制度同质性带来的流动性优势，短板是功能互补性不如大湾区那么鲜明。","“这就是比较优势的差异。”苏慕白在当天晚上的笔记中写道，“大湾区像是一台精密的瑞士钟表，齿轮各司其职，但零件太复杂，维修成本高。长三角像是一张渔网，节点之间的连接路径多，断了哪一根都有替代路线，韧性更强。”","这个“网”的优势，在随后几个月的疫情冲击中得到了验证。"],"characters":894},{"title":"第六章：疫情大考——供应链韧性的对决","book":"潮涌双城记","chapter":6,"slug":"chapter-006","type":"chapter","paragraphs":["二〇二〇年初，新冠疫情暴发。全世界的供应链在同一时刻遭遇了百年未有的冲击。","东莞的一家电子厂老板王建国，在春节后接到了苹果公司的邮件：由于供应链中断，订单无限期推迟。王建国急得像热锅上的蚂蚁，他的仓库里堆着三百万元的原材料，流水线上两百名工人等着开工，银行贷款下个月到期。","“所有的鸡蛋都在一个篮子里。”王建国在电话里对林怀南诉苦，“我们太依赖那三五个大客户了。现在客户一停，整个工厂就停。”","林怀南在笔记本上写下了一个词：供应链集中度风险。在产业经济学中，这是一个被反复讨论但很少被实践检验的理论。疫情将它从论文里拽了出来，放在了每一个企业家面前。","一个月后，林怀南在线上组织了一场“疫情下的供应链韧性”研讨会。深圳一家新能源汽车零部件企业的CEO分享了他们的应对策略：“我们把供应商从四十五家增加到了九十八家，其中三十家在珠三角，二十家在长三角，十五家在中西部，其余的在东南亚。虽然成本增加了百分之十二，但四月份的复工率达到了百分之九十以上。”","“这就是冗余的价值。”林怀南总结道，“效率优先的供应链追求零库存，韧性优先的供应链追求分布式。疫情之后，经济学教科书可能要重写了。”","与此同时，苏慕白在苏州看到了另一番景象。","苏州工业园区的复工速度出奇地快。三月初，园区内企业的复工率已经达到百分之九十五。苏慕白调研后发现，原因有两条：第一，苏州制造业的供应链本地化率高达百分之六十以上，很多企业的上游供应商就在同一座城市甚至同一个开发区；第二，江苏的网格化管理体系在疫情中发挥了意想不到的作用——省、市、县、镇四级联动的物资调配网络，让口罩、消杀用品等防疫物资的分配比广东更均匀。","“这就是网格化结构的韧性优势。”苏慕白在给《经济学动态》的专栏文章中写道，“在极核式结构中，资源过度集中于中心城市，一旦中心城市被封控，整个区域都会陷入瘫痪。在网格化结构中，资源和功能分散在多个节点，单一节点的失效不会导致系统的崩溃。”","这篇文章在经济学界引起了不小的反响。有学者赞同，也有学者反驳。一位中山大学的教授在朋友圈评论道：“网格化的韧性是以牺牲效率为代价的。苏州的供应链本地化率高，是因为长三角的市场分割长期存在，企业不得不在本地找供应商。这不是主动设计的韧性，而是市场壁垒的被动产物。”","苏慕白没有反驳。他知道对方说得有道理。江苏的“韧性优势”，某种程度上确实是长三角一体化滞后于珠三角的表现——企业出不去，所以只能窝在本地。只是恰好，这种“窝着”在疫情中成了一种保护。","但真正的考验还在后面。"],"characters":1035},{"title":"第七章：差距松动——两省的复工账","book":"潮涌双城记","chapter":7,"slug":"chapter-007","type":"chapter","paragraphs":["二〇二一年七月，广东公布上半年经济数据：生产总值约五点七二万亿元，同比增长百分之十三，两年平均增长百分之五。江苏约五点五二万亿元，同比增长百分之十三点二，两年平均增长百分之六点九。","总量仍是广东在前。苏慕白把两年平均增速另打一张纸，夹在两份简报中间。","两省都在复工。苏慕白请助手把两张工业统计表并排放，按行业看恢复情况。广东电子信息、新能源汽车的订单起来得快。江苏的化工、机械设备和电子零部件各有一条曲线，拐点并不在同一个月。","表里还列着先进制造业的比重。苏叫助手去找两地怎样归类，一家做新设备的老厂在两张表里可能记在不同地方。分组要是不能对齐，硬排一个先后只会害人。","“这不是偶然。”苏慕白在省发改委的内部研判会上分析，“广东的数字经济、生物医药、新能源汽车三个赛道同时爆发，背后是长达十年的产业布局。腾讯、华为、比亚迪、大疆、华大基因，这些企业不是一天长出来的，是深圳和广州用二三十年时间培育出来的企业生态。”","他调出一张对比图：“工厂里能反复用旧客户留下的图纸和工艺，服务企业也要不断维护系统。两种生意都有规模收益。谁更受停产牵连，得看供应商在哪儿，手里的库存值多少钱。”","在新经济地理学里，规模报酬、运输成本和市场大小会互相影响。程序可以多卖一份，追加的交付成本通常较低，工程服务也有人要在场。至于苏南工人车出的一个配件，有时只卖给一家，多年却找不到第二家能做。","林怀南那几日没有发消息。苏慕白以为他又往厂里去了。","入了九月，中共中央、国务院先后公布横琴、前海的方案。林怀南又打了个电话：“慕白，《横琴粤澳深度合作区建设总体方案》和《全面深化前海深港现代服务业合作区改革开放方案》出来了。能否把规矩接上，我想过两年看企业怎样用。”","苏慕白看过两份方案。横琴实行共商、共建、共管、共享；企业所得税优惠有适用条件。前海的总面积从约十五平方公里扩至一百二十余平方公里。看地图时笔一圈就成，怎样让几处办事口径接起来，他心里仍有疑问。","在制度经济学里，这叫做“经济特区2.0版”。四十年前的深圳特区，是通过政策洼地吸引外资；四十年后的横琴和前海，是通过制度创新破解深层次的结构性障碍。前者是“放水养鱼”，后者是“换水养鱼”——把池塘的水质都换掉了，养出的鱼自然不一样。","电话那头，林怀南的声音低下来：“报纸只登这半年。江苏近两年的恢复已经跑在人前。广东也有自己要过的坎，几处供货要是一起停下来，临时花钱也买不到工夫。”","苏慕白沉默了很久。窗外的南京城，紫峰大厦的灯光在夜色中闪烁。他知道林怀南不是来炫耀的，而是来提醒的。在这场中国经济的双城记中，他们虽然是分别站在两条战线上的学者，但最终追求的东西是一样的——不是谁输谁赢，而是两个省都能找到属于自己的升级之路。","“怀南，你说得对。”苏慕白终于开口，“但我也想告诉你一件事。江苏有一张牌，广东打不出来。”","“什么牌？”","“制造业的深度。”苏慕白的语气很平静，“广东的制造业外向度高、市场化程度高，但有一个先天性短板——重化工业基础薄弱。广东的电子信息产业很强，但装备制造、新材料、基础零部件这些‘工业的母机’和‘工业的粮食’，很多都靠外省供应。江苏不一样，我们从苏南模式开始就形成了完整的制造业生态，从最基础的钢铁、化工、机械，到最精密的芯片、生物医药、高端装备，全部可以省内闭环。”","他顿了一下，接着说：“疫情之后，全球供应链的逻辑从‘just in time’转向‘just in case’。这种转向，对垂直整合能力强的区域更有利。广东依赖的全球供应链，在逆全球化浪潮中受到的冲击会更大。江苏依赖的国内供应链，反而更安全。”","林怀南在电话那头没有说话。他知道苏慕白说得有道理。两个省的比较优势，从来就不是谁高谁低的问题，而是结构不同、路径不同、韧性不同的问题。","这场双城记，还远没有到结局的时候。","（本章经济学知识点：跨界外部性、公共品供给的搭便车问题、财政协同机制、供应链集中度风险、冗余的价值、网格化与极核式的韧性对比、新经济地理学、经济特区2.0版、垂直整合、just in time与just in case的供应链逻辑对比）"],"characters":1675},{"title":"第八章：今时今日——格局重定","book":"潮涌双城记","chapter":8,"slug":"chapter-008","type":"chapter","paragraphs":["二〇二六年六月十二日，清晨六点，深圳湾大桥上的车流已经如织。这座连接深圳和香港的跨海大桥，在晨光中像一条银色的丝带，把两座世界级城市紧紧系在一起。","林怀南站在能望见口岸的路边，手里攥着研究院新印的两省对照表。二〇二四年，江苏以十四点二六万亿元超过广东的十四点一二万亿元，次年两省分别为十四点九四万亿元和十四点八五万亿元。广东的名次没变，差额缩小到九百亿元。","一季度广东的现价总量略高了些，纸上用灰字注明，全年数字还要等。林怀南看着季度栏的窄缝。他认得苏慕白做访谈用的那几处企业，知道江苏两年间多出来的产出也有它们一份。","与经济数字一道送来的，还有一份广东城市功能评估试行稿。广州和深圳已有不少服务可向外地提供，佛山和东莞也报了名。那份稿子先问工厂做设计和检测要跑多远，再问住在城边的人要走多久才能吃到一顿便宜的早饭。第一轮验收安排在冬天。","“慕白，你看到了吗？”林怀南拨通了苏慕白的视频电话，将手机摄像头对准公报上的数字。","苏州独墅湖畔，苏慕白坐在书房的藤椅上，面前也有那张表。他问：“九百亿元里面，有多少是价格动了？”林怀南低头去翻附页。附页印得小，他用手把纸压住。","他把镜头转向书桌上摊开的一本经济学著作——阿西莫格鲁和罗宾逊合著的《国家为什么会失败》。书页停留在“汲取性制度与包容性制度”那一章，空白处密密麻麻写满了批注。","“怀南，我一直在想一个问题。”苏慕白说，“同一间车间，换班以后能做成别人的订单，这个本事在我们的表里要怎么找？”","林怀南收起手机，坐车去深圳北站。他要赶八点钟的高铁去广州，参加一个讨论粤港澳大湾区和长三角的论坛。对照表连同附页被他夹进笔记本。"],"characters":678},{"title":"第九章：制度弹性的分野","book":"潮涌双城记","chapter":9,"slug":"chapter-009","type":"chapter","paragraphs":["广深港高铁上，窗外的风景从密集的城市群逐渐过渡到珠三角的水网地带。林怀南的思绪飘回了十年前。","2016年，他曾在《经济研究》上发表过一篇论文，比较广东和江苏的制度变迁路径。核心观点是：广东的改革开放是“自下而上”的，深圳特区的成功带动了整个珠三角的民营经济崛起，市场力量的成长先于政府规制的完善。江苏则是“自上而下”的，苏南模式本质上是地方政府主导的乡镇企业改制，行政力量始终在资源配置中扮演更核心的角色。","这两种模式在早期各有优劣。广东模式更灵活，但早期出现过市场失序；江苏模式更稳健，但政企关系更加紧密。","然而，当经济发展进入创新驱动阶段后，两种模式的差异开始显现出深远的影响。","林怀南在笔记本上写下了一段经济学分析：","“创新活动的本质是‘试错’。试错需要两个条件：第一，允许失败的社会氛围；第二，让失败者重新开始的市场机制。广东的民营经济土壤提供了这种包容性——在深圳，一家初创公司倒闭了，创始团队第二天就可以重组新公司，资本、人才、渠道都不会断。在江苏，由于地方政府的产业政策深度介入企业运营，产业方向被‘锁定’在少数几个‘正确’的赛道上，企业家的试错空间被压缩了。”","这就是为什么广东诞生了华为、腾讯、比亚迪、大疆、华大基因、优必选等横跨多个赛道的创新巨头，而江苏虽然有恒力、沙钢、协鑫等制造业龙头，但在新兴赛道上始终未能出现同等量级的企业。","高铁抵达广州南站。林怀南出了车厢，站住让一位老人先走。老人手里有两张票，拦住站务员问哪一张能坐到佛山。那年轻人听了两遍，领她到换乘的牌子下面去。","林怀南想起评估稿里写了通勤时间，单位是分钟。两地线路标在两张图上，他自己早几年前也跑过一次错站。若把一分钟一公里都量得准，起点还该从老人家门口算起。","评估组预备比较四样事：通勤、医疗教育、对外提供的专业服务，以及这些服务今后的运转费用。已有名声的城也得逐项重看。","他在笔记本上记下老人问的那一站。到了会场才记起，当日与苏慕白谈过的那道窄缝，还没有回他。"],"characters":816},{"title":"第十章：一线城市群的经济学","book":"潮涌双城记","chapter":10,"slug":"chapter-010","type":"chapter","paragraphs":["下午的论坛上，林怀南做了一个题为《一线城市群如何形成》的报告。","他从投影幕上调出一张图表：“这一列只算广东，那一列算湾区九市和港澳。比较时先统一年份和币种。做区域研究，有时候光换一个地理范围，名次就动了；做国际比较，汇率再动一下，变化还要大。”","台下有人抬起头，把横轴上的年份又看了一遍。","林怀南切换到下一张图表：“若要追韩国，再追日本乃至两国之和，得看若干十年里的生产率、劳动力和汇率。屏幕上的三条曲线用了三组假设，谁也不能只挑其中一条最陡的带走。”","他停顿了一下，又加了一句：“韩国同样会换产业，日本也有新的设备和工艺。比较的另一头也在走。”","台下响起掌声。但林怀南的表情依然严肃。","“湾区眼下能做的，有些已经做成了。我们先看看产业、人才和规则是怎样合在一处的。”","他调出一张复杂的图表，上面画满了箭头和曲线。那是他花了一年时间构建的“制度—技术—产业”三重螺旋模型。","“蛇口、前海、横琴的实践各有来路。深圳能找研发人员，东莞能试做零件，广州和香港有各自的市场与服务。工厂遇上不能在家门口解决的难题，能否找对人并及时付账，是我看一座城有没有用的办法。”","他说到这里，停下来翻了翻讲稿。硅谷有大学、企业和公共研发长期交错的历史，筑波也有自己积累科学能力的过程。若只拿创业公司的数目衡量，讲起来省事，有些成果就看不见了。","台下又响起掌声，比上一次更热烈。","会后，苏慕白在视频连线中看到了林怀南的报告。他没有鼓掌，而是关掉了屏幕，走到窗前。","窗外的独墅湖平静如镜，湖对岸的纳米科技产业园灯火通明。他想起了近四十年前那个在珠江边与林怀南争论经济学理论的青年学者。","那时候，他们都相信经济规律是普适的。现在他明白了，经济规律是普适的，但制度演化的路径是高度路径依赖的。广东之所以能走到今天，不是因为它“做对了”什么江苏没做的事，而是因为它在四十年前的那个起点上，选择了另一条路。","那条路在前期充满荆棘，但在后期长成了参天大树。"],"characters":796},{"title":"第十一章：江苏的沉思","book":"潮涌双城记","chapter":11,"slug":"chapter-011","type":"chapter","paragraphs":["三天后，南京。","江苏省发改委的一间会议室里，苏慕白正在向省委省政府的主要领导做汇报。会议的议题是“新形势下江苏经济发展的战略再定位”。","苏慕白开宗明义：“各位领导，我今天不讲套话，只讲三个经济学事实。”","他竖起第一根手指：“事实一，江苏已领先两年，广东在追近。我们应当把去年的增长拆开看，看看哪些是订单回暖，哪些是厂里换了机器和工艺。前一种好处会过去，后一种才有机会留下来。”","第二根手指：“事实二，广东的加速度来自制度红利的结构性释放。前海、横琴、南沙三大平台在过去数年里推出了一百多项制度创新，其中数十项是全国首创。跨境数据流动试点、跨境理财通、港澳专业人士资格互认，每一条政策都在降低大湾区的内部交易成本。当交易成本降到一定程度，要素流动的规模就会产生质变。”","第三根手指：“事实三，广东的城市升级有自己的产业基础。深圳的创新生态、广州的商贸、佛山的制造、东莞的配套，做了几十年。几地之间若能办成更多的事，江苏眼下领先的那一点也未必守得久。”","他放下手指：“江苏手里的好牌是制造业的深度。要是把配套和检验做得更扎实，再让苏中、苏北有接得住这些工序的人，厂子遇上新订单便不必从头来。”"],"characters":488},{"title":"第十二章：珠江上的两把尺","book":"潮涌双城记","chapter":12,"slug":"chapter-012","type":"chapter","paragraphs":["二〇二六年深秋，广州珠江新城华灯初上。广州塔亮着灯，桥下有人背着书包沿江慢慢走。林怀南刚从一个中日经济比较论坛出来，随身带着写满笔记的节目单。","下午有人在台下递过一张便条，问广东何时能赶上日本。纸被人折过两道，塞进了名牌后面。","广东前三季度的现价总量在两省比较中回到了前面。广东课题组估计全年约十五点九万亿元，按他们采用的年均汇率假设，约合二点二万亿美元。林怀南在小数点后只留了一位。","他手头的试算对日本、韩国也用了同一年度的名义总量预测。广东有可能高过韩国，离日本还有很大一段，离两国之和更远。会场屏幕上那条最乐观的线到二〇五〇年仍没碰着两国合计值。","他把那张便条摊平，写了两行：货币尺子一年的涨落可以很大，厂里的本事长得慢。改用不变价比较各自增速，还要重新画一张图。","林怀南站在广州塔的观光层上，俯瞰着脚下的珠江。他的身边站着一位白发苍苍的日本经济学家——东京大学荣誉教授山田一郎。山田是专程来广州参加“中日经济比较研究论坛”的。","“林桑，三十年前我来广东，一家厂做完货，还要把次品送到香港去问。”山田说，“今天来了几位年轻人，说在本地就能看出毛病。我想见见他们。”","林怀南便翻节目单给他看。有一家厂的地址他记得，也记得那厂门前修了五年还在堵的路。","他掏出手机，调出一张旧图。日本泡沫破裂后，资产负债表修复、人口结构和生产率变动都牵涉其中；广东早年的产出增长里，也有大批劳动者从低产出岗位转到工厂和服务业的贡献。林把两端的就业率圈起来，说这种转移往后能再带动多少增长，要看还剩多少人有机会换到较好的活。","山田沉默了很久。","“林桑，你说得对。但我想补充一点。”山田抬起头，目光中有一丝不服输的老派学者的倔强，“日本经济虽然总量停滞了，但国民生活质量、海外净资产、核心技术掌控力，仍然很强。广东在追赶总量的同时，不要忘了质量的追赶。”","林怀南笑了。他从口袋里掏出一枚硬币，抛向空中，接住，摊开手掌。","“山田先生，这枚硬币有两面。”林怀南说，“一面写一省产了多少，另一面得另外刻上人均产出、收入和公共服务。在前一面走得快一些，后一面还有许多活要做。”","他把硬币放回口袋，答应第二天陪山田去厂里。他们先去看做检验的人，再去看看她下了晚班怎样回家。","观光层的玻璃映出林怀南的侧脸。这个曾经在珠江边与苏慕白争论经济学理论的年轻人，如今已是两鬓斑白的老者。但在他的眼中，那种对经济规律的热情，从未消退。"],"characters":982},{"title":"第十三章：制造业的迁徙——全球价值链的重组","book":"潮涌双城记","chapter":13,"slug":"chapter-013","type":"chapter","paragraphs":["同一时间，东莞长安镇。","林怀南的学生、年轻的经济学博士生陈思远正在一家工厂里做田野调查。这家工厂五年前还是一家为美国品牌代工的电子烟厂，如今已经转型为一家自主品牌的储能设备制造商。","老板姓李，四十出头，早年从湖南来东莞打工，从流水线工人做到车间主任，再从车间主任做到工厂主。他的故事，是珠三角千千万万中小企业主的缩影。","“林教授没跟您一起来吗？”李老板给陈思远倒了一杯茶。","“林教授在广州开会，让我先来调研。”陈思远翻开笔记本，“李总，您这五年的转型经历，我想详细记录下来。这是非常重要的案例。”","李老板点了一根烟，眯着眼睛回忆：“2020年初，前一年贸易摩擦的影响还没过去，疫情又来了，我们的代工订单一下子少了七成。我跟老婆说，完了，二十年的心血要打水漂了。那时候我天天在车间里转，看着那些设备发呆，心想这些机器还能做什么？”","他的眼神忽然亮了起来：“有一天，我在网上看到一条新闻，说欧洲的能源价格暴涨，家庭储能设备供不应求。我查了一下储能设备的核心部件，逆变器、电池包、BMS管理系统——这些东西的制造工艺，跟电子烟的电路板生产有很多相通之处。”","“所以您就转型了？”陈思远追问。","“哪能那么快。”李老板苦笑，“我把工人们召集起来，说我们要学新东西。一半的工程师跟我说他们搞不定，辞职走了。我只好从深圳挖了两个做新能源的工程师，又带着剩下的团队，白天正常生产，晚上学技术。整整折腾了两年，才把第一代产品做出来。”","陈思远在笔记本上快速记录着。他想起了林怀南常说的一个经济学概念——能力溢出。在一个产业生态完善的区域，企业的转型不是从零开始，而是在现有能力的基础上进行迁移和重构。东莞之所以能诞生大量从代工转型自主品牌的企业，是因为这里积累了全世界最完备的电子制造能力网络。这个网络中的每一个节点——模具、注塑、SMT贴片、电路设计、软件编程——都是互通的。从一个产品切换到另一个产品，能力的迁移成本很低。","“现在我们的产品卖到德国、荷兰、瑞典。”李老板脸上的皱纹舒展开来，“自主品牌的毛利率能做到百分之三十五，以前代工的时候连百分之五都不到。去年我们还在越南设了一个组装厂，响应客户的‘中国+1’策略。”","“您不怕产业转移？”","“怕什么？”李老板掐灭烟头，“我们把最核心的研发、设计、品牌、关键零部件留在东莞，把组装环节搬出去。这是林教授教我的——‘微笑曲线’的两端留在国内，中间的制造环节可以全球布局。这叫‘总部经济’。”","陈思远合上笔记本，心中涌起一阵感慨。他想起了一句经济学名言——比较优势不是天生的，而是创造的。东莞用了四十年时间，从一个农业县变成了“世界工厂”；又用了十年时间，从“世界工厂”变成了“世界实验室”。这不是天上掉下来的，是千千万万个李老板这样的企业家，在生产线上一点一点干出来的。"],"characters":1141},{"title":"第十四章：工程师红利——大湾区的人才储备","book":"潮涌双城记","chapter":14,"slug":"chapter-014","type":"chapter","paragraphs":["广州大学城，中山大学管理学院。","一场关于“粤港澳大湾区人才战略”的研讨会正在进行。台上发言的是香港科技大学的一位教授，正在展示一组数据：","“2025年，大湾区9+2城市的在校大学生总数达到了320万人，其中理工科占比54%，即173万人。这个数字超过了德国全国理工科在校生的总和。大湾区每年毕业的工程师数量，相当于美国全国工程师培养总量的三分之一。”","台下坐着的一位企业家举手提问：“但是，我们企业招人的时候，还是觉得应届生的动手能力不够。产教融合的问题怎么解决？”","香港科大的教授笑了：“这个问题问得好。三年前，深圳市政府联合华为、腾讯、大疆等企业，成立了大湾区工程师联合培养计划。大二大三的学生，每学期有三个月在企业实训，由企业工程师一对一指导。毕业时，学生已经具备了相当于一年工作经验的实践能力。这个模式，借鉴的是德国双元制职业教育的经验，但规模更大、产业覆盖面更广。”","林怀南坐在台下第一排，听得格外认真。他知道，人才是经济的终极资源。广东之所以能在大湾区时代实现跃升，根本原因不是政策优惠，不是区位优势，而是过去二十年在高等教育上的持续投入。","2005年，广东的毛入学率只有24%，低于全国平均水平。当时很多人批评广东“经济大省、教育弱省”。广东省政府没有被批评声吓退，而是做了一个在当时看来极有远见的决策：拿出300亿元，以“引进+共建”的模式，在深圳、珠海、东莞等地建设大学城和研究院。","南方科技大学、香港中文大学（深圳）、北京师范大学-香港浸会大学联合国际学院、广东以色列理工学院……一批高水平大学在那个十年里扎堆出现。到2025年，广东的毛入学率已经达到68%，超过全国平均水平12个百分点。","这就是人力资本理论的核心命题：教育投资的社会回报率虽然周期长，但回报率远高于物质资本投资。广东用二十年时间补上了高等教育的短板，现在正是这批受过高等教育的年轻人进入劳动力市场、成为创新主力的时候。","研讨会结束后，林怀南被一群学生围住。一个戴着黑框眼镜的女生举手问：“林教授，您觉得我们这代人面临的最大挑战是什么？”","林怀南看着这些年轻的面孔，想起了三十年前的自己。","“你们这一代找工作的难处，比我们当年多了几样。”他缓缓说道，“可这里已有一些实验室、车间和学校能一道做事。你们去留都可以自己想，进了哪一间门，先学会做一件从前没人能替你做好的事。”","学生们沉默了，但眼中闪着光。","那是希望的光，是野心的光，是经济规律在人类精神中最美丽的映射。","（本章经济学知识点：全要素生产率、结构性红利、人均GDP追赶曲线、能力溢出与产业转型、微笑曲线与总部经济、比较优势的创造性、人力资本理论、教育投资的社会回报率、德国双元制教育模式的本地化应用）"],"characters":1109},{"title":"第十五章：城市的蜕变——第一批一线城市","book":"潮涌双城记","chapter":15,"slug":"chapter-015","type":"chapter","paragraphs":["二〇二六年冬，深圳前海，一场别开生面的“城市进化论”论坛正在举行。","受城市功能评估组邀请，曾在英国研究城市网络的许文礼教授从伦敦回到深圳。他在一处城中村长大，到会场前特地绕到当年读书的地方看了一眼。","大屏幕上是一张珠三角的网络图。不同颜色的线标出通勤、就医和企业服务。台下有人等宣布名次，还有人想看本地哪一条线画得短了。","“经第一轮核验，广州、深圳、佛山、东莞进入省里的一线功能城市名单。”许教授指给人看，“这份评估有公共服务、专业分工和运营可持续性几条线。国际机构有各自的排行，我们这张表用来看三年后在册的服务还能否照常开门。”","台下响起热烈的掌声。","许教授推了推眼镜，又翻出两页。佛山有不少厂已能替外地小企业独立做模具和材料检验，东莞的车间有成套的试制服务。各自还有办得不好的地方。许指着图上两条浅线，请两地留下低收入居民通勤的原始记录，复评时要去走一次。","林怀南坐在台下，想起上世纪九十年代第一次来东莞调研的情景。街道尘土飞扬，工厂宿舍挨在一处。他那时只在笔记里记下每小时做出多少件，忘了问工人下了班有几路车可以乘。","过了三十多年，才想起补问也不算太晚。他在纸上写下当日的一路公交和两处给外地企业办检验的地方。","论坛结束后，许教授找到林怀南，两人在会场外的咖啡厅坐下。","“林教授，”许教授搅动着咖啡，“佛山和东莞的企业能接的活多了。这两张表，哪一张该先看？”","林怀南想了想，从包里掏出两张图表。","“许教授，我在东莞跟踪了十八家工厂。看看这一张。过去检验归在工厂里，同一台设备只给一家用。近年有几家把检测另立成公司，同行的活也接了。账面上服务业多了一笔，能做检验的人和时段也确实比从前多一些。”","他指着图表中的一行。研发设计、检测认证、供应链管理、物流和金融都可以供制造业使用。不过把原来的人换一个发工资的单位，城里未必会多出一分产出。可若一个质检员能给几家小厂服务，并且把从外地拿回来的难单子做成，增加的本事便有了用处。","许教授点点头，问他们有没有那几组检验数据，又在哪儿能坐到去工厂的车。","“正是如此。”林怀南点头，“这就是杨格定理在区域经济中的体现——分工受市场范围限制，市场的扩大又会进一步促进分工。东莞的市场范围从全国扩展到全球，分工的精细化程度也随之指数级增长。原先一个工厂内部完成的几十个环节，现在变成了几十家专业公司，每一家都在自己的细分领域做到了世界级水平。”","许教授从口袋里取出一支钢笔，在纸巾上记了两个地址。他原来约好第二天去看新的展厅，添了这两个地址，恐怕要早起一个钟头。","林怀南问他几时出门。许望了一眼会场外闪亮的路灯，说先搭第一班车，若不能到，就看看还差哪一段。"],"characters":1081},{"title":"第十六章：制度的力量——前海的实验","book":"潮涌双城记","chapter":16,"slug":"chapter-016","type":"chapter","paragraphs":["深圳前海，深港现代服务业合作区。","林怀南带着他的博士生团队，正在进行一项为期三年的追踪研究。课题是：“制度创新如何降低交易成本——前海自贸区的准自然实验”。","前海合作区的面积只有15平方公里，却创造了超过2000亿元的增加值，单位面积产出是深圳平均水平的8倍。这里聚集了超过10万家企业，其中世界500强企业设立了350多家分支机构。","林怀南的学生陈思远正在整理前海2020年至2025年的制度创新清单。清单上密密麻麻记录着每一项创新的名称、时间、内容和效果评估。","“老师，您看这个。”陈思远指着一行字，“2021年，前海率先试点‘跨境双向股权投资’——允许境内外资本在前海设立双向投资的股权投资基金。2025年，这个政策被复制到了整个大湾区。我们测算的结果是，这项政策将跨境股权投资的交易成本降低了37%，交易量增长了2.8倍。”","林怀南拿起清单，一页一页地翻看。每一条政策创新，都在降低某种形式的交易成本：","“港资港法”政策——允许港资企业选择适用香港法律解决商事纠纷。结果：港资企业在前海解决商业纠纷的平均时间从365天缩短到90天，法律服务的交易成本降低了65%。","“跨境数据流动试点”——允许在前海注册的企业，在数据安全评估通过后，将数据传输到香港的数据中心。结果：跨国公司的数据合规成本降低了42%，数据跨境流动的时间从平均15天缩短到2天。","“港澳专业人士资格互认”——持有港澳专业资格证书的人员，在前海备案后即可执业。结果：三年内，超过3000名港澳律师、会计师、建筑师、医生在前海获得执业资格，专业服务的供给弹性大幅提升。","林怀南合上清单，沉思良久。","制度经济学家科斯曾经提出过一个著名的命题：在交易成本为零的世界里，产权的初始分配不影响效率；但在交易成本为正的现实世界中，制度的安排至关重要。","前海的故事，正是这个命题的完美注脚。粤港澳大湾区内部存在三种法律体系、三种货币、三个关税区，这种制度差异带来的交易成本如果得不到有效降低，大湾区的整合就只能是纸上谈兵。但前海通过持续的制度创新，一条一条地破除壁垒，一点一点地降低交易成本，硬是把“一国两制三关税区”的障碍，变成了“一国两制三关税区”的红利。","“这才是广东的核心竞争力。”林怀南在当天的研究笔记中写道，“不是区位，不是政策，而是制度创新的能力。这种能力的本质，是地方政府在中央政府授权范围内，持续进行制度试错的勇气和智慧。”","他想起了一个经典的比较制度分析案例：为什么同样是从计划经济转型，中国成功了而俄罗斯失败了？制度经济学家认为，关键区别在于中国采取了“渐进式双轨制改革”——在维持既有利益格局的同时，在增量部分进行制度试验，成功后再逐步推广。前海的改革路径，正是这种方法论在新时代的延续。"],"characters":1123},{"title":"第十七章：深港融合——两座城市的化学反应","book":"潮涌双城记","chapter":17,"slug":"chapter-017","type":"chapter","paragraphs":["深圳福田口岸，早高峰。","每天有超过30万人次的跨境通勤者，在深圳和香港之间穿行。他们有一个共同的名字——“双城人”。","张敏就是其中之一。她住在深圳南山，工作在香港中环的一家国际投行。每天早上7点，她从深圳湾口岸过关，乘坐跨境巴士，8点半准时出现在办公室。晚上7点下班，8点半回到深圳的家中。","“三年前，跨境通勤的体验完全不同。”张敏在通关通道里对陈思远说，“那时候过关要排半个小时的队，口岸的接驳交通也不方便。现在有了‘一地两检’和‘免下车通关’，整个通关过程不到十分钟。”","陈思远在笔记本上记录着。他正在做一项关于“跨境通勤对人力资本配置效率的影响”的研究。初步数据显示，深港之间的跨境通勤者数量从2019年的日均12万人次增长到了2026年的日均32万人次。这些人中，70%拥有本科以上学历，平均月收入超过5万元人民币。","“这些双城通勤者，本质上是在进行人力资本的跨区域最优配置。”林怀南在指导陈思远的研究时分析道，“他们在香港获取更高的劳动报酬，在深圳享受更低的生活成本和更好的居住环境。两地之间的要素价格差异，驱动着这种跨区域配置。而通关便利化程度的提高，降低了这种配置的交易成本，使得最优配置从理论可能变成了现实选择。”","从经济学的角度看，深港融合的实质，是两座城市在要素市场上的深度一体化。劳动力、资本、技术、信息在两地之间自由流动，按照价格信号的指引，找到回报率最高的地方安家落户。","这个过程一旦完成，深圳和香港就不再是两座独立的城市，而是一个功能耦合的超大城市共同体。深圳提供研发、制造和年轻的人口，香港提供金融、法律和国际化的营商环境。两者的结合，产生了一加一大于二的协同效应。","这正是林怀南在二十年前的博士论文中提出的“制度套利”假说——当两个制度环境不同的经济体深度融合时，企业和个人可以利用制度差异进行套利，从而获得高于单一制度环境下的收益。深港融合，让企业可以在香港融资、在深圳研发、在东莞制造、在广州销售、在全球市场获利。每一种要素都在最适合它的制度环境中发挥作用。","2026年12月的一个傍晚，林怀南站在深圳湾大桥上，望向香港的方向。落日的余晖洒在海面上，波光粼粼。大桥上的车辆川流不息，双向车道的车流密度几乎没有差别。","他突然想到一个问题：四十年前，深圳还是一个边陲小镇，香港已经是亚洲四小龙之一。四十年后，深圳的GDP已经超过了香港。这四十年间，两座城市的关系经历了从“前店后厂”到“并驾齐驱”，再到“深度融合”的演变。","“前店后厂”时代，香港是“店”（市场、品牌、技术），深圳是“厂”（土地、劳动力、生产）。这是一种垂直分工关系，深圳依附于香港。","“并驾齐驱”时代，深圳的科技创新能力崛起，与香港的金融服务能力形成横向竞争关系。两座城市在人才、资本、项目上展开了激烈的争夺。","“深度融合”时代，两座城市开始意识到，与其竞争，不如协同。深圳需要香港的国际化和法治化环境，香港需要深圳的创新活力和市场规模。竞争关系转向了共生关系。","林怀南掏出手机，拍下了一辆正在驶过大桥的双层巴士。巴士的车身上印着一行标语：“深港一家亲，湾区共繁荣。”","他想，这或许就是制度经济学的最高境界——不是用制度去改造人，而是用制度去连接人；不是用制度去划分边界，而是用制度去跨越边界。","（本章经济学知识点：城市等级体系与GaWC分类、生产性服务业与制造业的协同演化、杨格定理与分工深化、交易成本与制度创新、准自然实验方法论、科斯定理、渐进式双轨制改革、人力资本跨区域最优配置、制度套利假说、垂直分工与横向竞争的演化）"],"characters":1447},{"title":"第十八章：江苏的答卷——韧性增长的秘密","book":"潮涌双城记","chapter":18,"slug":"chapter-018","type":"chapter","paragraphs":["二〇二七年春，南京，江苏省政府礼堂。","一年一度的全省经济工作会议正在召开。与往年不同的是，今年的会议没有过多谈论与广东的差距，而是聚焦于一个全新的命题：“高质量发展背景下的江苏道路”。","苏慕白作为特邀经济学家，站在讲台上做主题报告。他的身后是一面巨大的电子屏幕，上面滚动着密密麻麻的数据图表。","“今年初，两省的全年数字出来了。二〇二六年，广东十五点八六万亿元，江苏十五点七二万亿元。江苏失掉了前两年的位置，产出仍比上年增加。今天我想先从几处工厂谈起，看看往后的增量会从哪里来。”","他按下遥控器，屏幕上出现一张地图：“这是江苏的县域经济热力图。颜色越深，人均GDP越高。昆山、江阴和张家港有不少高产出的工序。收入怎么样，还有另外一张表。世界银行分收入组看的是用Atlas方法换算的人均国民总收入，咱们这张县域生产图不能代用。”","台下响起一片惊叹声。苏慕白接着说：“但是，更值得关注的不是苏南，而是苏中和苏北。”","他切换到另一张图：“过去五年，苏中三市——南通、扬州、泰州的人均GDP年均增速达到7.2%，超过苏南的5.8%。苏北五市——徐州、连云港、宿迁、淮安、盐城的人均GDP年均增速更是达到了7.8%。区域差距在加速缩小。”","地方之间有没有收敛，要看相近条件下较穷地区能否持续缩小差距。苏北增速高是一条线索。苏慕白还想问，承接来的设备有没人会修，订单有没有配在本地，工资能留下多少。","苏慕白调出另一张图。省内十三个地级市都有各自的支柱，规模相近的两地，居民收入和公共服务也可能相差较多。他请大家翻到最后一页，用其中几个地方交叉看一遍。","他举了几个例子：","“连云港靠近港区，便于运输大型部件。一些装备厂试着接连维修一起做，进了国内外市场。”","“宿迁的物流和客服业为本地添了岗位。旺季临时招的人多，淡季留得下多少，还要看企业是否添了别的业务。”","“盐城发展风电和动力电池产业，也要算沿海生态所需的保护成本。评估一处新投资，不能只看建设期的机器运进来多少。”","台下的一位副省长微微点头，在笔记本上写了一行字：“这就是江苏的‘底牌’——均衡。”"],"characters":856},{"title":"第十九章：制造业的深海——隐形冠军的国度","book":"潮涌双城记","chapter":19,"slug":"chapter-019","type":"chapter","paragraphs":["散会后，苏慕白没有留在南京，而是坐上了去往无锡的高铁。","无锡惠山区，一条不起眼的街道两旁，分布着十几家看起来毫不起眼的工厂。这些工厂的大门低调到几乎让人忽略，但如果你知道它们生产的是什么，你就会对这家工厂肃然起敬。","苏慕白的第一个目的地，是一家叫“透平叶片”的企业。这家公司的名字很少有人听说过，但在全球航空发动机领域，它是一个如雷贯耳的名字。","公司总经理王建国在门口迎接苏慕白。他五十出头，穿着朴素的工装，手上带着老茧，看起来更像一个车间主任，而不是一个掌控着数十亿资产的企业家。","“苏教授，欢迎欢迎。”王建国握着苏慕白的手，带着他走进车间。","车间里，几十台五轴联动数控机床正在轰鸣。每台机床的价格都在千万元以上，机床里正在加工的，是一片片航空发动机叶片。","“这是涡轮叶片，工作温度1700度，转速每分钟15000转，离心力相当于叶片自身重量的两万倍。”王建国拿起一片成品叶片，在灯光下端详着，“全世界能造这个的国家，一只手数得过来。我们是全国唯一一家能够量产民用航空发动机涡轮叶片的企业。”","苏慕白接过那片叶片，掂了掂。它很轻，轻到几乎感觉不到重量，但它的价值，按克计算的话，超过了白银。","“你们的客户有哪些？”苏慕白问。","“GE、罗尔斯·罗伊斯、普惠，全球三大航空发动机制造商都是我们的客户。”王建国的语气平静，但眼中有一丝掩饰不住的自豪，“C919的发动机叶片，也是我们供应的。”","苏慕白在笔记本上写下了一个词：“隐形冠军”。这是德国管理学家赫尔曼·西蒙提出的概念，指的是那些在细分市场中占据全球领先地位、但公众知名度不高的中小企业。德国经济的中坚力量，不是西门子、奔驰这样的巨头，而是上千家这样的隐形冠军。","江苏，正在成为中国的“隐形冠军之乡”。","下午，苏慕白又去了江阴。这里有一家叫“双良节能”的企业，生产的是溴化锂吸收式制冷机，一种利用工业余热制冷的设备。这个市场极其细分，全球每年只有几十亿的规模，但双良在这个市场中的全球占有率超过40%。","“我们不追求做大，只追求做强。”双良的创始人缪双大对苏慕白说，“很多人问我为什么不搞多元化，我说，能把一件事做到全世界最好，已经够我干一辈子了。”","苏慕白深有感触。他想起了一个经济学概念——“专注溢价”。在分工日益深化的全球经济中，专注于一个极其细分的领域，把产品做到极致，就能获得定价权和品牌溢价。这种模式不需要庞大的规模，不需要惊人的增长速度，但需要时间的积累和工匠精神的沉淀。","江苏的制造业，恰恰擅长这个。从洋务运动时期的“江南制造局”，到改革开放后的“苏南模式”，再到今天的“智造江苏”，这片土地上的企业家似乎天生就有一种“坐得住冷板凳”的耐心。"],"characters":1091},{"title":"第二十章：长三角的化学反应","book":"潮涌双城记","chapter":20,"slug":"chapter-020","type":"chapter","paragraphs":["回到南京的第二天，苏慕白参加了“长三角一体化发展专家咨询委员会”的年度会议。","会议在上海举行，地点是虹桥商务区的一栋玻璃幕墙大楼里。从会议室的窗户望出去，可以看到虹桥综合交通枢纽——高铁、机场、地铁、公交在这里交汇，每天吞吐着超过100万人次的旅客。","“各位，今天我们要讨论的是一个核心问题。”会议主持人、上海社科院的一位资深研究员开宗明义，“长三角一体化已经走过了框架搭建的阶段，接下来要进入‘化学反应’阶段。什么叫化学反应？不是简单的‘物理连接’，而是深度的‘功能融合’。”","他举了一个例子：“苏州的制造业企业需要融资，过去只能找苏州的银行。现在，通过长三角征信链平台，苏州的企业可以一键申请上海的银行贷款，上海的银行可以通过平台调取苏州企业的税务、工商、社保等数据，实现跨区域授信。2026年，这种跨区域的贷款额达到了1800亿元。”","苏慕白翻开会议材料，里面有一个让他格外关注的数据：长三角内部跨省市的研发合作论文数量，从2020年的1200篇增长到了2026年的4500篇，年均增长25%。其中，上海-苏州、上海-杭州、南京-合肥的合著论文数量增长最快。","这是“知识溢出”的量化证据。在新经济地理学中，知识的跨区域流动是经济集聚的深层动力。当两个城市的科研人员开始频繁合作，意味着两个城市的创新网络正在融合。这种融合一旦完成，创新活动的空间范围就不再是单个城市，而是整个城市群。","上海-苏州的创新走廊，就是最典型的例子。苏州有强大的制造能力，上海有顶尖的科研资源和国际化平台。两者结合，产生了“设计在上海、制造在苏州、全球市场在两者之间”的协同效应。苏州工业园区内超过40%的研发中心，实际上是上海高校和科研机构的延伸。","下午的讨论环节，苏慕白做了发言。","“我提一个建议。”他站起来，声音不大但很清晰，“长三角一体化的下一个突破口，应该是‘标准一体化’。目前长三角内部，很多行业的标准还不统一——同样的产品，在上海需要做一次检测，在江苏需要再做一次，这增加了企业的交易成本。我建议，借鉴欧盟‘相互承认原则’的经验，在长三角建立‘一个标准、一次检测、区域通行’的机制。”","台下响起了掌声。会议记录员飞快地记下了这条建议。","散会后，苏慕白在虹桥火车站等车回南京。候车大厅里人声鼎沸，广播里不断播报着发车信息——开往南京、杭州、合肥、宁波、苏州、无锡的高铁，密集到每几分钟就是一班。","他忽然想起了三十年前。那时从南京到上海，绿皮火车要开五个多小时。现在，高铁只要五十九分钟。","三十年间，时间的距离被压缩了五倍。空间的阻力被打破了。长三角的数千家企业、数万所科研机构、数亿人口，正在被编织成一张越来越紧密的网络。","这张网络不会孕育出广东那样的一线城市集群——至少短期内不会。但它会孕育出一个更加均衡、更具韧性、更有温度的经济体。","苏慕白想，这大概就是江苏和长三角的“比较优势”。不是谁取代谁，而是各自找到最适合自己的生态位。","就像长江和珠江，一条流经六省，一条只润岭南，最终都汇入大海，但沿途的风景，大不相同。","（本章经济学知识点：收敛假说、梯度转移、隐形冠军、专注溢价、长三角一体化、物理连接与化学反应的区分、知识溢出与创新网络、标准一体化与相互承认原则、交易成本的空间维度）"],"characters":1324},{"title":"第二十一章：广东的抉择——从高速增长到高质量发展","book":"潮涌双城记","chapter":21,"slug":"chapter-021","type":"chapter","paragraphs":["二〇二七年盛夏，广州从都国际会议中心。","一场关乎广东未来十年走向的战略研讨会正在闭门举行。与会的除了省委省政府的主要领导，还有林怀南等十二位经济学家和战略专家。会议的主题是：“广东经济：下一程的增长动力在哪里？”","大屏幕上，一组数据让所有人的表情变得严肃：","二〇二六年，广东地区生产总值十五点八六万亿元。按不变价计算，增速从上年的百分之四点九回升到百分之五点七。制造业采购经理指数有几个月在百分之五十的荣枯线附近。与此同时，出口增速放慢，房地产开发投资继续下行。报表摆在一处，谁也不能只拿排在前面的那个数字回去。","“各位，我们要直面一个问题。”省长打破了沉默，“广东经济高速增长了几十年，现在是不是到了‘减速带’了？”","林怀南拿起话筒，但没有急着回答。他先走到了大屏幕前，调出了一张他花了一个月时间做出来的图表。","“大家请看这张图。我画的是广东经济三十年的增长曲线——1995年到2010年，年均增长14.2%；2010年到2020年，年均增长8.6%；2020年到2026年，年均增长5.9%。增长速度在逐级下台阶，这是事实。”","他停顿了一下，切换到下一张图表。单位产出的能耗比早些年低，规上工业中高技术制造业的占比在提高。他提醒大家以前者的可比价格、后者的规上工业为分母。若只从一张增长表里抽走最好看的一行，谁也难说省下的能源在哪里。","他放下激光笔，目光扫过全场：“所以，我的回答是：广东的经济增长确实在‘减速’，但这不是衰退意义上的减速，而是成熟意义上的减速。就像一个少年长到二十多岁，身高的增长速度当然会放慢，但体魄的强健程度、心智的成熟程度，远超少年时期。”","台下的一位副省长追问：“林教授，那我们接下来的战略重点应该放在哪里？”","林怀南把讲稿翻到下一页：“先看看全要素生产率。机器和工人花了多少，最后多做出了什么，把这三件事分开来记。”"],"characters":764},{"title":"第二十二章：全要素生产率的秘密","book":"潮涌双城记","chapter":22,"slug":"chapter-022","type":"chapter","paragraphs":["会场安静下来。林怀南找来一张纸，先写了产出，再在下边写设备、工时和材料。他打算从实际的账讲起。","“全要素生产率，简称TFP。增长核算先估算资本、劳动等可量投入对增长的贡献，余下的部分用于衡量生产率变化。技术、管理和资源重配可能体现在里面，漏记的投入、产能利用的波动和统计误差也可能留下痕迹。”","他调出一张图。一九五七年，索洛用美国的数据试着把人均产出增长中能由资本加深解释的部分分出来。他的估算依赖数据、模型和假定，余项的大小并没有替人回答哪一家工厂做对了什么。","“日本和韩国的制造能力都曾靠大规模投资起来。看它们何时效率改善、何时劳动从低产出行业迁出，得分别去找证据。仅凭一个剩余项，不能分清这两件事情。”","他在屏幕上圈出了广东的数据。工厂范例的投入记录有两种工时，一种算企业自己的人，一种加了外包的人。两种算出的结果不同。林怀南请大家先把工时的口径问清楚。","一位企业界的代表举手提问：“林教授，TFP听起来很玄，有没有具体的抓手？”","“当然有。”林怀南笑了，“TFP的抓手，说到底就三件事：研发创新、人力资本、资源配置效率。”","他调出深圳的案例：“深圳的TFP增长在全省是最快的，2020年到2026年年均达到3.1%。深圳做对了什么？第一，研发投入强度超过5%，其中基础研究占比从五年前的3%提升到了8%。基础研究是TFP的源头活水，没有基础研究，应用研究迟早会碰到天花板。第二，深圳引进了超过60万本科以上学历的年轻人，净流入人口中大学以上学历占比高达70%。第三，深圳在全国率先推行了‘链长制’产业政策，政府不再指定‘扶持谁’，而是梳理出关键产业链上的‘卡脖子’环节，集中资源攻关。”","会议一直开到傍晚六点。最终形成的共识是：广东的下一程，不能再靠铺摊子、上项目、堆要素来拉动增长，而必须走全要素生产率驱动的内涵式增长道路。","会议结束后，林怀南站在酒店的阳台上，望着远处的从化山林。夕阳把天空染成了金红色，层峦叠嶂的轮廓在暮色中若隐若现。","他想起索洛一九五六年的《对经济增长理论的一个贡献》。在模型的长期稳态里，资本不断加深会遇到报酬递减，持续提升人均产出要有技术进步的支撑。次年那篇实证论文又给人们一个去问数据的办法。","那些旧问题还在。广东若想继续赶上更发达的经济体，光添厂房和机器，不能回答相同的投入怎样多做出东西来。","这不是选择题，而是必答题。"],"characters":968},{"title":"第二十三章：日本模式与广东道路的比较","book":"潮涌双城记","chapter":23,"slug":"chapter-023","type":"chapter","paragraphs":["一周后，东京。","林怀南受邀参加“日中经济论坛”，与他同台对话的是日本前经济财政政策担当大臣、经济学家竹中平藏。","论坛的议题是：“经济发展新阶段的挑战与机遇——中日比较视角”。","竹中平藏的开场白很坦率：“日本经济在过去数十年经历了高速增长后的平台期。很多人说是泡沫破裂，是人口老龄化，是广场协议。这些都对，但不是根本原因。根本原因是，日本经济的‘供给端’创新能力在某些新赛道上未能及时跟上时代变化。”","他在大屏幕上放出一张图表：“上世纪九十年代中期，全球市值排名前十的企业中，日本占了数家。到了最近几年，日本企业在互联网、人工智能、生物科技等新兴赛道上面临着激烈的国际竞争。这提醒我们，任何经济体都不能满足于既有优势。”","林怀南接过话题：“竹中先生的分析非常深刻。从经济学的角度看，这可以概括为‘锁定效应’——曾经的比较优势太强了，反而可能成为转型的包袱。日本企业在汽车、电子、精密制造等领域做到了极致，形成了巨大的技术积累和产业路径。当数字化浪潮来临时，调整的难度自然更大。但这并不意味着日本失去了竞争力——恰恰相反，日本在基础研究、精密制造、工匠精神方面的深厚底蕴，仍然是全世界学习的榜样。”","竹中平藏点头表示赞同：“这确实是一个普适性的经济学命题。任何成功的经济体都会面临类似的挑战。”","林怀南接着说：“广东的情况有其自身特点。广东的产业结构更年轻、更多元，核心城市之间的产业更替频率较高——从早期的加工贸易，到后来的电子信息，再到当前的新能源汽车和生物医药，每一轮都有新的龙头企业崛起。这种动态更替的速度，是广东经济活力的重要来源。当然，广东也面临自己的挑战，比如人口老龄化正在加速，土地和环境容量的约束越来越紧，核心技术仍然需要持续攻关。”","台下有日本听众举手提问：“林教授，您认为广东能从日本的经验中学到什么？”","林怀南想了想，回答道：“日本的教训恰恰是最宝贵的财富——当一个经济体把一件事做到极致之后，如何保持对‘新事物’的敏感和拥抱能力，这是所有成功经济体都需要面对的共同命题。广东要学的，不是如何‘超越’日本，而是如何避免重蹈日本在转型期曾经走过的弯路。从这个意义上说，日本的经验对广东的价值，比任何总量数字都重要。”","论坛结束后，竹中平藏请林怀南在东京银座的一家怀石料理店吃饭。席间，两人谈起了经济发展模式的比较。","“总量对比只是一个静态的切片。”竹中平藏的语调很平静，“真正重要的是每个经济体是否在持续进步。日本的海外净资产、国民生活质量、核心技术掌控力仍然有深厚的基础。中国有句古话叫‘他山之石，可以攻玉’——中日之间的经验交流，远比谁高谁低的比较更有意义。”","林怀南端起清酒杯：“竹中先生说得太好了。经济竞争不是零和博弈，不是你输我赢的游戏。各国各地区在技术、资本、市场上的深度合作，共同做大蛋糕，才是正和博弈的真谛。”","两人碰杯。清酒入口，清冽甘醇。","林怀南忽然想起苏慕白曾经说过的一句话：“真正的经济学智慧，不是教你如何赢，而是教你如何让所有人赢。”","这一刻，在东京的夜色中，他更加深刻地理解了这句话。","（本章经济学知识点：增长减速与增长质量的区分、全要素生产率（TFP）、索洛增长模型、资本投入与劳动力投入的边际报酬递减、基础研究与应用研究的关系、链长制产业政策、锁定效应与成功者的诅咒、制度多样性对经济韧性的贡献、零和博弈与正和博弈）"],"characters":1367},{"title":"第二十四章：大湾区的深水区——制度一体化的攻坚","book":"潮涌双城记","chapter":24,"slug":"chapter-024","type":"chapter","paragraphs":["二〇二七年秋，珠海横琴。","粤澳合作中医药科技产业园内，一场特别的签约仪式正在进行。澳门青年创业孵化中心与横琴新区管委会签署了《关于共同推进粤澳青年创新创业深度合作的框架协议》。协议的核心内容是：在横琴注册的澳门青年创业企业，可以同时享受澳门和广东两地的创业扶持政策，两地的扶持资金可以叠加使用。","“这在过去是不可想象的。”林怀南站在签约仪式现场，对身边的陈思远说，“过去是各管各的，澳门的企业拿不到广东的补贴，广东的企业也拿不到澳门的补贴。两套政策体系之间有一堵看不见的墙。现在，这堵墙被拆掉了。”","陈思远在笔记本上快速记录。他正在写一篇关于“大湾区制度一体化”的博士论文，横琴是他最重要的田野调查点。","“老师，我一直有个疑问。”陈思远合上笔记本，“大湾区的制度一体化，最大的障碍到底在哪里？是法律差异？是利益分配？还是别的什么？”","林怀南没有直接回答，而是拉着陈思远走到产业园的天台上。","“你看。”他指向北边，“那边是横琴口岸，过了口岸就是澳门。直线距离不到两百米。就是这两百米的距离，分割了两种法律体系、两种货币、两个关税区。每次通关，每一次资金跨境，每一次数据流动，都要跨越这两百米。这两百米的交易成本，比从广州到北京的一千八百公里还高。”","他转过身，面向南方：“再看那边，是横琴新区管委会的大楼。大楼里有广东的公务员，也有澳门的公务员，他们坐在同一间办公室里，共同管理横琴粤澳深度合作区。这在全世界都是首创。两个不同制度背景的政府团队，在同一个平台上协同工作，共同决策。”","“这就是破局的关键。”林怀南的语气变得更加笃定，“大湾区的制度一体化，不能靠‘统一’——不可能让香港放弃普通法改用内地法律，也不可能让广东放弃社会主义制度。唯一可行的路径是‘连接’——在两种制度之间架设桥梁，让要素可以在两种制度间低成本地流动。横琴的模式是‘共商共建共管共享’，本质上就是制度经济学中‘混合型治理结构’的实践。”","陈思远若有所悟：“所以，大湾区的制度一体化，不是在两张纸上画同一幅画，而是把两张纸拼在一起，接缝处用最好的胶水粘牢。”","林怀南笑了：“这个比喻很形象。”"],"characters":872},{"title":"第二十五章：跨境数据的自由港","book":"潮涌双城记","chapter":25,"slug":"chapter-025","type":"chapter","paragraphs":["下午，林怀南和陈思远驱车前往横琴新区的一个特殊区域——国际互联网数据专用通道机房。","这里是横琴新设的一处数据协作试点。企业可申请传输符合要求的普通经营数据，涉及个人信息、重要数据或人类遗传资源的事项，仍按各自适用的程序办理。","机房的管理人员姓郑，是一位三十出头的年轻人，从美国留学回来，放弃了硅谷的工作机会，来到横琴做数据安全工作。","“林教授，您看这个。”郑工指着机柜上一排闪烁的指示灯，“这是我们的数据防火墙系统，用的是国产自主可控的技术。每一笔跨境数据流动都有完整的日志记录，什么时候传的、传了什么、传给了谁，清清楚楚。”","“目前的跨境数据流量有多大？”林怀南问。","“起初没几家用。”郑工掰着指头数，“先做供应商的部件规格、公开的产品目录和不含个人信息的物流汇总。有些数据没分清，第一回就退了。”","陈思远追问道：“跨境数据流动对企业到底有多大的价值？有没有量化测算？”","郑工调出试点记录：“拿普通产品规格表来说，过去企业到处问手续，同一份说明改几回。现在有窗口核对材料，符合条件的很快能走完。你问省几天，我得把这些走完的和退回的都拿出来，再一起算。”","林怀南听完，陷入了沉思。","在数字经济时代，数据是最核心的生产要素。数据流动的自由度，决定了一个地区在全球价值链中的地位。过去二十年，中国是全球最大的数据生产国，但数据出境通道不畅，导致很多数据密集型产业无法深度融入全球创新网络。","横琴的跨境数据流动试点，正在破解这个瓶颈。这不是简单的“放开”，而是在安全和效率之间寻找最优平衡。用制度经济学的语言说，就是在保障数据主权的前提下，尽可能降低数据跨境流动的交易成本。","“湾区的几处市场用的规则不尽相同。”林怀南对陈思远说，“窗口便不便，得问已经办过的人，也得问排着队没办成的人。我们去找两家退件的企业，看看问题出在材料还是口径。”"],"characters":755},{"title":"第二十六章：香港的再定位——从超级联络人到价值共创者","book":"潮涌双城记","chapter":26,"slug":"chapter-026","type":"chapter","paragraphs":["离开横琴，林怀南乘船前往香港。","维多利亚港的海面上，天星小轮缓缓行驶。海风带着咸腥味，吹在林怀南的脸上。他望着两岸的天际线——中环的摩天大楼和尖沙咀的钟楼隔海相望，构成了一幅经典的城市画卷。","香港的变化，比他想象的更大。","上环的一栋写字楼里，林怀南约见了老朋友——香港金管局前总裁陈德霖。两人在一家茶餐厅坐下，要了两杯丝袜奶茶和两份菠萝油。","“德霖兄，香港这两年最大的变化是什么？”林怀南开门见山。","陈德霖想了想，说：“最大的变化，是香港人想明白了自己的定位。”","他喝了一口奶茶，接着说：“过去几十年，香港的定位是‘超级联络人’——把内地的产品卖到全世界，把全世界的资本引到内地。这个角色很重要，但本质上是通道。通道的价值取决于两端的流量。当内地的产品可以直接出海，当外国的资本可以直接进入内地，通道的价值就会下降。”","“现在呢？”","“现在香港的定位在升级——从‘超级联络人’升级为‘价值共创者’。香港不再只是帮别人做嫁衣，而是参与价值创造。你看这几年香港最大的变化——科创生态起来了。香港科技园公司支持的初创企业从2017年的200多家增长到了2027年的1200多家。商汤科技、货拉拉、空中云汇这些估值超过百亿美元的独角兽，都是从香港起步的。”","林怀南点点头：“这就是制度经济学的‘路径创造’理论——在既有路径的尽头，主动开辟新的路径。香港的普通法体系、自由港政策、国际化的营商环境，这些过去是为贸易和金融服务的。现在，这些制度禀赋正在为科技创新服务。法律体系和创新经济并不矛盾。好的法治环境，恰恰是创新最需要的土壤。”","陈德霖补充道：“还有一个重要的变化——香港和深圳的关系。过去是竞争为主，现在变成了‘联合创新’。香港的大学做基础研究，深圳的企业做应用开发和产业化。香港科技大学的激光雷达技术，在深圳的大疆无人机上大规模应用；香港中文大学的医疗影像AI，在广州的医院里临床使用。这种‘深港研发、湾区制造、全球市场’的模式，正在成为新常态。”","下午，林怀南去了一趟香港科学园。园区里到处是年轻的面孔，操着普通话、粤语、英语在讨论技术方案。一栋栋实验楼里，生物科技、人工智能、金融科技的企业在这里共享实验室和办公空间。","园区管理人员告诉林怀南，科学园的入驻率已经超过95%，还有200多家企业在排队等候入驻。园区正在扩建第三期，预计2029年完工。","林怀南在一家生物科技初创公司的实验室里，见到了一位从美国回来的博士后。这个年轻人叫李明，本科毕业于清华大学，博士毕业于斯坦福大学，专攻基因编辑技术。他拒绝了美国一家大型药企年薪40万美元的工作，回到香港创业。","“为什么要回来？”林怀南问。","李明想了想，说：“因为这里有机会。在香港做生物科技，可以同时利用三个优势：香港的国际化法治环境和知识产权保护，深圳的制造能力和供应链，内地的巨大临床试验资源。在美国，你只能得到美国的东西。在香港，你可以得到整个中国的东西。”","林怀南被这句话击中了。","他忽然意识到，香港的“一国两制”优势，在过去四十年里主要是“双面胶”——把内地和世界粘在一起。而在新的时代，这个优势正在演变为“三棱镜”——把内地、香港、世界三者的制度优势折射到一起，汇聚成一道全新的光。","这道光，正在照亮整个大湾区。","（本章经济学知识点：制度一体化的连接策略、混合型治理结构、数据作为生产要素、数据跨境流动的安全与效率权衡、交易成本的时间维度、超级联络人模式及其局限、路径创造理论、法治环境对创新的作用、制度优势的演变与升级）"],"characters":1425},{"title":"第二十七章：两张公报","book":"潮涌双城记","chapter":27,"slug":"chapter-027","type":"chapter","paragraphs":["二〇二七年深秋，苏慕白从南京给林怀南寄来一个信封。里面是两张报纸，一张折得方正，一张折歪了，露出半个“首”字。林怀南把它们摊开，才发现两张报纸都在说第一。","头一张是两年前的。二〇二四年度，江苏的地区生产总值是十四点二六万亿元，广东十四点一二万亿元。那年评审会上，有人提议放一张蓝底的庆祝图，苏慕白没有同意。他让人把它换成了三个地方的配套企业图。蓝点小些，密密地分布在苏州、南通和常州，最远的一个点落在盐城。","苏慕白曾去过那个点。那是一家加工密封件的小厂，门外拴着一辆送盒饭的电动车。老板最舍不得扔的是一只旧砂轮。他说，一家长江边的设备厂改了图纸，请他们磨出新的槽口。头两个月都做坏了，一批货赚的钱还不够付试验费。后来设备厂照样下单，连批量涨价时也没换人。第三年，他们能做别人嫌麻烦的几十种小批量配件。靠的就是凑在一块儿试的那些白工。","另一张报纸是今年初的。二〇二六年，广东十五点八六万亿元，江苏十五点七二万亿元。广东重新排在前面，江苏仍在增长。林怀南找出一把老花镜，把两个年份各自圈起来。两回领先都是一千四百亿元，足够办许多事，放进两个大省的账本里，又只是一道细缝。","他拨通电话。苏慕白那边有水声，听上去像正在洗杯子。","“寄报纸来讨茶喝？”","“替我收着。”苏慕白关了水，“这两张报纸我给学生看过。头一张有人说是苏南的功劳，后一张又有人说江苏的办法全错了。我给他们看了修订表，他们才肯翻回第一页。”","“你给他们看了什么？”","“价格和产量分开的那一栏。一个产品涨了价，厂子用同一台机器做出同样多的东西，现价产值也会涨。两省排座次是现价账，问增长的来处还得拆开看。尤其这点差距，核算修订都够它挪几步的。”","林怀南说，广东那边也有一桩容易看走眼的事。新车卖出去看得见，替车厂做设计、验收、维修的人分在三处，新闻里面找不齐。他把电子表格里运输设备和生产性服务的分项给苏慕白念了一遍。苏问到哪个涨得最多，林只说了一半便停住。两个行业之间的委托增加，同一笔活可能在不同订单上出现。他请苏慕白先别记，等把增加值口径查过再说。","电话挂了以后，林把两张报纸夹到同一本书里。他选的是索洛的论文选，书脊已经开了线。一九五七年那篇论文用投入和产出的资料作增长核算，剩下的一项需要解释，一件机器的更新、一种工序的改变，甚至估计的误差，都可能留有痕迹。林在夹页上写了两行，一行记密封件，一行记验收和维修。纸上还空得很，他没有急着补齐。","傍晚，他把信封翻过来，才看见苏慕白在封口旁写的小字。寄两张，免得日后只记得自己赢的那一张。"],"characters":1037},{"title":"第二十八章：第二枚印章","book":"潮涌双城记","chapter":28,"slug":"chapter-028","type":"chapter","paragraphs":["陈思远从香港回来时，皮包里有一个蓝塑料夹。夹子没有扣好，过安检的时候掉出三页纸。排在他身后的一位女士替他拾起来，扫了一眼，说：“又送检？”","她姓许，在东莞一家小厂管质量。厂里做工业镜头，往年靠客户给图纸，今年总算做出一批自己的样品。香港的客户答应收二十只试装，条件是先拿一份耐湿热的验证报告。许师傅从前海跑到香港，交了两次样品，做的是同一项试验。","“条件一样吗？”陈思远问。","“大致一样。可温度一栏有人记每五分钟的值，有人只记高低值。”她把夹子里的一张曲线翻给他看，“第二家不敢替第一家盖章。我做了二十多年质检，轮到我盖，我也要问清楚。”","星期一，陈思远跟着她去了前海的实验室。负责试验的年轻人姓黎，先看看送检单，又从柜子里取出一只同型号的旧镜头。镜筒上有一点白灰，许师傅拿纸抹去，纸上留下个小圆印。黎工说这批用的是旧胶，湿热以后胶层起雾的概率不小，可招标文件只设一个通过门槛。相同曲线到了不同地方，有人会取峰值，有人看恒温段，结论自然分岔。","他们坐了半天，议定了一件小事。第一家做试验时保留原始读数、样品编号和校准记录，第二家可查这三样，对申请互认的批次按风险抽检。若第二家坚持重做，须把原因写在回执上。许师傅问谁给他们省下这笔钱。黎工拿铅笔敲了敲表格：“省下是以后的事。头两批照做两遍，先看看能不能得到同样的结果。”","陈思远在回程车上想到集装箱。一九五六年，“理想X”号载着五十八只集装箱从纽瓦克驶往休斯敦。让这种运输方式后来普及的，还有码头吊具、船位、铁路和平板车的衔接。若只给船换个装法，箱子到岸还是得拆开重装。陈思远在两张报告中间画了一只箱子，箱盖上写着试验条件，箱底写着追索责任。","两家也做了个约定。以后如果更换湿度传感器，便在报告上写出更换的日子。许师傅问客户认不认，黎工说可以先把空白样张给他们看。许在文件夹内侧写了两家实验室的电话，头一家没接，就留字等回信。","头一轮做得并不顺利。香港实验室发现两个试样的标签脱落，当即退回。厂长嫌耽误，叫许师傅干脆再交一次费，把单过了。许答应那一批重做，把退件附在下一批申请里。她说，若当它没发生，日后真错了，厂里拿什么去找人？","等到第三批，正式送检的二十只镜头有两只被抽查，第二份全套报告终于省了下来。原定三周的等待缩短为十二天。这个数是她用墙上挂历算的，末了加了一笔，写着头两批的学费也要算。","陈思远请她把挂历拍下来。许师傅把手机递还给他，指指二十只镜头的箱子：“你先记哪两只退过。往后别人照着做，会省一次退路。”陈思远把原先写在稿首的那句成效显著划去，先记下了两个编号。"],"characters":1054},{"title":"第二十九章：谁付污水费","book":"潮涌双城记","chapter":29,"slug":"chapter-029","type":"chapter","paragraphs":["二〇二七年冬，北江边的一个村子开会，议的是一条排水沟。沟不宽，小孩一脚能跨过去。几家小厂在上游，养鱼的塘在下游。秋雨过后，塘里死过一回鱼，村里人把泡得发白的照片封在塑料套里，带到会上。","厂里来的是韩会计。他把纸袋放在膝头，说自己算过，一家厂单独装设备，费用比一年的利润还多。三家合作绰绰有余，第四家不肯出份子，说常年开工不过几个月。鱼塘老板娘把照片推过去：“你们算一年，我算这一塘。养到能卖，再死给我看，半年也白过了。”","林怀南受邀来听。他先问当时留没留水样。村里人互相看看，老梁拍了一下大腿，说到底还是让他们去找是谁排的。这话说完，屋里一时乱了。村委会的年轻姑娘跑出去借白板，回来时手冻得红红的。她把最早打电话报鱼死的时辰写上去，又请在场的人各说说那晚自己看见了什么，一句一句另行记下，谁也没让人替他说。","午间，韩会计问林怀南，这算不算科斯讲的那头牛。他上过夜大，记得牛吃了隔壁庄稼，两家人若能商量，谁来扎篱笆是算得出来的。","“你这儿要先知道牛从哪家出来。”林怀南说，“一条沟上有六个口，农户也未必留得住水样。采样、问责和执行都要花钱。科斯把这些花费放回账里。你老拿两家人谈好的那半个故事去算，就少算了半本书。”","下午讨论出一个办法。处理站按排量和污染物浓度收费，小作坊可按预订时段集中排放；固定容量由签约企业先分摊。站外的水质由两处监测点记录，每月把异常时段贴到村务栏。至于死鱼，村里保留循其他途径求偿的资格，试运行费另议。有人把一条私人灌溉沟划进方案，养鱼的老板娘不肯，说她早两年出了清沟的钱，谁办厂谁出的账要先写清。","白板最右边有人写了一个蛋大的圈，里头是居民的井。那个口虽不在厂界里，一场大雨也可能受它们的影响。各家原先都没把井写进本子的用水表。年轻姑娘请大家等一刻，她去叫平日在井边扫落叶的游婆婆来。老人进屋没有坐，指了两家人喝这口的水，说上次井浑，他们先用凉桶去隔壁村挑了两日。试行单上的监测位置，后来便多出一点。","会开到天黑，只签了一个三个月的试行单，第四家也签了最低用量。韩会计把那张账纸翻给林看，其中有一笔维修准备金。他本想划去，被鱼塘老板娘问住了：“坏的那天水先往哪里走？”他想了一会儿，在上面添了一行停机预案。各家回去商量停线的费用，第二周再碰头。","快散会时，门外响起一辆卖鱼车的铃。年轻姑娘去取照片，看见塑料套的水汽已经干了，鱼的样子却仍清楚。她把照片收进村里的档案袋，同试行单放在一处。林怀南把会前拟好的三个大问题折起，背面抄下她留下的小问题：月底来查账的话，谁给我开门？"],"characters":1042},{"title":"第三十章：借一把尺","book":"潮涌双城记","chapter":30,"slug":"chapter-030","type":"chapter","paragraphs":["腊月里，苏慕白沿娄江去访一位老相识。车开到园区，迎面是一片新厂房，说是年底能交付。隔着围墙，吊车把一扇厚玻璃提起来，慢慢地往窗框里送。跟在苏慕白身边的何师傅停了一会儿，认出施工队的头儿是他弟弟。","何师傅的厂做小型检测台，这一回想借一台精密测量仪。自购要两年的利润，平常闲着也得校准。附近一所学校有一台，排到下个月。园区的人建议他加入一项公用设备计划，第一批有八家。商量了两回，谁都拿不定主意。试订的价钱相同，两家订单多的厂想把周三、周四都包下来；小厂怕让出这两天，第二回还得让。","午后，屋里燃了一只电暖器。管理人员把轮候办法拿来，大家一边搓手一边议论。苏慕白问，每天量的件数相差多少。何师傅脱下手套，在纸上画出两条线。大厂有一段量很稳，小厂接到返工的急单，量一下多一下少。每家都领同样多的小时，合计看上去公平，急件却仍得出去找机器。","苏提起奥斯特罗姆对尼泊尔灌溉系统的研究。在有的地方，上游的人先引水，下游的人出力修渠，值夜和清淤也算进规则里；她逐处调查，使用者能否参与定规则、看到违规、解决争执，比把各处硬套进一个制度要紧。何师傅听到这里问，园区的仪器又不耗水，怎么比？苏说，共用的是时段。哪个时候被占住，别人手上有活也只能等，谁来让出一个钟头，总得在纸上有去处。","八家后来议定，先给每家一个可预约的底额，大批用量提前申报，另留少数空档应付返工。急件若用了别人让出的时段，账上便要还回相同的时段或费用，每月公布匿名的等待时间。两家试着提议以股权分时，很快自己也觉出不便。哪一户的电路临时出问题，持股再少也可能要插一次队。仪器旁放了厚厚一本使用簿，监测温湿度的事轮给离这里最近的三家人做。","有家小厂没有填足自己的预约，说正好腾出一天。管设备的人问是否把那一天转给外地的公司，多收一点费用。何师傅说应当事先留个数，别要本地厂在外地客户的高价面前再守一次门。八家先取一小段闲时试做，收入买标样。标样放在大家都能打开的柜里，旧的留在一旁，换过哪一天也有签字。","头个月只过了半月，设备就因人操作不当停用了一天。记录簿上那一栏有两个名字。大家没有去猜谁弄坏，请校准师查明原因，再按预留的维修费出钱。何师傅那批急件没赶上，客户少付了两百块。他来抄记录的时候先骂了半句，等看清新添的培训栏目，又把徒弟的名字填在第一格。","春天快到了，林怀南来电话，说要陪德国来的穆勒先生到苏州走一走。苏慕白想起园区那面漂亮的招商墙，问他们肯不肯多留一小时。留得出来的话，娄江边有人借一把尺用，才刚算清这把尺到底值多少。"],"characters":1036},{"title":"第三十一章：苏州的转身——从世界工厂到创新策源地","book":"潮涌双城记","chapter":31,"slug":"chapter-031","type":"chapter","paragraphs":["二〇二八年春，苏州工业园区迎来了一位特殊的访客——德国工业4.0战略的主要制定者之一、弗劳恩霍夫研究所的汉斯·穆勒教授。他是专程来苏州调研中国制造业数字化转型的。","林怀南恰好在苏州参加一个学术会议，便陪同穆勒一同参观。","第一站是苏州工业园区的展示馆。巨大的沙盘上，密密麻麻的企业标示牌组成了一片蓝色和绿色交织的海洋。园区管委会的讲解员介绍道：“苏州工业园区2027年的GDP达到3800亿元，单位面积产出是全国开发区的四倍。入驻世界500强企业超过120家，外资研发中心超过80家。”","穆勒用流利的中文问：“我感兴趣的不是数据，而是结构的变化。听说苏州工业园区的产业结构和十年前完全不同了？”","讲解员笑着点头：“穆勒教授说得对。十年前，园区的主导产业是电子信息代工制造，占园区GDP的百分之六十五。现在，生物医药、人工智能、纳米技术三大新兴产业已经占到园区GDP的百分之四十八，电子信息代工的比重下降到了百分之三十二。”","穆勒转过身对林怀南说：“这是一个惊人的转变。德国很多工业区用了三十年才完成类似的转型，苏州只用了十年。”","林怀南没有急着回答。他带着穆勒走出展示馆，驱车前往园区东部的BioBay——苏州生物医药产业园。","BioBay的广场上，矗立着一块巨大的石碑，上面刻着八个字：“做药就是做良心”。穆勒好奇地驻足观看。林怀南解释道：“这是苏州生物医药产业的座右铭。BioBay里有两百多家生物医药企业，其中十几家已经做出了在中国获批上市的一类新药。”","在BioBay的一栋实验楼里，他们参观了一家名为“信达生物”的企业。这家公司成立于2011年，用了不到二十年时间，发展成了中国生物制药领域的龙头之一。公司的创始人俞德超博士亲自接待了两位访客。","俞德超带着他们参观生产线：“我们的PD-1单抗药物达伯舒，是中国第一个获批的国产PD-1抑制剂。2027年，我们的年销售额突破了80亿元，产品出口到了东南亚、中东、拉丁美洲三十多个国家和地区。”","穆勒追问了一个关键问题：“苏州为什么能生长出生物医药产业？这里没有顶级的医学院，没有传统的大药企，从零开始是怎么做到的？”","俞德超的回答很坦诚：“三个原因。第一，苏州政府有耐心。生物医药的研发周期长达十年以上，很多地方的政策支持三年就变，苏州坚持了十五年不变。第二，苏州有制造基因。做生物药，本质上也是制造业——发酵、纯化、制剂，这些工艺能力和电子制造有相通之处。苏州的工程师文化，特别适合做这种需要精工细作的事情。第三，苏州离上海近。我们的很多临床研究团队在上海，投资人也在上海，四十多分钟的高铁，随时可以过去开会。”","林怀南在笔记本上记下了这段话。他想起了经济学家阿瑟在《技术的本质》中提出的一个观点：新技术不是从真空中诞生的，而是从已有技术的组合和演化中产生的。苏州的生物医药产业，恰恰是“制造能力+政策耐心+区位优势”三者组合的结果。","午餐时，穆勒对林怀南说了一句意味深长的话：“林教授，德国有句话——‘制造业的核心竞争力，在于知道什么东西不能外包’。苏州让我看到了同样的智慧。它没有放弃制造，而是把制造升级到了‘制造+研发’的复合形态。这个形态，可能是中国制造业未来二十年的主流方向。”","林怀南点了点头。他知道，苏州的转身，正在重塑整个长三角的产业版图。"],"characters":1343},{"title":"第三十二章：制造业的“机器人红利”","book":"潮涌双城记","chapter":32,"slug":"chapter-032","type":"chapter","paragraphs":["当天下午，林怀南和穆勒又去了昆山的一家自动化设备企业——华恒焊接。","华恒焊接的车间里，一排排工业机器人正在精准地完成焊接作业。火花四溅，但整个车间几乎没有工人。只有几个工程师在中央控制室的屏幕前监控着生产数据。","华恒焊接的创始人朱伟明，是一位六十多岁的老工程师。他早年留学日本，回国后创建了这家企业。如今，华恒焊接已经是国内工业焊接机器人领域的龙头企业，市场份额超过百分之三十。","朱伟明带着林怀南和穆勒参观了三条全自动生产线。每一条生产线都不需要人工干预——原材料从一端进去，成品从另一端出来，中间的所有工序全部由机器人和自动化设备完成。","“朱总，你们现在的用工情况怎么样？”林怀南问。","朱伟明苦笑了一下：“工人很难招了。我们十年前有一千两百名一线工人，现在三百名，产量是十年前的六倍。一线人数少了四分之三，可自动化设备、维修人员和外包的活也多了。还得把这几项都算进去，才能知道效率究竟好了多少。”","穆勒插话道：“这是‘机器人红利’。德国也经历了这个过程——劳动力成本上升倒逼自动化升级，自动化又反过来提升了生产效率和产品质量。我在江苏看到了和德国很类似的路径。”","林怀南在心里默默计算着。广东的制造业更依赖于源源不断的人口流入——深圳、东莞的人口还在净增长，年轻劳动力从全国各地涌入。江苏的制造业则提前感受到了人口老龄化和劳动力短缺的压力，被迫加速自动化转型。两种应对方式没有优劣之分，但会塑造出不同的产业结构。","广东的劳动密集型制造业会更快地向中西部和东南亚转移，留下的空间被高端服务业和知识密集型产业填充。江苏的劳动密集型制造业则会通过自动化改造，变成“人少但效率高”的技术密集型制造业。前者是“位移式升级”，后者是“原地式升级”。","回到车上，穆勒对林怀南说：“林教授，我有一个判断——未来十年的制造业竞争，不是看谁有更多的工人，而是看谁有更好的机器人和更聪明的大脑。江苏在这条路上走在了前面。”","林怀南没有回答。他看着窗外飞驰而过的稻田和厂房，心里想的是另一件事：广东和江苏，正在以完全不同的方式应对同一个挑战。一个依靠人口红利向外扩张，一个依靠机器红利向内深挖。两条路，最终都会抵达同一个目的地——更高质量的制造业。"],"characters":903},{"title":"第三十三章：无锡的“芯片江湖”","book":"潮涌双城记","chapter":33,"slug":"chapter-033","type":"chapter","paragraphs":["第二天，林怀南独自前往无锡。这座城市有一个低调但极其重要的身份——中国集成电路产业的重镇。","无锡的集成电路产业，可以追溯到上世纪八十年代。当时国家在这里布局了742厂和华晶电子，建立了中国第一条4英寸芯片生产线。四十年过去，无锡已经成为中国芯片封测产业的绝对龙头。","林怀南的目的地是长电科技——中国最大的半导体封测企业，全球排名第三。","长电科技的总部设在一片并不起眼的工业区里。但走进车间后，林怀南再次被震撼了。上千台设备在洁净室里整齐排列，芯片在精密机械臂的操作下，完成一道道封装和测试工序。整个车间的洁净度，达到了每立方米空气中微粒不超过一百个——相当于手术室的百倍标准。","长电科技的副总裁王建军接待了林怀南。两人在洁净室外的参观走廊里边走边聊。","“王总，芯片封测这个行业，外界了解得不多。”林怀南说，“很多人只知道芯片设计，不知道封测的重要性。”","王建军点头：“芯片制造分三个环节——设计、制造、封测。设计最出名，制造最困难，封测最默默无闻。但封测实际上是芯片从晶圆到产品的最后一道关，也是决定芯片性能和可靠性的关键环节。我们长电，每年封测超过一千亿颗芯片，全球每五颗芯片里就有一颗经过我们的手。”","“目前面临的最大挑战是什么？”","王建军的表情变得严肃：“最大的挑战是技术追赶。高端芯片的封测，比如3D堆叠、系统级封装、先进制程的封装，我们的技术和日月光、安靠这些国际巨头还有差距。差距在缩小，但需要时间。”","林怀南在笔记本上写道：无锡芯片产业的特征——长周期、重资产、高壁垒。这种产业的特点是：一旦建立起来，竞争对手很难复制。因为需要几十年的技术积累、上千亿的资本投入、几万人的工程师团队。","他突然想到了一个经济学术语——“沉淀成本”。在芯片这个行业，沉淀成本极高。建一条先进封测产线，动辄投资数百亿元，而且这些设备一旦安装，就无法挪作他用。这种高沉淀成本形成了天然的进入壁垒，也让已经进入的企业获得了垄断性利润。","走出长电科技，林怀南站在门口，望着远处的惠山。山不高，但轮廓清晰。","他想起了几年前看过的一份报告：无锡一地的芯片封测产能，超过了整个欧洲的总和。欧洲有几十个国家、七亿多人口，但在芯片封测这个环节上，输给了中国的一个地级市。","这或许就是全球化的悖论——分工越精细，某些节点的集中度就越高。无锡、苏州、深圳、东莞，这些中国城市的名字，正在成为全球产业链中不可或缺的关键节点。它们不是一个国家，而是一个网络；不是一个整体，而是一个系统。这个系统的韧性，在疫情和地缘冲突中经受住了考验，证明了自己是全球化时代最可靠的供给来源。","林怀南在暮色中走向无锡东站，准备坐高铁回上海。站台上人流如织，有背着书包的学生，有提着公文包的上班族，有拖家带口的游客。他们中的大部分人，可能一辈子都不会走进芯片工厂，也不会知道那些小小的黑色方块里藏着怎样的精妙。","但他们每天用的手机、电脑、家电、汽车，都在依赖着这些黑色方块运转。而这一切的起点，是无锡车间里那些精密运转的机器，和车间里那些默默付出的工程师们。","经济学的终极意义，或许就是把那些看不见的东西，变成看得见的福祉。","（本章经济学知识点：产业结构转型的加速度差异、新技术从已有技术中组合涌现、机器人红利、劳动密集型向技术密集型的转型路径、位移式升级与原地式升级、芯片产业的三个环节、沉淀成本与进入壁垒、全球价值链的关键节点、产业链韧性）"],"characters":1379},{"title":"第三十四章：广东的“工程师红利”井喷","book":"潮涌双城记","chapter":34,"slug":"chapter-034","type":"chapter","paragraphs":["二〇二八年盛夏，深圳南山区，一场别开生面的毕业典礼正在南方科技大学举行。","这所创办于2011年的年轻大学，在不到二十年的时间里，已经跻身中国理工科大学的前十名。2028届毕业生共有两千三百人，其中理工科占比百分之八十七，有六成以上的毕业生选择留在大湾区就业。","林怀南受邀作为嘉宾出席毕业典礼并致辞。站在讲台上，他望着台下那一张张年轻而充满期待的面孔，忽然想起了自己毕业时的情景。","一九八八年，他从中山大学毕业时，全班四十个人，有三十个选择了出国，剩下的十个中有八个去了外企，只有两个人留在了广东的体制内。那时候，“去美国”是所有优秀毕业生的共同梦想。","三十多年过去了，时代完全翻转了。","他在致辞中这样说道：“各位同学，你们今天做出的选择，和三十年前的人完全不同。你们选择留在大湾区，不是因为出不去，而是因为这里有全世界最密集的机遇。大湾区的人口平均年龄三十岁出头，人均GDP超过两万五千美元，科创企业密度全球第二，专利产出全球第一。你们要做的，不是问‘这个世界能给我什么’，而是问‘我能给这个世界创造什么’。”","典礼结束后，林怀南被一群毕业生围住合影。他注意到一个细节：这些学生的面孔中，有不少是非华裔的面孔——来自东南亚的、南亚的、中东的、甚至欧洲和北美的留学生。","他想起了大湾区最新的教育数据：2028年，大湾区内高校的国际学生总数达到了八万人，比五年前翻了一番。其中，来自“一带一路”沿线国家的学生占比超过百分之六十。这些人学成之后，相当一部分会留在大湾区工作，成为连接中国和世界的人才桥梁。","这就是人力资本理论的最新章节：一个地区一旦形成“人才虹吸效应”，就会自动吸引更多的人才汇聚。回流的人才带来新的知识、新的网络、新的资源，形成正反馈循环。大湾区正在经历的，就是这个循环的加速期。","林怀南回到车上，打开手机里的数据报告。他看到了一组让他心情激荡的数字：","2028年上半年，大湾区的发明专利申请量达到二十四万件，占全国总量的百分之三十一。PCT国际专利申请量占全国的百分之五十三。大湾区内从事研发活动的全职人员超过一百八十万人，相当于德国全国研发人员总量的百分之七十。","他轻声对自己说了一句话，声音低到只有自己能听见：“广东的工程师红利，正在井喷。”"],"characters":919},{"title":"第三十五章：另一种较量——城市治理的升级","book":"潮涌双城记","chapter":35,"slug":"chapter-035","type":"chapter","paragraphs":["二〇二八年秋，广州市城市规划展览中心。","一场关于“中国城市治理现代化”的高层研讨会正在这里举行。与会者包括全国十几个主要城市的市长和规划部门负责人，以及一批城市经济学领域的顶尖学者。","林怀南受邀做一个关于“城市升级与经济转型互动关系”的主旨报告。","他在报告中展示了三组数据：","第一组是城市密度对比。深圳建成区的人口密度达到每平方公里一万七千人，超过东京的一万四千人和纽约的一万一千人。高密度的好处是知识溢出效应更强——人在物理空间上越靠近，思想碰撞的概率就越高。但坏处是公共资源的人均供给压力更大——医院、学校、地铁、公园，每一样都需要更高强度的投入。","第二组是城市通勤效率。按同一套样本口径，广州平均三十八分钟，深圳四十一分钟，佛山三十二分钟，东莞三十五分钟。三座不到四十分钟，深圳高一些。更长的那一截通勤多在什么人身上，图上另有一栏。","第三组是城市公共服务均等化水平。珠三角九市的财政支出中，教育、医疗、社保三项民生支出的占比从2015年的平均百分之三十八提升到了2028年的平均百分之五十二。差距在大幅缩小，但佛山、东莞与深圳、广州之间仍存在十个百分点左右的差距。","报告结束后，一位来自成都的副市长举手提问：“林教授，广东四个一线城市的治理经验，对中西部城市有什么借鉴意义？”","林怀南想了一会儿，这样回答：“我的建议是‘三要三不要’。要因地制宜，不要简单照搬；要制度创新，不要只靠投入；要协同共治，不要各搞一套。广东的大湾区经验，本质上不是‘四座城市各自变强’的经验，而是‘四座城市在协同中共同变强’的经验。如果中西部城市搞的是‘单打独斗’式的升级，效果会大打折扣。”","当天晚上，林怀南在日记中写道：","“城市不只是钢筋混凝土的堆砌，也不只是GDP数字的加减。城市是数百万人的集合体，每个人的梦想、焦虑、奋斗、失败，都在这个空间里交织。城市升级的本质，不是让楼更高、路更宽，而是让更多人有机会实现自己的可能性。广东的四座一线城市之所以能同时升级，根本原因不是政策倾斜，而是它们为千万人提供了那个‘可能性’。”"],"characters":846},{"title":"第三十六章：大湾区的“溢出效应”","book":"潮涌双城记","chapter":36,"slug":"chapter-036","type":"chapter","paragraphs":["二〇二八年深秋，广东省政府发布了一组特别的经济数据。与往常只报GDP不同，这次发布的核心指标是“大湾区经济辐射半径”。","数据显示，大湾区核心城市对周边区域的经济溢出效应正在加速扩大。2028年前三季度，大湾区内地九市对粤东西北地区的产业转移项目达到三千四百个，投资总额超过一点二万亿元。大湾区企业在外省的投资项目超过九千个，覆盖了全国除港澳台之外的所有省区。","林怀南在广州的一个经济论坛上，用“水波效应”来解释这种现象：“大湾区就像一块投入湖面的巨石，激起的波纹一层层向外扩散。第一层是珠三角自身，第二层是粤东西北，第三层是周边省份，第四层是全国其他地区。每一层波纹的能量在递减，但覆盖的范围在递增。”","他展示了一张投资流向图：“大家看，大湾区对外投资的前五大目的地——湖南、江西、广西、福建、安徽。这些省份正在承接大湾区转移出来的制造业产能。比如赣州，已经成了大湾区电子信息产业的‘后花园’，深圳的电路板企业、东莞的连接器企业、广州的显示模组企业，正在把制造环节迁往赣州，把研发和销售留在本地。”","这背后的经济学逻辑，是经典的“中心—外围”模型。当一个经济中心发展到一定程度后，内部的要素成本会上升——地价、工资、房租都会上涨。这时，成本敏感型的产业就会向周边地区转移。中心地区保留高附加值环节，外围地区承接制造环节。两者形成分工互补的格局。","大湾区正在经历的，就是这个模型的现实演绎。深圳、广州、东莞、佛山作为四个“中心”，正在把自己的“外围”从粤东西北延伸到整个华南地区。它们辐射的半径越大，自身的资源配置效率就越高，核心竞争力就越强。","论坛结束后，一位来自江西的政府工作人员找到林怀南，紧紧握着他的手说：“林教授，谢谢您。您刚才讲的‘水波效应’，让我们这些承接大湾区产业的地区看到了方向。我们不做大湾区的‘殖民地’，要做大湾区的‘合伙人’。”","林怀南被这句话打动了。他在这位工作人员的名片上写了一行字：“中心与外围的良性关系，不是剥削与被剥削，而是互补与共生。产业转移不是甩包袱，而是配资源。大湾区需要外围的空间和劳动力，外围需要大湾区的资本和技术。这才是可持续的‘双赢’。”","晚上回到住处，林怀南坐在阳台上，望着珠江上点点灯火。夜风凉爽，带着水的气息。","他想起了很多年前，苏慕白在南京说过的一句话：“长三角的辐射是网状的，每个节点都可以成为中心。珠三角的辐射是圈层的，核心往外一圈圈扩散。说不上谁好谁坏，但决定了两个区域对周边的带动方式完全不同。”","林怀南那时不太理解这句话。现在他明白了。长三角的“网状辐射”让整个华东地区都受益，但每个节点受益的方式是“各自生长”。珠三角的“圈层辐射”让周边地区在承接产业的过程中“依附生长”——依附于核心城市的产业链，成为核心城市不可分割的一部分。","两种辐射模式，造就了两种不同的区域经济生态。长三角像一片森林，树和树之间保持着距离，各自向上生长。珠三角像一棵榕树，主干粗壮，气根垂落，每一根都能长成新的枝干，但终究连着同一棵树。","林怀南站起身，走回屋内。书桌上摊着一本翻到一半的书——简·雅各布斯的《城市经济》。他在书页的空白处写下了一行批注：“城市不是孤岛，城市是网络。网络的价值，不在节点本身，而在节点之间的连接。大湾区最大的成就，不是四座一线城市，而是它们之间的连接方式——高速、高频、高密度、低成本。这种连接方式，才是真正的核心竞争力。”","窗外的珠江上，一艘夜游船缓缓驶过，船上的彩灯在水中拖曳出一道长长的光影。","林怀南望着那道光影，轻声自语：“这或许就是经济学的浪漫之处——它把冰冷的数据，变成了温暖的故事。”","（本章经济学知识点：人力资本理论的人才虹吸效应、城市密度与知识溢出的关系、多中心组团的城市布局、城市公共服务均等化、经济辐射的水波效应、中心—外围模型、产业转移与资源再配置、网状辐射与圈层辐射的对比、城市网络的连接价值）"],"characters":1581},{"title":"第三十七章：产业链的“双循环”密码","book":"潮涌双城记","chapter":37,"slug":"chapter-037","type":"chapter","paragraphs":["二〇二九年春，东莞长安镇的一家精密模具厂里，老板李国华正在接待一批来自越南的客户。","这已经是今年第三批来考察的海外客户了。李国华的工厂过去只做内销，从前年开始，海外订单占比逐渐爬升到了百分之三十五。客户主要来自东南亚和中东，采购的是中高端的模具和注塑件。","李国华带着越南客商在车间里走了一圈。客商们频频点头，不时掏出手机拍照。一位越南采购商通过翻译问：“李总，你们的模具精度能做到多少？”","李国华拿起一枚刚下线的连接器模具，递过去：“正负零点零一毫米。使用寿命五百万次以上，价格只有德国同类产品的六成。”","越南客商对视一眼，露出了心动的表情。","送走客人后，陈思远从角落里走出来。他是来跟踪调研“产业链双循环”课题的。过去三年，他一直在追踪珠三角制造业的内外销结构变化。","“李总，您这一年的外销比例涨了不少。”陈思远打开笔记本。","李国华给陈思远泡了杯茶，说：“前两年国内房地产不行，家电、汽车的需求也跟着往下掉。我们的模具百分之六十是给家电和汽车配套的，国内订单一少，就得往外找出路。好在东南亚和中东的制造业这几年起来了，他们缺模具、缺设备、缺技术工人，我们正好补上。”","陈思远在本子上记下一笔——这就是“双循环”的微观现实：当外部需求波动时，内需提供了缓冲；当内需调整时，外需又打开了新空间。两条腿走路的企业，比只靠一条腿的走得更稳。","他追问道：“那您觉得，外销这条路能持续多久？会不会过几年东南亚自己的模具厂就起来了？”","李国华想了想，说：“会起来，但不是三五年的事。模具这行靠的是老师傅的手艺和几十年的经验积累。东南亚有便宜的劳动力，但没有我们的工程师队伍和供应链配套。我做一套模具，从钢材采购、热处理、加工中心、电火花、线切割到最后的装配调试，所有工序都在方圆三十公里内完成。东南亚那边，做个简单的冲压模都要等半个月的加工周期，怎么跟我们比？”","陈思远合上笔记本。他想起了一个经济学概念——产业集群的“不可复制性”。产业集群的优势不仅是成本低，更是速度快、灵活度高、配套齐全。这些优势是几十年积累出来的，不是靠政策优惠就能快速复制的。","走出李国华的工厂，陈思远站在路边，望着远处一排排整齐的厂房。这些厂房从外面看都差不多，但里面做的事情千差万别——有做模具的，有做注塑的，有做表面处理的，有做组装的。它们像一个巨大的生态系统，环环相扣，谁也离不开谁。","“这就是东莞的底气。”他在当天的工作笔记中写道，“不是某一家企业有多强，而是所有企业连在一起的时候，谁也搬不走。”"],"characters":1023},{"title":"第三十八章：城市更新的深圳样本","book":"潮涌双城记","chapter":38,"slug":"chapter-038","type":"chapter","paragraphs":["四月，深圳南山区蛇口。曾经的工业厂房和集装箱堆场，如今已经变成了一片充满活力的创意产业园区。红砖墙的老仓库被改造成了设计工作室、画廊、咖啡馆和共享办公空间，周末的市集上挤满了年轻人。","林怀南约了老朋友、深圳城市更新局的退休官员老周在这里喝茶。老周年过六旬，在深圳城市规划系统干了三十多年，亲身经历了这座城市从边陲小镇到国际化大都市的全过程。","“怀南，你还记得这里以前是什么样子吗？”老周指着脚下的园区。","林怀南环顾四周，摇摇头：“我上次来蛇口是二十年前，那时候这里还是一片旧厂房和堆场，没什么人气。”","老周笑了：“那是深圳城市更新的第一阶段——大拆大建。把旧厂房推倒，盖新写字楼、新住宅。后来我们发现，地是有了，但城市的文化和记忆也没了。从大概十年前开始，思路变了——不再简单地拆旧建新，而是‘有机更新’。能保留的保留，能改造的改造，把老的工业遗存转化成新的文化空间。”","林怀南点头：“这就是经济学上的‘沉淀资产的再激活’。厂房和设备虽然老了，但区位价值还在，空间承载能力还在。与其花大钱拆掉重建，不如用相对少的投入进行功能转换，把旧空间装进新内容。”","老周带着林怀南在园区里走了一圈。他们经过一个由旧冷库改造而成的美术馆，一个由码头仓库改造而成的联合办公空间，还有一个由老宿舍楼改造而成的青年公寓。","“每一栋房子的改造方案都不一样，因为每一栋房子的‘底子’不一样。”老周说，“我们请了十几家设计团队，要求他们‘先读懂房子，再设计方案’。有的房子结构好，就做办公；有的房子举架高，就做展厅；有的房子位置偏，就做艺术家工作室。没有一个标准答案。”","林怀南在一面保留着旧标语的墙前停下脚步。墙上斑驳的红字写着“安全生产大于天”的标语，旁边就是一家时尚的咖啡店。历史与现代在这里碰撞出奇妙的张力。","“这就是城市更新的最高境界——不是抹掉过去，而是让过去和现在对话。”林怀南对老周说。","老周点点头：“你说得对。深圳的城市更新，表面上是改房子、改环境，实际上是改人的观念。以前我们都觉得‘新’就是好，‘旧’就是差。现在大家慢慢明白了——有故事的旧空间，比千篇一律的新建筑更有吸引力。”","当天晚上，林怀南在日记中写道：“城市和人一样，不能永远只追求‘年轻’。真正成熟的城市，懂得珍惜自己的皱纹。因为每一道皱纹里，都藏着一个时代的故事。”"],"characters":951},{"title":"第三十九章：古镇的另一种活法","book":"潮涌双城记","chapter":39,"slug":"chapter-039","type":"chapter","paragraphs":["五月，苏慕白去了一趟苏州吴江区的同里古镇。","他已经很多年没有来同里了。学生时代他曾在这里写生，那时的同里安静、破旧、游客稀少，本地年轻人纷纷外出打工，留下的多是老人和孩子。","这次再来，同里的面貌大变。古镇的核心区依然保留着明清时期的建筑风貌——小桥流水、粉墙黛瓦、石板小巷，但巷子里的老房子多数已经被改造成了精品民宿、文创小店和独立书店。游客比当年多了很多，但不嘈杂，反而有一种从容的生活气息。","苏慕白在一家由旧米行改造的茶书吧里坐下，老板娘姓沈，四十多岁，是同里本地人。她早年在北京做设计，五年前回到家乡，把家族留下的老房子改造成了这家书吧。","“沈老板，听说同里这几年变化很大？”苏慕白点了一壶碧螺春。","沈老板一边泡茶一边说：“变化是大，但不是那种建高楼、修大马路的变化。而是我们这些老房子有了新的用途，老手艺有了新的传承，老故事有了新的听众。”","她指了指窗外：“对面那家绣庄，过去是做苏绣的，订单越来越少，差点关门。后来政府和几个设计师合作，把绣品从传统的屏风、旗袍转向了文创产品——书签、手机壳、帆布包。年轻游客特别喜欢，去年绣庄的销售额比五年前翻了四倍。”","苏慕白若有所思。他想起了经济学中关于“文化资本”的讨论。文化资本不像物质资本那样可以量化，但它的价值是真实存在的——一条老街、一门手艺、一种生活方式，这些东西一旦消失，就是不可逆的损失。同里的探索，恰恰证明了文化资本可以通过商业化运营实现“自我造血”——既保留了传统，又创造了经济价值。","“游客多了之后，本地人的生活有没有受到影响？”苏慕白追问。这是他最关心的问题。很多古镇在旅游开发中，本地居民被资本挤出，变成了空壳。","沈老板说：“这个问题我们想过。镇里搞了一个规矩——鼓励原住民参与经营，不鼓励大资本整片收购。现在镇上的民宿和店铺，百分之六十以上是本地人在经营。政府提供培训和低息贷款，但必须‘人房一体’——你得自己住在这里，才能开店。这样就保证了古镇是‘活着的古镇’，不只是一个景区。”","苏慕白点点头。这种模式在经济学上叫做“包容性发展”——经济增长的收益被更广泛的人群分享，而不是被少数资本占有。同里的实践说明，保护传统和发展经济不一定矛盾——关键在于发展的方式是否尊重本地社区的主体性。","离开同里时，苏慕白在镇口的石碑上看到一句话，是费孝通先生当年在吴江调研时写下的——“各美其美，美人之美，美美与共，天下大同。”","他把这句话拍了下来，发给了林怀南。配文只有四个字：“殊途同归。”","傍晚收到林怀南的回复：“珠三角的城市在向上生长，长三角的古镇在向内深耕。一个追求高度，一个追求厚度。各有各的美。”","苏慕白看着手机屏幕，笑了笑。他把手机揣进口袋，踏上了回苏州的高铁。","窗外的水乡暮色四合，稻田与湖泊在夕阳中交织成一幅温柔的画卷。"],"characters":1136},{"title":"第四十章：年轻人们","book":"潮涌双城记","chapter":40,"slug":"chapter-040","type":"chapter","paragraphs":["二〇二九年夏天，广州大学城的一间阶梯教室里，一场特别的分享会正在进行。分享者不是教授，也不是企业家，而是一群刚刚毕业三年的大学生。","他们有一个共同的身份——大湾区“青年创业者联盟”的成员。这个组织是三年前由几位毕业生自发成立的，如今已经聚集了一千两百多位年轻创业者。","陈思远作为调研者旁听了这场分享。他注意到一个有趣的现象：这些年轻创业者的创业方向五花八门，但大部分都和大湾区的产业集群深度捆绑。","有人做智能硬件的——在深圳做研发、在东莞找代工、在广州做电商运营；有人做跨境贸易的——在广州选品、在佛山找工厂、在香港做国际结算；有人做文化创意的——在深圳接设计项目、在东莞做打样、在顺德做量产。","“我们不是一个人在创业。”一位做智能家居的年轻人对台下的听众说，“我们是一个生态在创业。我需要什么，只要在群里喊一声，第二天就有人帮我搞定。做硬件的、做软件的、做设计的、做供应链的、做物流的、做渠道的——整个大湾区就是一个巨大的创业加速器。”","陈思远在笔记本上写道：“这就是‘网络效应’在创业领域的体现。一个人创业的成功率有限，但一千个人在同一个小生态里创业，每个人的成功率都会因为别人的存在而提高。因为你可以借用别人的能力，别人也可以借用你的能力。合在一起，整个网络的能力超出了个体能力的简单加总。”","分享会结束后，陈思远和几位年轻的创业者聊了很久。他们中最小的只有二十四岁，最大的也不过三十出头。他们的脸上没有上一代创业者那种沉重和焦虑，取而代之的是一种从容的笃定。","一位做跨境电商的姑娘对陈思远说：“陈博士，我爷爷那一辈是逃荒到广东的，我爸爸那一辈是打工到广东的，到了我这一辈，是毕业之后留下来创业的。三代人，同一个目的地，但做的事情完全不一样。这大概就是时代在进步吧。”","陈思远被这句话深深打动了。","他想起库兹涅茨研究现代经济增长时写过的产业结构变动，忽然觉得自己记少了一项。光记一个姑娘今天卖到哪里，往后再找她的家人时，还不知道她爸爸当年的厂门在哪里。","每个人都在前人铺好的路上继续向前，每个人都在为后人铺就新的道路。一代人有一代人的使命，一代人有一代人的贡献。","陈思远离开大学城时，天色已晚。珠江对岸的广州塔亮起了彩灯，把夜空染成了柔和的橙色。年轻的创业者在江边跑步，成群的候鸟从江面上飞过，远处传来轮渡的汽笛声。","他掏出手机，给导师林怀南发了一条信息：","“老师，我突然明白了——经济学的终极意义，不是解释数字，而是理解人心。”","过了一会儿，林怀南回他，说起凯恩斯曾把经济学看作帮助人推理的方法。","“你这回问了祖父、父亲和女儿三个人。下次把没留下来创业的那一个也去问问，方法就又好些了。”","陈思远把这句话读了三遍，然后关上手机，深深吸了一口珠江边温润的夜风。","明天还有新的田野调查在等着他。","（本章经济学知识点：产业集群的不可复制性、双循环的微观逻辑、沉淀资产的再激活、城市有机更新、文化资本与包容性发展、网络效应在创业中的体现、人力资本代际积累）"],"characters":1210},{"title":"第四十一章：华南F3的集结","book":"潮涌双城记","chapter":41,"slug":"chapter-041","type":"chapter","paragraphs":["二〇三〇年春，广州珠岛宾馆，一场不寻常的会议正在举行。","广东、广西、海南三省区的党政主要负责人齐聚一堂。会议桌上没有摆放常见的双边合作协议，而是一份厚达三百页的《华南区域协同发展三年行动计划》。","三省区在这一天启动华南经济圈行动计划。广东继续同广西、海南洽谈产业协作，先试一批可核查的项目。桌上的基线是三省区现价GDP约占全国百分之十五，几位代表更关心来年有哪些工作已能兑现。","林怀南作为战略顾问受邀参会。他坐在后排，翻开那份计划书，里面密密麻麻列出了上百个协同项目——从跨省高铁网络到产业飞地共建，从人才双向流动到生态环境协同治理。","广西的代表率先发言：“我们最需要的是产业承接。广东的电子信息、新能源汽车、生物医药产业正在向外溢出，广西有土地、有劳动力、有水电资源，希望成为大湾区产业转移的第一站。”","海南的代表接着说：“海南自贸港的政策优势需要和广东的产业优势结合。我们希望在免税购物、医疗旅游、国际教育等领域和广东深度合作，把海南从‘旅游岛’升级为‘消费+服务+创新的综合经济体’。”","广东省的代表微笑点头，表态道：“广东有责任也有意愿带动周边兄弟省份共同发展。过去我们是‘单打独斗’，现在要‘组团出击’。华南F3，缺一不可。”","林怀南在笔记本上写下三处地名，写到最后一处，墨水积成一个黑点。他放下笔，问人把那份投资项目表传过来。资金来源、拟建面积和意向产值都填了，有一栏叫持续费用，还是空的。","“请问这几处园区，谁负责第六年的排水和夜班车？”","散会时间已到，坐在他前排的广西代表回过头。那人早年做过厂长，想了想，说工厂可出一部分，但要等进了工厂才有流水。地方先出的话，合同上要有期限。广东的代表也站住了，说那边可以出订单派人，若项目停摆，回头撤设备的费用谁来担？海南来的人将手里的纸折了个角，提议先不要把三地都拴在同一项大工程上。成熟一个做一个，试停一次也好。","三个人又坐下去，林怀南在表后添了几行。柳州先拿一批零件试跑，把退货次数和合格率一起记下；广西港口试一条能改道的货运线路；海南先将跨海就医的问题从住院楼的概算中提出。凡要接着花钱的事，都写明谁得益、谁出钱、何时复查。至于头一年看不清的项目，可以暂缓。三百页的计划已经装订好了，这几行挤在最后，复印出来只有半张。","会后，秘书送来一份要发的简报，有一句预测，说三省区合计的份额将在十年内翻到很高。林怀南把它留在纸上，没有替他们填一个新数。他在旁边写，已经会的活换个地方再做一遍，总量未必增加；一位农民能在家边多得一份合适的工作，差别倒可能从此开始。二者各找各的凭据。","出了宾馆，雨还没住。林怀南撑开一把伞，给陈思远打电话，请他夏天先去柳州。到了那里，不必参加揭牌，中午到厂里找个做过废品的人吃饭。电话挂断前，他听见对面翻动日历的声音。"],"characters":1138},{"title":"第四十二章：柳江边的退货单","book":"潮涌双城记","chapter":42,"slug":"chapter-042","type":"chapter","paragraphs":["二〇三〇年夏，陈思远到柳州，住在离厂门不远的一家旅馆。夜里下了雨，早晨街边蒸米粉的锅上起着雾。他吃完第一碗粉，出门的时候碰见覃工。覃工来接他，手里抱着一件电机外壳，说后备厢太闷，怕到了厂里才发现里头的冷凝水。","两个月前，一家广东车企把三百件外壳的试单交给柳州一家配件厂。报价比原厂低一成，第一批交期还提早三天。车企装上去，抽检却有五件漏气，把一箱退回来了。退货单上只有一行字，写着不符合要求。厂里开了半夜的会，第二天照旧发车。旧图纸的公差他们没有超，照着同一张图再车一遍，谁也说不清会有什么不同。","陈思远和覃工去看检验，两个师傅拿着量具，一个先量空壳，一个装上盖子再量。覃工让他们交换一次。装好盖子的在台上搁了一会儿，压力表缓缓下行。广东的试验台多做了一道热循环，柳州的厂没接到那一页要求。再去翻合同，图纸责任归车企，加工质量归供应商，下单的业务员并没有收到最终的检验规范。","管车间的女工姓罗。她不声不响地从档案柜拿来四个旧夹子，其中一本是十年前做燃油车的记录。她从最底下找出一张工序卡，说老件也有类似的毛病，排查时要看压合面和拧紧次序。广东来的工程师说愿意把发现的问题拿出来，可这套做法得在广东试验台上再做几回。罗师傅请他先把图画在纸上，车间里八个人都要能照着做一遍。","夜里，两头算过返工账。广东原供货商的出厂价高些，稳定性已知；新厂做量产前要花检验费，短期每件未必便宜。谁出试验费成了最后一个坎。最后车企出第一轮费用，柳州厂承担厂内返工，工艺资料双方都能用，今后只按合格量结算。采购员想写一个排他条款，覃工把样件放到他面前，说厂里若只能接一家订单，就没有那笔钱再养两个人继续做试验。","还有一道账是运输。那五件小样寄回去用快件，两边的试验员照常上班。等着同一车外壳的装配工却补不了这半天。广东采购员想把延误都列给外省厂，罗师傅翻出发来旧图的时辰，问是否先把两厂都耽误的工时抄出来。他后来果真照抄，把误用旧文件的那班工时也交给自己的上司。","头一批新的外壳过了两个星期才交出来。三百件中有两件装车前被挑出，第三件曾让人误判，复验后一并留样。陈思远把结果记成三个数。厂长看过，提出能不能只留下出货的二百九十八件。他说先留样，等九十天后查一查能不能兑现保修。覃工便拿订书钉钉住退货单，挪到出货单前面。","他从厂里出来时，覃工指给他看柳江上过桥的车。一车刚载着新样件出去，一车空着回来。早先他只问来了多少厂，现在请陈思远再来时问一问，有没有哪一张图是从这头送过去的。"],"characters":1021},{"title":"第四十三章：空箱走哪条路","book":"潮涌双城记","chapter":43,"slug":"chapter-043","type":"chapter","paragraphs":["秋收以后，北部湾港的日头还很晒。陈思远戴一顶借来的安全帽站在堆场边，看见一排蓝色集装箱，几只有封条，十几只没有。港口调度员老韦把名单给他看，说没有封条的明天要上火车，留给柳州装货。","陈思远先到港，是为了查一件事。三地合作会上有人给工厂算过账，北部湾港离一些客户的航线更近，铁路运价也便宜，整条路线每箱能省四百块。两家厂照着运过，一个月后却又改走原来的线。调研表只问了是否愿意继续用，有人答愿意，预约栏依旧空着。","老韦拿粉笔在地上画了两列小方格。船开走一列，货车送来一列。出厂货物赶得上一周一班船，就有那四百块省；错过一个截关日，货要在港停几天。要是车到柳州卸完了，回头还配不上一个空箱，司机回程也收钱。厂里的财务算便宜时，把等待和空箱都放在别处了。船公司照自己的账发班，不能为一家的两箱货多跑一趟。","午后有个司机来换单。老韦让他从架上找一只箱，司机朝那一排蓝箱看了两眼，走到最尾上，说这一只不能用，地板透了光。他把箱门推开，脚踩过一道缝，亮处直通地面。他宁可拖一个重些的旧箱，路上费一点油，也不想在下雨天赔掉一车货。老韦没有争论，在单子上写下停用。陈思远把那张单的样式抄了一份。","三家公司果然凑不出一张全年的货量承诺。第一次试，约好每周各报最迟装车日，货代将能拼的拼在一张表上，七十二小时未凑齐便转发原线。空箱由港口向船公司借，两处工厂共用堆点，能接着装的箱就近周转。到港说不准时，企业先把给客户的期限多留一天。条件写完，有人问今后算谁抢了谁的生意。老韦说，先各走两条线，谁的箱少赔一天租费，谁可以把账说给同行听。","有一家花生加工厂愿意把散单凑过来，一问才知空箱可到陆上堆点换，不用专程回港。老板同老韦掰手指算过，省的是司机掉头跑回去的一段，落到他账上却得等下月结运输费才能见到。他问能不能留张回执。老韦找出一个胶皮本，给每一次交还留了时间和号码，头一页把新线路欠的空箱数也记了进去。","第一周少了四个箱，第二周多了六个。第三周台风逼近，港口停了一夜，四车货改从另一条线出。整体一算，节省比原先预计少了一半，至少没叫那四家买主等到停工。陈思远没有把多出的港杂费另藏一行。他把按时交、晚交、改道三种箱子并列，每种各算每箱的全程费用。","回去之前，他又到堆场看看。那只坏了的箱已经吊开，空出一块长方的地方来，露出下面被雨打湿的水泥。旁边两个工人在等下一辆车，一人拿红漆修朝向箭头。车来之前，箭头得朝着出口。司机看得明白，走的时候便少倒一次车。"],"characters":1010},{"title":"第四十四章：药箱过海","book":"潮涌双城记","chapter":44,"slug":"chapter-044","type":"chapter","paragraphs":["二〇三一年春，海口的轮渡码头旁，一位卖早点的妇人时常问来人，今天有大风吗？她丈夫的手术排在下周。风大停航，他和在广东来的女儿未必能同日到医院。她在摊前翻着手机，医嘱看了三遍，挂号以后该在几点到，还是记在纸上才安心。","林怀南是到海口参加考察的，同行有自贸港研究院的杨博士。院方想建一幢国际医疗服务楼，效果图从南边一直铺到海上。报告测算了单床收入，床上会住什么人，写得相当简略。林怀南问护士长平时哪一科最难排，她说内地就医的人多半先拍一张片拿过来，同样一张片，有的地方能接着用，有的地方还要重拍。跨省跟踪病人有困难，医院怕出了事只剩一张外院的单。","护士长给他们看了一封求助的信。写信的人是从岛内北部来的，几次做完复查再坐车回去，孩子在外地打工，回来一趟请两天假。病不算重，折腾的日子却不少。杨博士问能否给转诊的人留一些号，院方答，固定号留得太多，临时来看的病人会怨；天天临时留，又很难提前安排。谈到最后，墙上那张楼的图被挪过一边，腾出半面墙挂了一张旧的病房排班表。","他们先挑了一类检查作试点，让当地医生把可核查的原资料送给负责复诊的医生，病人不便联网时由窗口在场帮助。原资料不足再重做，请当面说出理由。试点留半天给复杂病人来院，余下的复诊看具体需要安排。杨博士把账列成张纸：医院少做了一项收费检查，路上的家庭省了半天，还有承接诊疗责任的人需要时间审核。若按检查张数考核，医院让一位病人少跑一次，自己却少记一笔。负责拨款的人答应在三个月里另记复诊质量和全程耗时，再议补偿。","试行第一个月，有些病人仍由老路线来，登记时却漏了等车的工夫。一个年轻护士在午饭时去问窗口，问到一个人坐了三小时才拿到号，病历上从开号到看完只记二十分钟。她把挂号前后的等待分写在两张纸上，请研究院挑一批人复问。杨博士原以为只需看一次院内系统，接到纸条，当天也把星期二空了出来。","那位卖早点的妇人带了一个红药箱来，塑料扣坏了一边，她用细绳扎住。护士从里面认出需要核对的那几页，问她女儿何时到。她说女儿早晨接了电话，已经跟船上了，到码头还能赶上交班。护士叫她先把箱子放进柜里，空出手吃点东西。一边坐着的老病人给她让了半张椅子。","林怀南出来时问杨博士，高端服务的投资还做不做。杨把原计划折成两叠。楼可以分期开工，他要先写明新增了多少可用时间、服务什么人。病房门口有个钟，玻璃裂了一道细缝，指针仍好好地向前走。林怀南等了一会儿，才看见医院里的上午，比他在港口等船时长得多。"],"characters":1009},{"title":"第四十五章：上游的一场雨","book":"潮涌双城记","chapter":45,"slug":"chapter-045","type":"chapter","paragraphs":["二〇三一年初夏，广西梧州连下三天雨。涨水以前，河边一位姓袁的护堤员把卷尺固定在石栏上，叫陈思远来辨认去年淹过的线。石栏下面有一截被泡松的木板，涨起来就是下游村民走的便道。袁说，河面看上去宽，积水退掉以后，还是那几块砖最难干。","这趟他是来算西江上下游的钱。佛山的几家用水企业担心枯水期供应，提议出钱支持上游治理；梧州这边也有用水户，不愿意拿钱签了约，连自己来年用多少水都要等下游核准。有人将水质、水量与防洪混在一个指标里，屋里投影上全是曲线，发言的人一问基准是哪一年，笔尖停住了。","陈思远跟着值班员下到泵房。窗子开得很低，能看见湿漉漉的岸。值班员说夏天雨大，指标本来就会上上下下；有时候上游把污水管补好了，一场大雨把地表污物冲进河里，账面又比上月难看。他把两张同日化验单拿出来，一张是上游入境，一张是出境。倘若来水已经变了，只逮着末尾一张开罚单，下面的人连从何处查漏都不知道。","下午，协商改到了离水边稍远的会议室。佛山来的女财务经理翻本子，说本公司愿给一笔钱，可要知道何时拨给谁。袁说河边有两个多年不换的排口，可以先做。陈思远主张付两笔，一笔购设备、补管网，凭工程、运转记录给，第二笔看一段时期的成效。评估水质要说明水量和上游来的背景变化，样本交两家实验室复查。遇上洪水先按已有调度规则保安全，事后公布异常记录。厂里若有未经处理的排放，该罚照罚，协议需要的补偿单归另一册。","那经理问这笔钱往后能一直给吗。袁靠窗坐着，答说大家的地都搁在水边，一年一年重新讲价，谁也不敢先把管子埋下去。他请她把最低承诺期写上。她算了半天，先写三年；另几个人看了，其中一人补了句中途可复核，谁毁约谁负责停工后的支出。陈思远觉得不算周全，但当钟敲过五下时，每个签名旁边都已有一个回去要查的人和一件要查的事。","随后还商量了一件不起眼的事：上下两处的老设备报时分别差了几分钟。值班员说水走得快，碰上急雨，同一点的两张表也未必记的是同一阵水。他们试着把手表和机器对准，拿一个晴日的数值先重算。有人要求当场承诺降到哪个刻度，财务经理把笔搁下，请过一个雨季再议。那一晚谁也没填预期能拿多少钱。","傍晚雨停，下游的孩子结队来找袁，想知道明日能不能走那条便道。袁没立刻应承，领他们去看石栏的水印。从那里看去，水势似在放缓。一个孩子把卷尺拉到木板面，另一个替他压住头，看罢记下了四个数字。陈思远把他们让在前头，站在雨后的风里等着。"],"characters":987},{"title":"第四十六章：两本地租账","book":"潮涌双城记","chapter":46,"slug":"chapter-046","type":"chapter","paragraphs":["入秋，苏慕白到苏北看一个由南北两地共建的园区。新修的主路平平整整，人少，树小，路口的灯亮得很早。下车后他走了一段，看到工厂隔墙有条土路，菜农将筐放在独轮车上，挑了块没被压坏的路面走。","园区提出再开两百亩工业地，聘来的会计按厂房全租完列了一份十年表。账上头三年亏，第四年转盈。苏慕白请他到墙边站一会儿，看看空的窗有几扇。会计当他是来挑错，忙说明今年那两家有意向，再把租金打低些应该会来。苏没有问价，先问现在空着的那一间打算给谁看。会计答，房顶漏水，还没排上修。","他们到土路另一侧找菜农歇脚。姓冯的菜农把旧土地图拿来，红线正过他借给邻居用的一块地。他家两人这季做完想续一茬，听说要征，没舍得装新的滴灌带。苏问一亩收多少，冯说看天气，有一年一万多，有一年赔种钱。他请老冯把亲友在这儿搭工的日子也说说。算到最后，冯把女儿从城里回来送货的两趟划掉了，说她原本就该回来看看两口子。会计记了往返油钱，又在旁边留出一格，说园区职工坐车的账也要问问才知道。","下午的会议改用两本账。第一本是项目运营，租费、空置、维修、还债照常记；第二本算社会的得失，原有土地收入、呼吸的空气、工人转岗、通勤变化各归一处。同一笔工资不能一边当全额社会收益，一边把工人原来挣的忘掉。即使新厂愿交高租，若公家还要先修一条很少有人走的路，设备和管网的钱也须付。有人不同意记买地钱，说那是左手给右手。苏慕白请他把征地补偿单和土地原有收益单分开放，前者有一部分是转移，后者是用了这块地之后少做的事。两张单子要分别给不同的人看。","会计后来添了一页，把同一幢楼在高低两种出租率下各算一遍。有人说等厂商来了租出去便是，他便请那人把往年春天的退租单拿来。退租单很薄，有一张污着半杯茶，背面写着搬机器的运费。会计把这笔也记了，连给旧厂房装消防的工期都问了人。柜里一盒外地企业的名片仍在那里，他这次没拿来当作租约。","两个月后，园区先修了漏屋，没有动那两百亩。南边来的配件厂先租一层，半年结一次单，园区给做过转岗培训的人留了面试名额。后来添了一班公共汽车，绕村口停一次，把菜农旧日要走的一段地给接上了。项目比预计更小，账上也写明还有可能退租。","苏慕白收到消息时在整理讲义，讲义里有一张租金随距离变化的图。他把上面原有的公路改成客车路线，在线边加了一点，写着老冯送菜的地方。有学生问他那个点为何离轴那么远。他说，画图的人以前只从园区门口开始量。"],"characters":984},{"title":"第四十七章：三张上班表","book":"潮涌双城记","chapter":47,"slug":"chapter-047","type":"chapter","paragraphs":["二〇三一年冬，清远有阵冷风。飞地园区尚未满租，办公室在尚无暖气的二楼。黄主任搬来三张桌子，一张给广州来的人，一张给本地企业，余下一张搁着开水壶和请人带来的三叠招工单。","三份表分别是早班、晚班和周末班。条件写得漂亮，每月五千起，包吃住。一个姓梁的车间主任翻到第二页，问最后一班客车几点。他在广州干过，后来回清远照应母亲，知道好多乡亲也想在本地找活。晚班下了车，转乘的小巴早已回站；要等第二天的头班，纸上这份工作便又回到外地人的宿舍里。","广州来的经理说可把宿舍添一间。梁说，有两个人这周就能来，她们本来会做最缺的检验，只是家里有老人。去年一位愿住宿舍的工人因为小孩放学无人接，还是退了工。经理算住宿费比班车便宜，问能否让他们坐摩托。梁没答，拿起办公桌上的笔，把村道上冬夜路滑的两个弯画出来。经理认得一处，他来的时候在那儿减了两次速。","黄主任算了园区另一笔钱：已投用的厂房若招不满，窗口补贴多少都收不回服务费；若一上来包一条新线路，班少人少，运营方撑不了几个月。三家企业决定先把换班时间错开十分钟，租一辆小车接驳已有客车，岗位培训改成两周的白班，最晚一趟有人当值接电话。园区负责三个月的缺口，三个月后按实际乘车记录分担。广州来的经理提议每个人打一次票，于是梁去请客车站一起定刷卡的方法。","第一天小车误了点，八个人站在村口等，其中一个骑车走了。第二天梁自己坐小车，从头走到尾，发现车从北门出厂，要先绕一个大圈过门禁。他去找管安全的大爷，两人在布满灰尘的厂区图上找到一扇早年留的便门。修好照明，划一段步行线，小车的时间便少花六分钟。梁把新路线通知每一班，亲手在车门上贴了电话号码。","有一位工人过了培训，仍没有按原定的日子上工。梁去一问，才知道她怕领了班车补助，少了过去临时摆摊的收入，在家里几日也没算完。梁递给她本月的班次，由她挑能来的日子试两周。她实际坐了七趟，后来公交所拿到的乘车表上，才有了这七次来回。","他给在广州的旧同事寄了一封短信，问有谁愿意回来教两周。先答应的是一个女同事，她说丈夫若能接一阵早班车，她就可以来。梁在上班表留出一格，把原先不记在园区账里的接送时间填了进去。黄看过，也加了一格，写作“离岗原因”，请人月底不要漏掉离职的人。","年后，上头要来人看飞地园区。办公室备好两张签约和投产的表，想问还需不需要一张欢迎词。黄主任把卷成一卷的上班表放到门边，说来客若有空，让他先跟着坐一趟车。广州到这里只消两个多小时。进厂那最后两里地，他们花了一个冬天。"],"characters":1020},{"title":"第四十八章：粤北的曙光","book":"潮涌双城记","chapter":48,"slug":"chapter-048","type":"chapter","paragraphs":["二〇三二年春，广东清远。","这座位于粤北的山城，过去几十年一直是广东经济版图上的“洼地”。珠三角的繁华似乎与它无关——没有深圳的科创，没有东莞的制造，没有佛山的商贸，清远守着北江和青山，却始终没能找到自己的节奏。","但变化在悄悄发生。","林怀南驱车从广州出发，沿着乐广高速一路向北。两个半小时后，他进入了清远高新区。眼前的景象让他有些意外——一片片崭新的厂房沿着山脚排列，工地上塔吊林立，路边的招聘广告牌上写着“月薪五千起，包吃住”。","接待他的是清远高新区管委会的副主任，姓黄，四十出头，原本在深圳工作，三年前作为“粤东西北人才帮扶计划”的干部来到清远。","“林教授，您来得巧。”黄主任带着林怀南走进一栋正在装修的大楼，“这是我们和广州开发区合作共建的‘飞地产业园’。广州那边负责招商和运营，我们提供土地和配套，税收五五分成。”","“飞地经济”这个概念，林怀南很熟悉。它指的是跨行政区划的经济合作模式——发达地区把产业项目放到欠发达地区，双方共享收益。这种模式在长三角已经有了一些探索，但在广东，清远算是走在前面的。","“现在有多少家企业入驻了？”林怀南问。","“已经签约的有八十七家，正式投产的有四十二家。”黄主任说，“大部分是从广州和佛山转移过来的，做电子元器件、医疗器械、汽车配件的都有。还有一些是做数据中心和云计算服务的——珠三角的电价贵，清远的水电便宜，服务器放在这里，一年能省不少电费。”","林怀南在一家做医疗耗材的企业里转了转。生产线上的工人多是本地人，四五十岁的妇女居多，戴着口罩和手套，在流水线上熟练地操作着。","车间主任是个三十出头的小伙子，从广州回来的清远本地人。他告诉林怀南：“以前在广州打工，每个月房租就要两千多，一年到头存不下钱。回来之后，工资少了点，但不用租房了，还能照顾老人孩子，日子过得比以前踏实。”","林怀南在车间门口站了一会儿，看着那些工人专注的样子。她们可能不懂什么是“产业转移”，也不知道“飞地经济”这个词，但她们知道——家门口有了工作，不用再背井离乡了。","这大概就是经济发展的最朴素的意义。"],"characters":845},{"title":"第四十九章：从“追赶”到“共建”——广西的自我觉醒","book":"潮涌双城记","chapter":49,"slug":"chapter-049","type":"chapter","paragraphs":["二〇三二年夏，广西柳州。","柳州是中国西南的工业重镇，以汽车和机械制造闻名。但过去十年，柳州的传统支柱产业——燃油汽车和工程机械——面临着巨大的转型压力。","陈思远来到柳州时，正赶上当地最大的一家车企发布新一代新能源汽车。发布会现场人山人海，新车的续航里程、智能驾驶配置、充电效率被一一展示。台下掌声不断，媒体的闪光灯此起彼伏。","接待陈思远的是柳州市工信局的副局长，姓覃，四十多岁，本地人，学机械出身。","“陈博士，您可能不知道，柳州这几年在新能源汽车上下了工夫。”覃副局长带着陈思远参观整车工厂，“电池有外购，也有联合开发，电机有些工序已能在本地做。厂里的人把供应商的两项改进也登记下来，省得功劳只记在整车厂头上。”","“转型的动因是什么？”陈思远问。","覃副局长坦诚地说：“压力。燃油车的市场在萎缩，如果不变，整个产业链就完蛋了。市里五年前定了一个目标——用十年时间把新能源汽车的产值做到全市工业总产值的百分之四十以上。现在已经达到了百分之二十八，还有几年时间。”","陈思远注意到一个细节。柳州的新能源汽车产业，并不是简单承接广东的转移，而是和广东形成了“分工合作”的关系。柳州做整车和核心零部件研发，广东做智能驾驶软件和电池管理系统，两地的企业互相采购、联合开发。","“以前我们觉得，广东就是来‘收割’我们的。”覃副局长说，“现在不这么想了。我们有自己的优势——工业基础扎实，工程技术人员多，制造成本相对低。广东有软件和市场的优势。两边合在一起，比单打独斗强得多。”","陈思远在笔记本上写下了一行字：“从被动承接到主动共建——广西的工业重镇正在找回自己的节奏。”","傍晚，陈思远站在柳江边，望着对岸灯火通明的工业区。这座城市的转型之路还很漫长，但它已经走出了最艰难的第一步——不再把广东当作“施舍者”，而是当作“合作伙伴”。"],"characters":746},{"title":"第五十章：海口的选择——守住自己的节奏","book":"潮涌双城记","chapter":50,"slug":"chapter-050","type":"chapter","paragraphs":["二〇三二年秋，海口。","林怀南又来了。这次是参加海南自贸港的一个闭门咨询会，议题只有一项——“海南的产业选择：到底做什么、不做什么？”","这个议题之所以重要，是因为过去几年海南在产业方向上有过不少摇摆。旅游、免税、金融、科技、农业、航运——每个方向都有人在推动，每个方向都有理由，但资源是有限的，什么都想做等于什么都做不好。","闭门会上，十二位专家各抒己见。有人主张重点发展金融科技，因为海南有自贸港政策，可以做跨境资金流动的试验田；有人主张做深海科技，因为南海的资源和战略地位；有人主张深耕热带特色农业，因为这是海南最独特的自然禀赋。","林怀南是最后一个发言的。他没有急着给建议，而是先讲了一个经济学的小故事。","“韩国半导体企业早期也借助技术引进、设备采购和国际市场，从模仿和生产中积累经验，再投入研发。公开的成果有一年早，有一年晚，来路是几十年的训练和投资。海南要做的事不全相同，但填写投资期限时，可以把这段历史放在手边。”","他停顿了一下，接着说：“海南现在面临类似的选择。免税和旅游来钱快，但门槛低、竞争大，谁都可以做。深海科技、种业、生物医药这些东西难做、周期长，但一旦做成了，别人抢不走。我的建议是：免税和旅游要继续做，因为它们是海南的‘现金流’。但要把最大的耐心和资源，留给那些‘慢但不可替代’的事情。”","会场安静了片刻。海南自贸港研究院的杨博士点头说：“林教授说的‘现金流+护城河’策略，我完全赞同。短期靠免税吃饭，长期靠科技定盘。”","会议结束后，林怀南又被杨博士拉着在海边的栈道上散步。","“林教授，您觉得海南有那个耐心吗？”杨博士问，“从政府到企业到老百姓，大家习惯了快钱，要让所有人接受‘慢生意’，不容易。”","林怀南想了想，说：“耐心不是天生的，是被逼出来的。海南现在的土地、环境、人口规模，都决定了它不可能走广东那种大规模工业化的路。逼到那个份上了，自然就会去走那些‘别人走不了’的路。关键是政府要稳住——不做短期政绩工程，不搞泡沫式的招商引资，踏踏实实地把‘慢变量’一个一个做起来。”","杨博士望着远处的海平线：“‘慢变量’……这三个字说起来容易，做起来真难。”","林怀南笑了笑：“经济学里最难的事，就是在所有人都急着赶路的时候，你敢停下来看看方向。”"],"characters":919},{"title":"第五十一章：广东的“退一步”","book":"潮涌双城记","chapter":51,"slug":"chapter-051","type":"chapter","paragraphs":["二〇三三年春，广东省政府发布了一份引发广泛讨论的文件——《关于优化省内产业布局、推动区域协调发展的指导意见》。","这份文件的核心内容只有一条：广东将“有意识地”放缓珠三角核心区的工业用地审批，同时加大对粤东粤西粤北地区的产业扶持力度。简单说——珠三角要“退一步”，把空间让出来；粤东西北要“进一步”，把产业接过去。","林怀南在广州参加了一场关于这份文件的媒体访谈。记者问：“林教授，广东主动放缓珠三角的发展速度，会不会影响广东在全国的领先地位？”","林怀南的回答很坦率：“你说的‘发展速度’是指GDP增速。如果只看增速，放缓工业用地审批确实会让短期数据不好看。但广东现在的问题不是‘够不够快’，而是‘够不够均衡’。珠三角的产业密度已经很高了，土地开发强度超过百分之三十的地区比比皆是。再往里塞工厂，边际效益是递减的——不仅不划算，还会挤压生活空间、推高房价、增加通勤成本。”","他接着解释道：“经济学上有个概念叫‘边际收益递减’。当一个地区的产业密度超过某个临界点之后，每增加一个单位的新投资，带来的收益会越来越少。与其在珠三角的‘最后一寸地’上硬挤，不如把这些项目引导到粤东西北。那里的边际收益更高——投资同样的一块钱，在粤北能带来更多的就业和增长。”","记者追问：“那广东会不会被江苏追上来？”","林怀南笑了：“江苏从来没想追广东，江苏在走自己的路。广东要做的是走好自己的路——这条路不只是‘做大总量’，还包括‘分好蛋糕’、‘带好邻居’。改革开放四十多年，广东从全国人民的打工地变成了全国第一的经济大省，现在到了反哺省内欠发达地区、带动周边兄弟省份的时候了。”","这篇访谈发表后，引起了广泛的讨论。有人赞赏广东的胸怀，有人担忧广东失去动力。但林怀南知道，真正重要的不是外界的评价，而是广东内部是否真的达成了共识——发展到了新的阶段，策略必须跟着变。","当晚，林怀南收到苏慕白从南京发来的一条消息：“看到你的访谈了。‘退一步’这个思路，江苏三年前就开始做了。苏南的产业向苏北转移，我们叫‘南北共建’。你们终于跟上了。”","林怀南看完消息，笑了笑，回复道：“不是跟上，是殊途同归。你们从苏南向苏北，我们从珠三角向粤东西北。起点不同，方向不同，但逻辑是一样的——一个省不能只有‘发动机’，还要有‘传动轴’。”","苏慕白秒回：“说得好。下周广州有个区域经济研讨会，我去听你讲。”","林怀南看着屏幕，窗外的广州塔在夜色中变换着色彩。他想，这场双城记，终于从“粤苏之争”走向了“粤苏之鉴”。争的是面子，鉴的是智慧。","（本章经济学知识点：飞地经济模式、产业转移的边际效益分析、从被动承接到主动共建的演进、现金流+护城河策略、慢变量的长期价值、边际收益递减规律、省内区域协调发展的经济学逻辑）"],"characters":1117},{"title":"第五十二章：粤苏之鉴","book":"潮涌双城记","chapter":52,"slug":"chapter-052","type":"chapter","paragraphs":["二〇三三年夏，广州。","区域经济研讨会在珠江新城的学术报告厅举行。林怀南和苏慕白同时出现在嘉宾名单上——这是他们时隔三年再次同台。","台下坐着两百多位学者、官员和企业代表。有人是来看广东经验的，有人是来看江苏模式的，更多人想看看这两位“老对手”会擦出什么火花。","主持人的开场白很巧妙：“今天我们不谈谁第一谁第二，只谈一件事——中国区域经济协调发展，广东和江苏各能贡献什么智慧。”","林怀南先发言。他讲了广东过去五年做的三件事：把珠三角的产业往粤东西北引导，把大湾区的发展红利往华南F3分享，把土地和环境容量留给更高质量的产业。","“广东最大的转变，是从‘单核突进’转向‘多极支撑’。”林怀南指着屏幕上的热力图，“五年前，珠三角九市贡献了全省GDP的百分之八十二。去年这个数字降到了百分之七十八。粤东西北的增速连续三年高于珠三角，这是几十年来没有过的。”","苏慕白接着发言。他讲了江苏过去五年做的三件事：推动苏南的制造能力向苏中苏北梯度转移，强化宁镇扬的协同发展，提升全省的制造业“硬核”能力。","“江苏最大的坚持，是把制造业做到极致。”苏慕白展示了一组数据，“江苏的制造业增加值占GDP比重保持在百分之三十六以上，高于广东的百分之三十一。在芯片、高端装备、生物医药这些‘长周期’产业上，江苏的投入强度和产出规模都在稳步提升。”","两人的发言之间，没有针锋相对，也没有互相吹捧，而是一种难得的默契——各说各的话，各表各的理，但最终都指向同一个问题：一个经济大省，如何在保持增长的同时，实现区域内部的均衡和产业结构的优化？","圆桌讨论环节，有学者问：“广东和江苏的模式，到底哪个更可持续？”","林怀南回答：“可持续性的标准，不是谁的模式更‘正确’，而是谁的模式更能适应变化。广东靠的是‘市场驱动+制度创新’，江苏靠的是‘制造深耕+区域均衡’。两种模式都在根据新情况调整，都在补自己的短板。广东在补均衡的短板，江苏在补创新的短板。”","苏慕白接过话头：“他说得对。中国经济这么大，不需要只有一个‘标准答案’。广东走广东的路，江苏走江苏的路，两条路都可以通向高质量发展。关键是两条路之间能不能互相借鉴——广东学江苏的均衡，江苏学广东的活力。这叫‘对标’，不叫‘抄袭’。”","台下响起会心的笑声。","研讨会结束后，两人在会场外的走廊上站着喝茶。窗外是珠江新城的摩天楼群，阳光在玻璃幕墙上反射出耀眼的光。","“怀南，我问你一个问题。”苏慕白端着茶杯，“你真的觉得广东能被江苏赶上吗？”","林怀南想了想，笑了：“你是想问，江苏有没有可能超过广东？”","苏慕白没有否认。","“说实话，短期之内不可能。”林怀南的语气很坦诚，“广东的体量已经很大了，而且大湾区内部的整合红利还没有完全释放。但我要说的是——江苏超不超过广东，其实不重要。重要的是，江苏在某些方面确实比广东强，比如制造业的完整度、区域发展的均衡度、教育和科研的底蕴。这些东西，广东要虚心学。”","苏慕白点了点头：“这才是我认识的林怀南。三十年前你就说过，‘不要总想着赢，要想着不输’。”","“那是我年轻时候说的。”林怀南笑了笑，“现在我想的是——大家一起赢，才叫真的赢。”","两人碰了碰茶杯。茶是广东的凤凰单枞，泡得浓酽，入口微苦，回甘悠长。"],"characters":1304},{"title":"第五十三章：粤东西北的“造血”实验","book":"潮涌双城记","chapter":53,"slug":"chapter-053","type":"chapter","paragraphs":["二〇三三年秋，广东汕头。","这座曾经的经济特区，在很长一段时间里显得有些沉默。深圳、珠海、厦门都找到了自己的节奏，汕头却始终没有找到属于自己的爆发点。","但这两年，变化悄然发生。","陈思远来到汕头高新区，调研“粤东西北振兴计划”的落地效果。高新区管委会的负责人姓林，四十出头，是从深圳调过来的“帮扶干部”。","“陈博士，汕头这两年最大的变化，不是引进了多少企业，而是学会了怎么‘造血’。”林主任带着陈思远参观园区，“以前我们等省里给政策、给资金、给项目，等来等去，错过了很多机会。现在我们主动出击——到深圳去招商，到广州去对接，到东莞去找配套。”","他举了一个例子。汕头过去有一个纺织服装产业，规模不小但技术落后，只能做低端代工。三年前，汕头和深圳的一家服装设计公司合作，在汕头建立了“设计+制造”的联合基地。深圳负责款式设计和品牌营销，汕头负责面料研发和生产制造。两年下来，这个基地的产值翻了三倍，利润翻了五倍。","“以前我们赚的是‘辛苦钱’，现在赚的是‘设计钱’。”林主任说，“同样一件衣服，贴牌的时候出厂价三十块，贴上自主品牌之后卖三百块。中间的差价，就是设计和品牌的价值。”","陈思远在园区里走访了几家企业。有一家做玩具的企业让他印象很深——老板是个四十多岁的汕头本地人，过去做的是塑料玩具代工，利润薄得像纸。三年前，他儿子从广州美术学院毕业回来，帮父亲做起了原创IP玩具设计。第一款产品是一只戴着潮汕英歌舞面具的熊猫，在网上卖爆了。","“我儿子说，这叫‘文化赋能’。”老板笑着说，“我不懂这些词，但我知道，以前一个玩具赚五毛，现在一个玩具赚五十。”","陈思远在当天的调研笔记中写道：“粤东西北的振兴，不能只靠‘输血’，更要靠‘造血’。而‘造血’的关键，是找到本地资源和外部能力的结合点——潮汕的文化、客家的传统、粤西的海洋资源，这些是珠三角没有的东西。一旦和设计、品牌、渠道这些外部能力结合，就能产生意想不到的化学反应。”"],"characters":798},{"title":"第五十四章：海南的“慢功夫”","book":"潮涌双城记","chapter":54,"slug":"chapter-054","type":"chapter","paragraphs":["二〇三三年冬，海南三亚。","林怀南又一次来到海南。这次是参加南繁育种基地的年度成果发布会。","南繁育种基地，是中国农业科技的“硅谷”。每年冬天，全国各地的育种专家都会来到三亚，利用这里的热带气候加速育种进程。一个新品种的培育周期，在北方需要十年，在南繁只要五年。","发布会上，中国热带农业科学院的一位研究员展示了最新成果——一种抗病高产的水稻新品种，在盐碱地上的亩产达到了六百公斤。台下掌声雷动。","林怀南坐在观众席上，心中感慨。这就是海南真正的“慢功夫”——不追求短期的GDP数字，而是用几十年时间积累独特的科研能力。一个育种基地，看似不起眼，但它支撑的是中国十几亿人的粮食安全。","发布会后，林怀南和那位研究员聊了起来。研究员姓周，六十出头，在海南工作了三十多年。","“林教授，您知道南繁基地最大的价值是什么吗？”周研究员问。","林怀南摇了摇头。","“是时间。”周研究员说，“育种这件事，本质上是在和病虫害赛跑。你培育出一个抗病品种，病虫害也会进化。你必须不停地跑，不停地培育新的品种。南繁基地的存在，让这个赛跑的速度加快了一倍。就是这一倍的速度，让中国的粮食安全多了一道保险。”","林怀南被这个“时间”的概念打动了。他想起了经济学家们经常讨论的“时间偏好”——人们总是倾向于追求即时的回报，而低估长期的价值。南繁基地恰恰是一个“反时间偏好”的存在——它用几十年的积累，换取未来几十年的安全。","“周老师，你们的成果，可能一辈子都不会变成GDP数字。”林怀南说。","周研究员笑了：“我们不需要GDP。我们需要的是，当有一天台风来了、旱灾来了、病虫害来了，中国人的饭碗还能端在自己手里。”","林怀南在当晚的日记中写道：“海南的意义，不在于它现在有多少GDP，而在于它未来能守护多少东西。种业、深海、航天——这些东西在短期内看不到回报，但它们才是一个国家真正的‘安全垫’。海南的‘慢功夫’，值得所有人尊重。”"],"characters":780},{"title":"第五十五章：华南F3的第五年","book":"潮涌双城记","chapter":55,"slug":"chapter-055","type":"chapter","paragraphs":["二〇三四年春，广州。","自二〇三〇年启动算起，华南经济圈进入第五个年头。三省区联合发布《华南经济圈发展报告（2033）》，回顾已经过完的四个年度。","报告显示，三省区现价GDP合计的全国占比从启动时的约百分之十五，增至百分之十六点五。广东继续保持第一，广西有几个产业环节接上了技术和订单，海南的服务业占比也提高了。报告专门留出一页，说明三地的变动有多少来自价格、多少可能由协作带来。","但这些数字背后，还有更深层的变化。","报告有一节讲协作方式的变化。刚开始时，三地主要靠项目对接。广东列出手里的单子，广西和海南说哪些能接。项目做到一半，出了退货、改线和延误，才发现有些账事先没有说明白。","现在，三地的合作机制已经进化到了“平台共建+利益共享”的阶段。三省区共同出资设立了“华南产业协同基金”，规模达到五百亿元，重点投向跨省产业合作项目。基金收益按出资比例分配，项目所在地享受税收和就业，输出地享受产业升级的空间和基金回报。","“这才是可持续的协同。”林怀南在报告发布会上评论道，“靠行政命令推着走，走不远。靠利益机制拉着走，才能走得久。华南经济圈的实践，证明了区域协同不只是政治任务，也可以是经济理性。”","发布会上，一位记者问了一个尖锐的问题：“华南F3的模式，能复制到全国其他区域吗？”","林怀南回答：“每个区域的条件不同，不能简单复制。但有一条原则是共通的——协同的本质，是让每个参与者都能从合作中获得比单干更多的利益。如果做不到这一点，再好的规划也是空中楼阁。”","记者追问：“那广东得到了什么？”","林怀南想了想，说：“广东得到了三样东西。第一，更广阔的产业腹地——广西和海南为广东的企业提供了低成本的生产和物流空间。第二，更稳定的供应链——当全球经济波动时，华南内部的供应链比跨国的供应链更可靠。第三，更大的市场纵深——三省区加起来有将近两亿人口，这个市场足以支撑很多产业的内循环。”","“所以，广东不是在做‘慈善’？”","“当然不是。”林怀南笑了，“区域协同从来不是单方面的施舍，而是各取所需、共同受益。广东帮助了广西和海南，广西和海南也成就了广东。”"],"characters":861},{"title":"第五十六章：各美其美","book":"潮涌双城记","chapter":56,"slug":"chapter-056","type":"chapter","paragraphs":["二〇三四年夏，南京。","苏慕白在书房里收到了林怀南寄来的一本书——刚出版的《华南经济圈研究》，扉页上写着一行字：“慕白兄指正。怀南。”","苏慕白翻开书，一页一页地读着。书里详细记录了华南F3从“集结”到“协同”再到“融合”的全过程，有数据，有案例，有理论分析。","读到最后，苏慕白在书末的空白页上写了一段话：","“怀南兄，恭喜。华南的实践，为中国区域经济协调发展提供了一个重要样本。广东的‘退一步’，广西的‘进一步’，海南的‘慢功夫’——三者结合，形成了一种全新的区域发展模式。它不是简单的‘强弱互补’，而是‘长短互济’。”","他合上书，走到窗前。窗外是南京的暮色，紫金山在夕阳中泛着紫色的光。","他想起了很多年前在珠江边和林怀南的对话。那时候他们都年轻，都在争论哪个省更强。三十多年过去了，他们都老了，争论的问题也变了——从“谁更强”变成了“谁更能为别人做点什么”。","这大概就是时间的力量。它把一个简单的竞争问题，变成了一个复杂的共生问题。","苏慕白掏出手机，给林怀南发了一条信息：","“书看完了。华南F3的实践证明了一件事——区域协同的终极形态，不是同质化的‘一样’，而是差异化的‘互补’。广东的资本、广西的空间、海南的政策，加在一起，大于三者之和。这就是‘乘数效应’的真正含义。”","过了十分钟，回复来了：","“慕白，你说得比我书里写的都好。下次广州见，我把你的话写进第二版。”","苏慕白看着屏幕，笑了笑。他回复了四个字：","“各美其美。”","林怀南秒回了四个字：","“美美与共。”","窗外，秦淮河上的画舫亮起了灯，桨声灯影里，江南的夜色温柔而绵长。","（本章经济学知识点：区域协同的机制演进——从项目对接到平台共建、利益共享机制、区域协同中的乘数效应、时间偏好与长期价值、反时间偏好的公共投资、造血与输血的区别、区域协同中的各取所需逻辑、差异互补与同质竞争的对比）"],"characters":753},{"title":"第五十七章：珠江口的“大桥经济学”","book":"潮涌双城记","chapter":57,"slug":"chapter-057","type":"chapter","paragraphs":["二〇三四年深秋，港珠澳大桥。","林怀南站在大桥的观景平台上，望着远处海面上穿梭的货轮。这座连接香港、珠海、澳门的大桥，开通已经十六年了。十六年间，它从一座“交通工程”变成了一部“经济引擎”。","陪同他参观的是大桥管理局的一位老工程师，姓冯，六十多岁，从大桥动工那天起就在这里工作。","“林教授，您知道大桥开通前，香港到珠海要多久吗？”冯工问。","“走水路也得看从哪里起程。”林怀南说，“由我老家出门，等车船、过关，几个小时也常有。”","冯工指着桥面说：“我们测的是两个口岸之间的时间。若拿去跟住家出门的用时相减，差的那一截就说不清。好在现在两岸有人天天走，能请他们把过关、堵车的日子一并记下来。”","林怀南把几样实惠记在纸上。有人少在路上耗一天，有人能把货改由另一港出。珠江西岸这十几年产出增加了，里面也有别的投资、产业和人口变化。那两笔不同的事，不能用同一个增长数报上去。","“冯工，大桥的维护成本高吗？”","冯工笑了：“每年运转和维修都要花钱。我们核算时列两栏，一栏走桥，一栏仍走别处。车流有一半开不开桥也会走，就从别的路改过来。仅把节约与新增的好处记下，再和建设、维修、安全的费用比。”","林怀南把路上的花费按企业和住户各记一行。一辆车节约的时间值多少钱，车上载着什么人，平时有没有耽误过事，后来还得去问。","港珠澳大桥把口岸附近的活动连得更紧了。林怀南临走时向冯工讨了一张旧时刻表，准备回去把十五年前只算过一次的那条路线再走一遍。"],"characters":599},{"title":"第五十八章：深中通道的“第二效应”","book":"潮涌双城记","chapter":58,"slug":"chapter-058","type":"chapter","paragraphs":["离开港珠澳大桥，林怀南驱车前往深中通道。","深中通道将珠江口两侧的深圳和中山直接连起来。往北有虎门大桥等通道，往南有港珠澳大桥。林怀南这天要问的是，路近了一截，制造上的合作是否也跟着变了。","深中通道管理中心的负责人姓陈，四十出头，是从深圳交通局调过来的。他带着林怀南参观了通道的监控中心和调度系统。","“林教授，您看这张图。”陈主任指着大屏幕上的车流热力图，“自二〇二四年六月开通，已有十年。这张图用通车满一个月后的工作日和今年同月的工作日比较。货车比例涨了些，其中一部分只是从别的线路改道来的。”","“货车占比上升说明什么？”","陈主任调出另一张图：“车流变多只告诉我们有人过了桥。去年我们另查了几条老路线，看哪几家厂过去不能当天送样，现在固定送起来了。”","林怀南明白了。深中通道的意义，不在于缩短了两座城市的距离，而在于把两座城市的产业链“焊”在了一起。深圳的科技+中山的制造，形成了一条“四十分钟产业走廊”。这条走廊上的企业，可以像在同一座城市里一样协同工作。","“这就是‘第二效应’。”林怀南对陈主任说，“第一效应是交通便利，第二效应是产业融合。第一效应是可见的，第二效应是隐形的，但第二效应的影响更大。”","陈主任若有所思地点了点头。","林怀南在当天的日记中写道：“深中通道的启示——基础设施的价值，不在于它本身有多长、多宽、多贵，而在于它连接了什么。连接两座城市，改变的是通勤；连接两条产业链，改变的是经济结构。珠江口的跨海通道群，正在把整个大湾区变成一个‘超级城市’。”"],"characters":626},{"title":"第五十九章：粤西的“海上牧场”","book":"潮涌双城记","chapter":59,"slug":"chapter-059","type":"chapter","paragraphs":["二〇三五年春，广东湛江。","林怀南第一次来到湛江。这座位于雷州半岛的城市，是广东距离海南最近的地方，也是广东海洋资源最丰富的地区。","接待他的是湛江市海洋与渔业局的副局长，姓吴，五十多岁，皮肤被海风吹得黝黑。","“林教授，您来得正好。”吴副局长带着林怀南登上一艘渔政船，驶向湛江湾外的深海养殖区。","船行了大约一个小时，海面上出现了一片巨大的圆形网箱。每个网箱的直径超过五十米，深度超过二十米，用高强度聚乙烯网衣包裹，固定在海底的锚泊系统上。","“这是我们的深海智能网箱。”吴副局长指着网箱说，“每个网箱可以养鱼两百吨，相当于过去一百个传统网箱的产量。而且全部是智能化管理——自动投饵、自动监测水质、自动收鱼。”","林怀南看着这些海上“巨无霸”，心中感叹。湛江的深海养殖，不只是规模的扩大，更是模式的升级。传统养殖靠天吃饭，台风一来就血本无归。深海网箱抗风浪能力达到十二级以上，还能根据水温、洋流、溶氧量自动调整投饵策略。","“吴局长，湛江的海洋产业现在占GDP的比重是多少？”","“去年是百分之三十二。”吴副局长说，“十年前只有百分之十八。增长主要来自深海养殖、海上风电、海洋生物医药三个板块。尤其是海上风电，湛江的海上风电装机容量已经超过了一千万千瓦，全国第一。”","“海洋产业最大的挑战是什么？”","吴副局长想了想，说：“人才。深海养殖需要懂海洋学、懂工程、懂智能化的复合型人才。海上风电需要懂电力、懂结构、懂防腐的工程师。这些人才，大部分集中在珠三角，愿意来湛江的不多。”","林怀南点了点头。这是粤东西北振兴的共性问题——产业可以转移，但人才很难同步转移。解决的办法，要么是吸引人才回流，要么是培养本地人才。","“你们有没有和高校合作？”林怀南问。","“有。我们和广东海洋大学合作，定向培养深海养殖和海上风电的专业人才。学生大三就到湛江的企业实习，毕业之后直接留下来工作。去年留湛率达到了百分之六十五，比五年前翻了一倍。”","林怀南望着远处的海面，夕阳把海水染成了金黄色。湛江的深海养殖和海上风电，是广东“向海图强”的缩影。广东的海岸线长达四千多公里，海洋经济产值连续多年全国第一。这片蓝色的国土，正在成为广东经济新的增长极。"],"characters":889},{"title":"第六十章：苏北的“农房改善”","book":"潮涌双城记","chapter":60,"slug":"chapter-060","type":"chapter","paragraphs":["二〇三五年夏，江苏盐城。","苏慕白驱车行驶在盐城的乡村公路上。路两边是大片大片的稻田和鱼塘，白墙黛瓦的农房点缀其间，偶尔有几只白鹭从水面上掠过。","他此行要看苏北农房改善的新一轮工作。早年已做过一轮住房改善；五年前追加的这批还涉及原村留居、转岗后的通勤和新住房的维修。跟住户说话时，他把三件事分开问。","盐城农业农村局的一位副局长陪同调研。她姓周，四十多岁，是从基层一步步干上来的。","“苏教授，您看前面那个村子。”周副局长指着一片新建的农房，“那是我们的新型农村社区。每户一栋两层小楼，带院子，面积一百八十到两百二十平米。集中供水、供电、供气、污水处理全部配套。村民只需支付建造成本的三分之一，其余由省、市、县三级财政补贴。”","苏慕白走进一户农家。主人是一位六十多岁的老大爷，正在院子里晒玉米。他热情地招呼苏慕白进屋坐，指着宽敞的客厅说：“以前住的是土坯房，下雨就漏，刮风就透。现在这房子，比城里人的别墅还舒服。”","“您花了多少钱？”苏慕白问。","老大爷掰着手指头算：“总共花了八万。政府补了十六万。要是我自己建，怎么也得三十万，建不起。”","苏慕白在村里转了一圈。他注意到，农房改善不只是“盖房子”——新建的社区里，卫生室、超市、快递点、文化活动中心一应俱全。更重要的是，旧宅基地复垦后增加了耕地面积，村里的土地流转给了农业公司，每亩每年的租金是一千元。","“这就是‘农房改善’的经济学逻辑。”苏慕白对周副局长说，“它同时做了三件事：改善了农民的居住条件，增加了耕地面积，促进了农业规模化经营。一举三得。”","周副局长点头：“苏教授说得对。而且，农房改善还带动了农村消费。以前农民攒钱盖房子，盖完就没钱了。现在政府补大头，农民自己出的钱少了，剩下的钱可以用来买家电、买车、旅游。去年盐城农村消费品零售额增长了百分之十二，全省第一。”","苏慕白在当天的笔记中写道：“乡村振兴的核心，不是让农村变成城市，而是让农村的生活条件接近城市，同时保持农村的生态和文化优势。江苏的农房改善，走的正是这条路——用有限的财政投入，撬动农村居住、农业经营、农民消费三重升级。”"],"characters":860},{"title":"第六十一章：长三角的“慢火车”","book":"潮涌双城记","chapter":61,"slug":"chapter-061","type":"chapter","paragraphs":["二〇三五年秋，从南京到黄山的绿皮火车上。","苏慕白特意选择了这趟慢车。高铁从南京到黄山只要两个多小时，绿皮火车却要六个多小时。但苏慕白喜欢这趟车——沿途停靠十几个小站，能看到最真实的长三角腹地。","车厢里人不多，大多是沿线小城的居民，有挑着担子卖菜的老农，有背着书包的学生，有提着行李的打工者。苏慕白旁边坐着一个六十多岁的大妈，篮子里装着刚摘的板栗。","“大妈，您这是去哪儿？”苏慕白问。","“去绩溪看女儿。”大妈笑着说，“女儿在那边教书，我每个月去看她一次。高铁太贵了，慢车便宜，反正我也不赶时间。”","苏慕白看着窗外的风景。火车正穿过皖南的山区，山间的稻田像一块块拼图，散落在山谷里。偶尔能看到几栋徽派老宅，马头墙在阳光下泛着白光。","他想起了长三角一体化的宏大叙事。高铁、高速公路、跨海大桥——这些是长三角一体化的“面子”。但真正的“里子”，是那些慢火车、小城镇、乡村公路连接起来的毛细血管网络。这些毛细血管，才是长三角经济韧性的根基。","大城市的摩天楼是效率的象征，小城镇的烟火气是韧性的来源。效率让经济跑得快，韧性让经济跑得远。两者缺一不可。","火车到了绩溪站，大妈提着篮子下车了。苏慕白望着她的背影，心中涌起一股暖意。长三角一体化的最终目的，不是让所有城市都变成上海，而是让绩溪这样的小城，也能分享到发展的红利，也能让大妈每个月能方便地去看女儿。","这才是经济学的温度。","（本章经济学知识点：基础设施投资的乘数效应、时间距离与经济效率的关系、产业链的空间嵌入、人才流动与产业转移的异步性、海洋经济的增长极效应、乡村振兴的多重目标协同、毛细血管网络与区域韧性、一体化中效率与韧性的平衡）"],"characters":679},{"title":"第六十二章：交棒","book":"潮涌双城记","chapter":62,"slug":"chapter-062","type":"chapter","paragraphs":["二〇三六年春，南京。","苏慕白在书房里整理书架。他刚刚过完七十岁生日，头发已经全白了，但精神还好。书架上那本《华南经济圈研究》旁边，多了几本新书——都是他这些年攒下来的研究资料，有些是林怀南寄来的，有些是自己买的。","手机响了。是林怀南。","“慕白，我决定了。”林怀南的声音有些沙哑，但语气很平静，“今年年底，我从研究院退下来。”","苏慕白沉默了几秒：“身体还好吗？”","“身体没事。是时候了。”林怀南说，“我带了二十年的博士生，该把讲台让给年轻人了。陈思远那孩子，我已经跟院里推荐了，让他接手我的团队。”","苏慕白在椅子上坐下来，想了想，说：“我也在考虑这件事。沈若曦去年从剑桥回来了，在南京大学经济学院做副教授。她的研究能力比我当年强，是时候让她挑大梁了。”","“沈若曦？”林怀南问，“就是你常提起的那个学生？”","“对。她在剑桥读的博士，研究方向是区域经济与制度变迁。毕业论文写的是‘长三角与粤港澳大湾区的制度比较’，拿了最佳论文奖。”苏慕白的语气里带着一丝骄傲，“陈思远和沈若曦，两个人年纪相仿，研究方向相近，但视角完全不同。一个在广东长大，一个在江苏长大。他们之间的对话，会比我们当年更有意思。”","林怀南在电话那头笑了：“你是说，让他们接着演‘双城记’？”","“不是演。”苏慕白的语气变得认真，“是让他们用自己的方式，继续追问那些我们没来得及回答的问题。”","两人在电话里沉默了一会儿。窗外，南京的梧桐树正在抽新芽，嫩绿色的叶子在春风中轻轻摇曳。","“慕白，这些年，谢谢你。”林怀南忽然说。","苏慕白愣了一下，然后笑了：“你什么时候变得这么煽情了？”","“老了。”林怀南也笑了，“老了就容易煽情。”","“那就煽一次吧。”苏慕白说，“怀南，我也谢谢你。这些年的争论，没有你，我可能早就懈怠了。”","电话两端，两位老人同时沉默了。他们都知道，这可能是最后一次以“对手”的身份对话了。从今往后，舞台属于年轻人。"],"characters":776},{"title":"第六十三章：陈思远的接力","book":"潮涌双城记","chapter":63,"slug":"chapter-063","type":"chapter","paragraphs":["二〇三六年夏，广州。","陈思远走进林怀南的办公室时，林怀南正在收拾东西。书架上大部分书已经打包进纸箱，桌上只剩下一台笔记本电脑和一盆绿萝。","“老师，您真的要走？”陈思远站在门口，手里拿着一份刚打印出来的研究报告。","“年底退休，先把资料理给你。”林怀南把最后一本书放进纸箱，拍了拍手上的灰，“院里说以后还可以来。这几个月你先接手。我还有几笔查不清的旧账，也交给你。”","陈思远把报告放在桌上：“老师，这是我刚完成的——‘华南经济圈产业协同的微观机制研究’。我用了三年时间，跟踪了三百家跨省合作企业，发现了一个有趣的现象。”","林怀南没有急着看报告，而是指了指沙发：“坐下说。”","陈思远坐下来，翻开报告的第一页：“老师，我们过去研究产业转移，关注的往往是‘转移了多少企业、多少投资、多少产值’。但我发现，真正决定产业转移成败的，不是这些宏观数字，而是一个微观机制——‘企业间的信任网络’。”","他翻开第二页，上面是一张复杂的关系图：“我调研的三百家企业中，成功实现跨省协同的，都有一个共同特征——两地的企业之间建立了长期信任关系。这种信任不是靠合同建立的，而是靠反复合作、人员互派、信息共享逐步积累的。相反，那些只靠政策优惠吸引过去的项目，存活率不到三成。”","林怀南接过报告，翻了几页，然后放下。","“思远，你知道这个发现意味着什么吗？”","“意味着区域协同的政策重心应该从‘给优惠’转向‘建网络’。”陈思远说。","林怀南点了点头，眼中闪过一丝欣慰：“我研究区域经济三十年，最后得出的结论，也是这一句话。政策可以搬来工厂，但搬不来信任。信任是靠人跟人打交道长出来的。你能在三十多岁的时候看到这一点，比我强。”","他站起来，走到窗前，望着远处的珠江。江面上货轮缓缓驶过，汽笛声低沉而悠长。","“思远，这个团队交给你了。我只有一个要求——不要只坐在办公室里看数据。去企业，去工厂，去码头，去田间地头。经济学的答案，从来不在论文里，在真实的世界里。”","陈思远也站起来，郑重地点了点头。"],"characters":814},{"title":"第六十四章：沈若曦的追问","book":"潮涌双城记","chapter":64,"slug":"chapter-064","type":"chapter","paragraphs":["二〇三六年秋，南京。","沈若曦走进苏慕白的办公室时，苏慕白正在看一份学生的论文。他抬起头，摘下老花镜，示意沈若曦坐下。","“若曦，剑桥的教职你不要，为什么回来？”苏慕白问。这个问题他一直没有认真问过。","沈若曦想了想，说：“因为我想弄明白一件事。”","“什么事？”","“江苏和广东，到底有什么不同。”沈若曦的声音很轻，但很坚定，“我在剑桥写了三年论文，读了上百本关于中国区域经济的书。但我发现，大部分研究都是从外部看中国。我想从内部看。我想站在江苏的土地上，用江苏人的眼睛，看看江苏到底在发生什么。”","苏慕白点了点头。他没有说话，而是从抽屉里拿出一个旧笔记本，递给沈若曦。","沈若曦翻开一看，是苏慕白三十多年前的田野调查笔记。纸页已经泛黄，字迹工整，密密麻麻记录着当年的见闻——苏南乡镇企业的改制过程、苏北农村的劳动力转移、苏中城市的产业转型。","“这是我当年做研究时记的。”苏慕白说，“没有什么高深的理论，就是老老实实地跑、看、问、记。你如果想弄明白江苏和广东的不同，先从这些笔记开始。然后自己去跑一遍。跑完苏南，再去苏北；跑完苏北，再去广东看看。回来告诉我，你发现了什么。”","沈若曦接过笔记本，感觉手上沉甸甸的。这不只是一本笔记，而是一个人三十年的学术生涯的起点。","“苏老师，您觉得我能弄明白吗？”","苏慕白笑了：“你不需要‘弄明白’。你需要的是‘继续追问’。经济学的问题，从来没有终极答案。每一代人都有自己的答案，但每一代人的答案都会被下一代人推翻。这不是失败，这是进步。”","沈若曦把笔记本放进包里，站起来，向苏慕白深深鞠了一躬。","“苏老师，我不会让您失望的。”","苏慕白摆了摆手：“不要说‘不让我失望’。你要做的是——不让自己失望。”","沈若曦转身走出办公室。走廊的尽头是一扇大窗，窗外是南京大学的老校区，梧桐树的叶子已经开始泛黄。","她掏出手机，给陈思远发了一条信息：“陈师兄，我回南京了。下周我去广州找你，我们聊聊。”","回复很快就来了：“好。我带你去东莞看一家工厂。那里的故事，论文里写不出来。”","沈若曦看着屏幕，嘴角微微上扬。她知道，属于他们这一代人的“双城记”，才刚刚开始。","（本章经济学知识点：产业转移中的信任网络机制、政策优惠与关系网络的互补性、区域经济研究的田野方法论、代际学术传承与问题意识的延续、经济学研究的“内部视角”与“外部视角”）"],"characters":951},{"title":"第六十五章：保修箱","book":"潮涌双城记","chapter":65,"slug":"chapter-065","type":"chapter","paragraphs":["二〇三六年秋，沈若曦从广州到东莞。陈思远已在站外候她，臂弯里夹着件旧外衣。两人坐一辆满是灰土的面包车去长安镇，经过一个路口，司机摇下窗问能不能由后门进。陈说走前门。那里有个接货棚，今早从国外回来的零件已经拆了箱。","十年前，陈思远就在这里见过李老板。那时厂里腾出两条旧设备线做储能产品。现在外墙漆过两次，里间的年历还挂得很低。李老板胖了，腰不能久站，叫徒弟小孟替他去领客人。小孟问先看装配还是售后。沈若曦还没有答，一只箱盖已经立起来，里面躺着一副变色的控制板。","板子属于卖到北欧的一批产品。外地经销商说，产品到冬天容易报错，用户要寄回检查。厂里出了两次运费，沿原来的检验次序都没再现故障。李老板让小孟把前一批的客户记录拿出来。小孟从抽屉里翻到一本厚册，先翻到末页，再往回找。那一页有个地址，照片下是安装点最低气温。","沈若曦问，这一个故障，损失算在哪里？李老板叫会计把一张旧单送来。十年前自主品牌的毛利是一道漂亮的数字；现在账页后头添了保修、备件和在外维修人员的支出。国内的设计费列在中国，海外经销商付给当地维修工的收入依当地记账。她想起早上翻过的研究摘要，上面把整套交易金额都归进了广东制造，就在页脚画了圈。","“当年卖出去一箱，钱什么时候到？”她问。","“按单结。现在商场先卖，给我们留一笔，过了保修核对期才认。”李老板说，“自主品牌的价是高，卖出去以后，做过的事还跟着你。”","这批产品由广东做性能验证，苏南两家小厂供两种部件。出问题时，李老板想一并换掉。他的女儿在柜台后面听着，说剩下的同批库存六百多块，全退要停线。她先叫小孟把故障批次和正常批次的标签分开。三人一张一张数，一个供应商在那几个月换过焊料，另一个还用旧料，两种板也都有好的。单据上找不出谁应先认赔，老李只好答应各取几件复验，钱暂从以前计提的保修准备里支。","下午来取货的车晚了，厂里的人放下茶杯，合力把新包装挪进棚里。沈问陈，研究企业信任时，有没有把退货算进去。陈说当初问的多是活下来的企业，没问到倒掉的几家。她摸着册子里被撕去半角的纸，问能否抄一遍收件日期。他迟了一下，说可以，先从这一叠写坏的旧单开始。","回去的时候雨渐渐住了。小孟又追出来，手里拿着同批的两块旧板。他认不得邮寄地址里的外文字，却认得箱子上那家电器铺落款的印。印已褪去一半。他说要是查出毛病，会把两块一同寄回去。那边的人还在等。"],"characters":970},{"title":"第六十六章：名单上的空格","book":"潮涌双城记","chapter":66,"slug":"chapter-066","type":"chapter","paragraphs":["十月，沈若曦带着老笔记本到盐城。客车经过一条翻修过的河堤，灰色的护栏不时闪一下。她坐在靠窗的位置，读见苏慕白当年记下的一行小字：厂迁了，先去旧门口问。新厂的门卫常有名单，旧厂的门卫常知道名单外的人。","接待她的是园区一位姓姚的工作人员。姚把苏南企业合作名录用电脑打开，筛了一下，项目大半还亮着绿点。沈说可否把六年前迁入的全列出来。姚搜了一回，退租的企业早移到一个不用的表里，两个表的编号也不同。她们找到了当年的水表台账，按厂房和首张租单对照，总算拼成了同一批项目。后来新迁入的占了几个旧门牌，老名单不拼，空出过的那一年就看不见。","她随后去问一位离开工厂的老工人。那人姓郁，家里在晒萝卜干。他拿竹片把卷边的一块压好，告诉沈若曦，厂关的那天他比经理更早知道，夜班再没人接了。他现在到县城帮人修机，小时工价比过去高，一个月有几个晚上没有活。也有人在邻厂再上班，有人回家养病。原来的调研问卷送进新厂，自然见不到这两类人。","沈把问题改了几句。一个项目熄灯后，机器在哪，留下的师傅去哪，欠的货款有没有付。姚不大愿意把后两项也放进评估，说营业登记能查，工人各有各的去路，填不齐。沈把未知单列，后来打听到哪个人再补。她说不能拿空白当全员顺利安置，统计的人也不可追着人问到他们不愿答的地方。姚听罢，从柜里找出一摞培训登记表，再去找人问，谁愿意自己谈一谈。","姚后来送来一张退场交接单，说园区有三家项目退了租，手下两位老师傅却留了下来，给邻厂做校验。报表上没有适当的一栏，她原先用小字挤在页边。沈请她先把能核对到的名字记下，下个月再去问校验收了多少工钱。她也改了原来访谈的结尾，免得每一户问到营业后就停。","晚上她同陈思远通话。陈说在他的调查里，长期合作的企业活得久些，可能也因为本来稳当的企业更容易交到老伙伴。他正在想办法回到签约前，找出出货、付款习惯相近的两组，顺带看看客户集中度。沈说盐城有几家同年签约、随后陆续拿到服务的厂，或可用作参照。两人没有急着合并样本，先写下哪些企业选择了留下、哪些退出的原因仍缺。","郁师傅第二天打来电话，说愿意再说说那套机器。当时园区来人拍照，他不在班，照片里那台最大的设备还压着张等待配件的牌。沈若曦带着旧册子再到他门前。萝卜干晒下去半层，院里空出块地。他从屋里取出一枚上工时认工位的塑料片，轻轻翻到背面。上头写着他的名字，已磨掉半个姓。她问完一笔，把名册交还姚，只留了那一格空白的查访日期。"],"characters":995},{"title":"第六十七章：六点二十分的车","book":"潮涌双城记","chapter":67,"slug":"chapter-067","type":"chapter","paragraphs":["冬天，陈思远陪沈若曦到粤北一个县城。县里准备报名参加省里的下一批城市功能评估，来电说几项服务数字已经过线，只差验收。宾馆桌上放着一张交通图，从县城到最近的三甲医院画为一条直线。沈拿尺比了比，图上不长，便问前台有车没有。姑娘指着玻璃墙上压在最下面的旧时刻表，说早上六点二十分有一趟，他们到的时候可以多穿一件衣服。","天还黑着，几个人先站在公交站下。中年妇女周素芬背着个布袋，袋口露出一只黄色饭盒。她预订了医院的号，去一次要换两回车，午后的回程最后一班赶不上，常得投亲一夜。看见陈那张图，她把县城一端的起点往外指了六里。她家在村里，到起点靠侄子骑摩托送。若侄子上夜班，她就改日再去。","市里的报告统计最快班次从客运站到医院旁的时间。陈说按这个用法，宣传上的车程全是真的。沈拿出表，把从家走到车、换车等待、返程三个时段拆开，问周能不能把有车来接和无车来接的日子分别记下。周笑道，现在只需她记；真到无车来的那日，调查员也要在村口站一站才成。","县里来了一位公交所的办事员。他说照常增班，一天能多花不少钱，沿途好几个站只上下两个人。周的办法倒简单，先让早班在桥边多停一个站。办事员说停一下没多少，可改线路要验安全，桥边太窄。他们沿路走了一趟，见老粮站门外有块空地，转弯稍远，车能掉头，还能遮雨。在征得粮站同意之后，县里答应先跑一段试行线，核对班次是否赶得上医院窗口和返程，再决定如何分摊。沈请办事员把申报表里那项合格先挪到待复测一栏。","周素芬到医院，挂号并未误，后来的检查等了一个多小时。几个人在楼下吃饭，办事员拿出手机给她看下午三点十三分的发车消息。这条车有半程是镇里的，过县界以后用另一种票，老人买错过两回。陈把票根留了一张，办事员答应下次先问能不能在车上补差价，少叫人为了几元钱进两次站。","午后，陈思远在客车上接到林怀南的电话。老师问评估如何。陈说一项还须回去再量，由户门到医院，来回都量。电话那头静了片刻，说起几十年前广州最先有一线之名的时候，常把一座城同另一座城比人均。他现在想问这位妇人，若车接上了，下一件事最想省掉什么。陈把问题写在本子最后，打算下趟车时再问。","回城的路绕进了那处旧粮站。地里收过稻，远看一片浅灰，偶有两垛草发点淡黄。周把饭盒拿出来，问车下回真会在这里停么。办事员说得等测过转弯，他明早来。她想了想，说自己也来，顺带把踏板太高的事讲给司机听。陈翻开纸，给第二天六点二十分留了一行。"],"characters":991},{"title":"第六十八章：粮站门口的白线","book":"潮涌双城记","chapter":68,"slug":"chapter-068","type":"chapter","paragraphs":["第二天早晨，粮站看门人还在屋里倒热水，周素芬便来了。她带了一把缝衣的软尺，从候车处量到石坎，再把尺子盘起来放进上衣口袋。昨晚没下雨，空地积着几处水。看门人说那是前天冲谷糠留下的，晴一整天也干不透。","六点二十分原是镇上那班车的发车时间。这天司机先开空车来试转弯。办事员姓邹，他在车头旁站着，叫人把墙边搬不动的石臼也标在图上。车进来时前轮过了白线，尾巴离石臼只半尺。司机下来自己走了一趟，提议把上客的地方挪到仓门外，由北门进去，南门出去。看门人应了，又指指西边一把铁锁，说开南门的钥匙从前归老吴管，现在老吴去城里带孙子了。","陈思远想，钥匙也该在成本表里占一行。他本来带着量车程的手表，这时把表收起来，帮着看门人去找粮站经理。经理电话接得早，愿意借出场地，但问坏了门栓哪里报修。邹说先定一个月，站点登记在公交所，开关门交给当班巡查的人，粮站留一副钥匙。经理还担心赶集时车门被摊挡。周素芬数给他听，卖菜的人集中在星期四，若不能走另一门，那天应早派一个人在外头看路。","他们回到试车的地方，沈若曦正在问司机，停稳后梯面离地多高。周把软尺递过来，又请司机等她上一次。昨天她只说高，如今左手提布袋，右手抓栏杆，脚抬到一半又落下来。司机要帮，她请他先看一眼自己坐过的那辆低踏步的车，排班时能不能换到这一路。邹把车型记进试行单，另外请人看场地能否做个安全的上下车平台。一处用不上的站，标得再近也没有益处。","回村路上，周算了算，若车真能进粮站，侄子每次可以少请半个钟头的假。她倒不愿把别人的半个钟头一律折成钱。遇到他夜班后的那天，能回屋睡觉，比她少掏车钱还要紧。沈记下两人换班的日子，答应过段时间到她家问一声，看看那个钟头到底省了没有。","午后，车队送来费用单。绕进来再出去每趟多四分钟。几个人拿着图以为只有周和邻村会受益，重新把旧站的上车记录取出，才知道原先车上已经有九个常客，其中三个还要在终点转另一班短车。多出的四分钟有可能让他们误车。邹当晚去了终点，把换乘时间抄回来，等候最短只有三分钟。他请两头的车队在星期四先试一次衔接，不能等就留电话调度，别叫两拨人互相埋怨。","试行头一天定在下星期一。看门人叫小工画白线，小工画了两道，都问能不能画直一点。司机说靠站先看篱边能站几个人，不必同墙一样直。他把一条线折过去，将水洼留在外面。周素芬站上白漆还没干的那一边看了看，说星期一她会带老伴走来。等她走后，车队又来扫过一遍地。白线上没有脚印，旁边浅黄的泥里留着两个深深的鞋跟。"],"characte
