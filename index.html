rs":1018},{"title":"第六十九章：谁换了那层漆","book":"潮涌双城记","chapter":69,"slug":"chapter-069","type":"chapter","paragraphs":["盐城入冬以后，郁师傅常去邻厂做半日校验。沈若曦找到他时，他正从车架上卸下一盒量具，盒子有一边贴了两层胶布。听说东莞来的板在寒天报错，他问厂里最近动过哪几样东西。沈把台账翻到李老板提过的焊料，递给他。郁看完，叫她把领料单也找来。有时发下去的材料名字变了，车间用的还是架上那一盒。若只问办公室，能追到的是买来的日子。","苏南那两家供货厂里，做外壳的一家在常州。经理姓姚，跟盐城园区的姚办事员同姓。她接到电话，答应把几个批次的工单拿来，但请东莞的人把原件也送一块。冷天的故障隔很久才报回来，记错日期并不难。陈思远请小孟把退回的两块控制板分别封好，编号的人和检测的人分开，让实验室先按同样条件做复测。李老板听了摇头，说两个地方照样各用一只温度计，万一对不上又扯半年。郁师傅便带来那盒量具，先比温度记录，再比同一块板在同一间屋里换人测的结果。","试了五天，初看像是换原料那一家出了事。第三回重测，有一块没换焊料的板也在低温时断了信号。小孟拿灯照了照，板角有层半透明的漆。陈思远问这是原来就有的么。做装配的女工想起来，为免一批货在海上受潮，东莞那一头临时多上一道保护漆。喷涂单单独归档，没跟电路工单放在一起。复查时才发现，这两套变动先后相隔九天，后续好几批板兼有两项变动。试验还不足以认定起因，他们先补查装机处的温度、批号和漆的固化记录。","郁师傅带来的量具也没白跑。两地原本都在试验结束时抄下箱内显示的温度，其中一家另有放在板边的测头。班组换人以后，运行头半个钟头，两个读数相差很多。实验室请两厂各跟完整一回，从开门放样到关门取件逐时记下来。有一回小孟记错了钟点，划去重写，旧的还看得见。","晚上，常州的姚经理在小饭馆接通视频。她说，愿意查，但厂里也要知道自己在查什么。此前东莞发来一张对比图，两道曲线一高一低，图下没写样本是谁寄的。经理专门点了一碗面，等图出来时面都泡开了。小孟把当初剔掉两个测不到的样件说了出来，沈请求他把剔除原因挨个补齐。厂里原来用同一条线做两种板，任何一家先认下整批过错，都可能担下别处的损失。","最后几个人议定，将涉及两次工序改动的批次先停止发货，已到经销商手里的由李家按合同安排复查和替换。按批号追不出的库存暂挂在库里，作待查件。两家供应商各送来留样，东莞把喷涂单交给一个独立实验室保管，待复核后再谈费用。","散会后小孟收拾桌子，旁边一碗面还剩半碗。他在取件袋外另贴了张纸，写上那两件被他舍掉的号码。墨水干了以后，他把本来朝下的一张旧磨损照片也翻了上来。"],"characters":1024},{"title":"第七十章：三元钱归哪一头","book":"潮涌双城记","chapter":70,"slug":"chapter-070","type":"chapter","paragraphs":["粮站接驳开了第九天，周素芬的侄子换班回家，带来两块油饼。他听婶子说这一趟自己去了医院，便问用不用再留摩托。周把票拿给他看。一程七块，回来有一张三元的纸票，要在中途补交。她两张都留着，一张印得浅，只看得出日期。侄子说家里本有可以刷的卡，她说卡在哪一头能用还说不准，先拿零钱稳当。","公交所的邹办事员本以为三元很好分。县里的车过界后，另一家运营单位从下一站搭客，票面就换为对方的。为了让乘客少进一次站，双方愿意代收，又都不肯认三元为自己的一笔收入。最着急的是每天来交钱的司机。他早班回场，小票上写了少收六块，回去才认出那是两位坐完全程的老人用的另一张票。他不能当天补账，出车之前，只好先拿自己的钱垫着。","市里派来的会计想按两段里程分票款，说比例写在纸上一查就清。邹请他去坐一次车。跨界半程的路短，司机却在那里等了十二分钟接人。两人回站，把来回两班的记录摊在桌上。若所有款都照里程匀，少开一趟便少赔一点，最难养活的发车时段还是会被挤掉。若照刷卡数付钱，老人掏了现金，有时又没留下可对照的凭据。","沈若曦建议把两件事分记，代收的票按实际乘车凭证清算，确须保留的早晚班按约定买服务，查的是有没有兑现班表、能否接上门诊和晚班。有人问乘客多了钱是否要少给。她想起莫林研究公交运营时，把乘客的等候时间也放进了费用账。多一些人乘车，若班次随之增加，原来就在坐车的人也可能少等。可这条山路客流薄，眼下只先保护紧要的两班，不能拿城里密线的估算往上套。邹在合同草稿后加了期限，到时把兑现情况、改线的成本和出门困难的人数都翻出来看。","会计说第一月怕凑不齐两家票据，索性等第二月一起结。邹记得司机垫过的钱，不肯叫他再等一个月。他们约定每周先付对得上的数，短的挂一笔，月底凭原票对清。县里原有的补贴合同还在，清算表添一条，旧合同已经付过的那段，双方都不再报一次。","周素芬也被请来讲她的办法。她没有卡，生疏的手机只用来接电话。她问小票能否印深些，起站和到站写在同一边。收费员把自己留的副联给她看，拿铅笔把两个站名标出来。每张票先核对编号，临时没网也有纸票可认，司机自己不用垫。县里同意先只对这一路的两个车辆班组试行，别的一概照旧。","下午来了一场小雨。新票还未印好，司机用印章在原票上盖了个记号。周捏着一张纸，摸摸外衣口袋，又把另一张还给收费员。收费员正低头封钱，不知她为何退。周伸出一根手指，给他看上面没擦干净的蓝印：“原先两张也到得了家。你再过半个月看看，旁边那户没年轻人送的，会不会也走到这里。”"],"characters":1026},{"title":"第七十一章：照旧的那段路","book":"潮涌双城记","chapter":71,"slug":"chapter-071","type":"chapter","paragraphs":["二〇三七年一月下旬，周素芬的邻居果然来坐车。县里的简报写新增乘客一成多，请沈若曦签名。她把纸先放在桌上，问那一成里有多少是赶集、多少去医院，有没有人因在粮站多停一站误了原来的接驳。写简报的人说车票都在，一个人去了几回，也有数。沈说她还想看看家离旧站远、去年就没有出门的那一群。","二人跟邹去东边一个暂未改线的村。春天才轮到那里，村里人早就知道。早晨来搭车的有个人拎着五袋豆腐，骑车到镇里给孙子送饭才顺路上车。他说冬里赶车少，开春又会多起来。邹已经把两边画在一张图上，以为同在县里够相像。到粮站这边来，才看见新线经过一个元旦后刚开第二条生产线的厂，早班多出来的几个人有一半是工人。沈把草图重新夹好，嘱咐人访谈时照样记下不乘车的人，若他们不愿填，也留一栏。","回到宿舍，她从旧书里找出一九九四年的一篇研究。卡德和克鲁格曾在新泽西提高最低工资前后调查当地快餐店，还问了邻近没有同时提工资的宾夕法尼亚门店。她拿这个办法和邹说，不仅看改过的地方前后多了多少，也要看照旧那一边是否同时变了。照旧的村若离医院更远，有一条路恰好封过半年，或者改线以前两处的出行趋势就走得不一样，也不能轻易拿来互减。那篇研究后来有人换资料复核，县里这些薄表格也该容得下别人翻一翻。","邹另拿空白本，把新旧两处相近的时段分开记。医院窗口在元旦后也改了，多排出两个号段，等候缩短有一部分须另算。再去看不常走的山户，老人肯说的有十几个，其中两个人反映改线后在桥边还要走一里。沈记了这个位置，打算请人查下一期可否接一个已有的乡车站，不必现在就填到合格栏里。","傍晚，来帮忙的两个学生对答卷时，发现一个人把同一趟来回分写在两处，有个不识字的老人只在正面按了手印。他们没有替后者照着邻居的时间填满，又请懂当地话的人带去问一次。沈把重新访问的日期和补进的那几行用另一种颜色标明。看一张统计表的人若想往前追，便知道先找哪几页了。","试行首月，十来户反复查访的住户中，几户少付了摩托费用，有人去医院不用再留宿；在原终点转车的也有两次确实没赶上。样本太小，沈把来回所用的时间和说过的话写成几页，交县里和两处村委会分别过一遍。简报上那一成的客流仍留着，在下面添了分项和日期。邹签完字，问他负责的路线何时能上评估表。沈说提那两个误车的人也看看，先问一问他们乘的是哪一天。","他回站时，车队桌上搁冷了一碗粥。司机说门外有人来找他，下午又没接上车。邹没有拿简报出来，先从兜里取出笔。门外那人把票捏得卷了边，说不用帮他捋平，号码还看得见。"],"characters":1025},{"title":"第七十二章：柜台下的备用板","book":"潮涌双城记","chapter":72,"slug":"chapter-072","type":"chapter","paragraphs":["二月末，一封从丹麦来的信摆在东莞工厂的柜台上。经销商把本季的新订单减了半，又问留在仓里的老设备如何修。李老板请翻译重念一遍，才听清对方并非只问那二十几台。附近几家卖同类设备的店也出了事，客户在网上分不清是哪一家，连那些没接过报修的牌子都要降价。","小孟说把新的质量报告印在外盒上，顾客看得见。李家的女儿问，一个在海边住了二十年的人会认得那间化验室吗？那人是从家旁的铺里买来的，只晓得夜里要用，坏了最好有人接电话。她把以前请的翻译找出来，问当地维修点愿不愿留一箱替换件。那边说配件之前就有，最怕替厂做完工，按月对账时被退回。李老板打开几年前的账簿，看见一张还没让对方确认的差旅票。那笔钱不多，两边都以为对面会先认账，留了四个月。","陈思远带来一本薄论文复印件。阿克洛夫一九七零年用旧车举例，买家看不出好坏，出价只好按市场上混在一起的质量来估。车况好的人嫌价低退出，市场上好车便更少。李老板听他说完，问良心好的商家还有没有法子。陈说，保修和能查明责任的记录都有用，前提是顾客坏了真能找到人，也要有人有钱兑现。李老板转头问会计，若把经销商一时没付的尾款算进去，保修准备还剩几个月好用。他听完没有说话，拿笔把新机器订金的支付日往后挪了一周。","实验室的复核也到了。涂覆参数的一处偏差和板件在特定温度条件下的故障相关，单换焊料并不能复现所有问题。检测人员要求同时追查两批留样和现场安装记录，暂时给不出全部赔付的分摊比例。李家决定先由自己的渠道受理报修，再依复查向相关方分摊。小孟同维修点约定把未修和修好的件分箱寄回。电话里有人问能不能只收厂里的报告。对方答当地已有顾客来过，若要他们再信一次，还得看柜台上有没有一块真能换的板。","当天下午又有一位苏南来的老板问，独立实验室一次多少钱，小厂若摊着做能否负担。李家的女儿把试样、运送和复验各列一笔，提出同一批能用一套试验的才合做。倘若换了料，便提前告诉各家。她想起自家的喷涂单曾搁在另一个柜里，便连问了两遍，新单上的变更由谁签过才传到仓库。","经销商收到两份文件，一张是经核验的批次表，一张是备件到了哪家店的清单。头两个星期内没来新订单，只来十二张申请换板的回执。李老板算了一下，春天这单即使能补回来一半，仍得少装一条线。小孟问那时间干什么。李老板叫大家找个平常交货时看不见的地方去问。过几天檐下多挂了两件挂衣，店里那个原来只接电话的人，头一次随售后师傅去看拆下来的部件。"],"characters":994},{"title":"第七十三章：报告的两张封皮","book":"潮涌双城记","chapter":73,"slug":"chapter-073","type":"chapter","paragraphs":["三月，陈思远到南京，拿着两本封皮一样的报告。一份谈粤北的公交和就医，另一份谈东莞、苏南的工厂如何在退货之后继续合作。他来之前问过沈若曦，能不能合出一份广东和江苏的比较研究，好让资助方读得快些。沈没有立即作答，先拿一杯茶递到他手里。他吹去面上的白气，茶底露出两根竖着的茶叶。","资助方愿意付下一轮调查费，条件是给出几张各地可比较的指标图。陈思远找来画图的人，画完一看，旧厂退租记成了产业网络萎缩，另一端又把同年进园的一家新厂算进老项目续存。公交倒有整条线的客流数字，没去看病的人在计数器上没有位置。沈翻到附录，指给陈看一排并列的厂号。她说如果照这图发，有人会按每一栏的数去关停项目，实际连同一批和下一批都没认清。","陈思远有些急。他说想留住问过的人，下半年须再跑三次，走廊外等着经费的年轻人也拿得出好几个新题。若只交一本排得慢的报告，恐怕一半人留不下来。沈说这两处的故事可以一起说，但公交是否让人少耗半天，厂怎样从退货中学会配合，各有一套证据。先给人看他们问过哪些人，哪一段仍是猜的。等了几秒，她从包里取出在盐城记的本子，让陈找自己不同意的一条，用红笔画出来。她答应同样在东莞的本子上画一条。","陈先圈了郁师傅的工时，问转去帮邻厂校验之后，怎样分出是移厂以后才做的活，哪些是过去早有的。沈没能当场答，从手机里查去年那张培训签到单。她圈了东莞的报告中“长期合作使企业更稳”几个字，请他把稳的企业自己选老伙伴的可能性也写进去。两个人坐到饭馆上门催预订，改完了开头四页。封面还没换，内页有五处空着，有三个人名前面留了要再访的记号。","等天色暗下来，楼里扫地的人来敲门。沈把一页居民的往返时辰翻过来压在书下，免得走廊上来往的人一眼看出住处。陈原想让学生带整套表回家赶工，见了便改交去掉地址的抄本。那一晚少印了一叠纸，第二日早晨，大家又各在办公室多坐了半个钟头。","后来资助方来开会，陈先请他们看几处失败的案子，说明为什么眼下给不出两省名次。负责拨款的人等他说完，问已拿的钱交付了什么。沈递来一张任务单，有可复核的原始票据、匿名的访谈、重复测量的方法，也写明哪家单位不同意公开材料。两地团队各自留底，能分享的字段另列。经费最终只批了一半，把调查能做到的界线写在批单上。陈算过尚可多去四个村和两家厂，便在下午先给邹办事员打电话。","回广州前，沈把两份报告各换了新的封皮。一份灰的，一份浅蓝。陈把它们放进包里，走到楼下又上来，问能把那把红笔也借他两天么。一处工人去向他想亲自再问一次。"],"characters":1022},{"title":"第七十四章：第十四张票","book":"潮涌双城记","chapter":74,"slug":"chapter-074","type":"chapter","paragraphs":["清明前，陈思远回到粮站。白线有一折被车轮磨灰，粮站的人在旁边钉块木牌，写着过路的货车午前不要停。车要来了，看门人沿线把两个竹筐挪开，其中一个是周素芬的。她笑着解释，她今天不看病，帮妹妹带两包菜籽到镇头去，就走这趟车。","司机这几日用新的联票，票面印着来去的站。走到医院那头下车的，拿旧票也还认。周坐在离门近的地方，看见前头有一个姑娘，拎着一袋实习服。姑娘在县医院学检验，早班若在镇上等两次，常过了交接的时辰。原来她在亲戚家搭住，试着自己往返以后，干完活还能到家照应祖母。周问她下班搭末班么。姑娘说轮到迟班还得睡在城里，她现在只把星期一和星期四当作能回家的日子。","陈问周还记不记得冬天答应他的那件事，车接上之后还最想省哪一道。周说丈夫复查的那天，坐在站里没找着能用的厕所。她两个钟头不敢喝水，进了医院第一件事也不是去取号。陈到了总站亲自找一遍，卫生间在二楼，电梯去年装好，早班出车时还锁着。他上楼看到地板洗得干净，保洁大姐已经来了。开电梯的钥匙在隔壁客运楼，值班员七点四十才过来。这几个人彼此认得，谁也没想过楼下有人等着上去。","邹找来站长，多留一枚钥匙给首班值班员，电梯按时巡检，厕所在时刻表旁标好。他算了账，没花装修费，站里要增加早间巡查。周说若真上得去，她午后不打算在亲戚家等到吃饭。护士原也说她们两点前能离开，现在能赶上三点十三那一班。陈请她要是换了门诊时间，顺手在票背记一个钟点。她应了，问工作日坐车的人会不会也要照这般去做。他说只请几个人帮忙，回去慢慢核对。","电梯开给早班乘客的头两天，站里没有另派人守。第三天有人坐在里面放下两袋米，门合上又被米袋顶开，好几个人等在外面。保洁大姐把杂物间的钥匙也借了出来，说提早来的菜贩若肯把东西暂放在那里，旁人就可先上楼。站长把这件事交给每天先到的人轮流登记，没人看守的日子，存放也一并暂停。","月末县里开了试行费用单。最早一个月，粮站平常每早上下客合计六七人，现在通常十多人。头两周来的人少，三周后有几个人换了原先每周的走法，但需求是否稳定还要看淡季。公交所留住两班车，周末各加一班的申请暂时收回。邹把合同约定的接驳失败也填在同一张表上，没有应车队的请求先把那几次划掉。","陈傍晚离开，站务员正在理副联，手上数到十四。第十四张票换票时沾了面汤，放干了还能认。陈站在门边，看见一个面生的老人左手搭着栏杆，慢慢从车门下来了。旁边的姑娘请他别赶，她也走那条路，两个人可以一道到桥边。"],"characters":1002},{"title":"第七十五章：一间没租掉的屋","book":"潮涌双城记","chapter":75,"slug":"chapter-075","type":"chapter","paragraphs":["四月末，粤北市里的评估组来县里看试行。同行四人中有一个在外地做过建设审计，姓聂。他不先去新修的展厅，说一路过来，见粮站路上有人等车，想坐那一班去镇里。水泥牌下有三个人在等，另外两个站在里面避风。把公交开到近处以后，过去只在图上出现的一幢屋，如今每天开门。聂问租金、厕所和谁来了以后打扫，邹指着看门人那间小屋说，一项一项都写在借用本里。","走到县城，负责招商的人在客运站接他们，请顺路看产业园。园区有间没租出去的厂房，门窗装好，厅里摆了两排新椅子。市里想拿来做技术服务中心，去广州请一批工程师轮班。过去的论证书把工资和交通费列得很细，料想企业准肯来用。陈思远问，这里闲着的时段有多少。对方解开领口的扣子，答说还没营业，电话里有二十来家报过名。沈便请他挑三家附近的，当面问他们先要做哪一件事。","头一家做小家电外壳，老板娘自己开车来，说能有一位师傅看模具就好，不必等大楼开业。第二家做缝纫配件，年前在广州找人量过两道尺寸，钱付了，报告没看懂。第三家报的是招工，检验和出货一向托到外地做，自己眼下不打算购设备。招商的人听着听着，从怀里拿出一份名单，将三家的需求分别写进去。聂只问了一次，倘若由现有实验室轮流派人，中心里这两排椅子每个月能坐满几回。他可帮助算账，也得看看是由哪一家接活。","老板娘走之前还问了句，外地来的师傅若只约好两日，第三天做出的废品谁看。沈听见管招商的人答应给个后续联系的时段，便把那一栏也添到试行记录上。厅里有一张写好外来专家名字的座次牌，门卫过来收走了，留下根黑笔，叫大家把过两天还需送来看过的件各自登记。","下午他们回到站里，做了两场小会。前一场先让县城两个厂合用一项量具和品质验收服务，账从各自的采购出；后一场谈车上时间，决定把终点误车记录同司机排班再试一季。两场会各有一份薄纸，一张说明需求和收费，一张说明公共预算往何处去。聂把县里的评估材料带走，说一项试点的成效只算这一项，其他得按各处的村和厂再看。季节轮换以后还要复走一趟，声称四季都通畅的话，得拿得出四季的记录。","离开园区时，沈若曦走得慢，回头看了一眼没租出去的屋。那里刚有人搬出几张椅子，给前厅腾出地方，让小作坊的人下次带模具进来。陈思远问她这回一线评估怎么填。她说公交已有可核的改进，制造这一格还没问到实数。话音刚落，老房子边上响起一台小电车的喇叭。车里先下来一位剪短发的姑娘，她把一只磨破了角的箱子交给门卫，问城里来的老师傅哪一天会到。门卫翻开记录本，写下她的名字和电话，把日期那一格空着。"],"characters":1029}]</script>

  let saved = null;
  try {saved = JSON.parse(storage.get('ethan-reading'));} catch {}
  if (!saved || !chapters.some(ch => ch.slug === saved.slug)) saved = null;
  const initialSaved = saved;
  function titleParts(ch) {
    const [label,...rest] = ch.title.split('：');
    const [title,...subtitle] = rest.join('：').split('——');
    return {label,title:title || label,subtitle:subtitle.join('——')};
  }
  function escapeHTML(value) {return String(value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function href(ch) {return '#chapter/' + encodeURIComponent(ch.slug);}
  $('chapter-count').textContent = `序章 + ${chapters.length - 1} 章`;
  $('chapter-list').innerHTML = chapters.map(ch => {
    const t = titleParts(ch);
    return `<a class="chapter-link" href="${href(ch)}" data-slug="${ch.slug}" data-search="${escapeHTML(ch.title + ' ' + ch.chapter)}"><span class="chapter-number">${ch.chapter ? String(ch.chapter).padStart(2,'0') : '序'}</span><span class="chapter-link-title">${escapeHTML(t.title)}${t.subtitle ? `<small>${escapeHTML(t.subtitle)}</small>` : ''}</span></a>`;
  }).join('');
  const links = [...document.querySelectorAll('.chapter-link')];
  function closeMenu(focus = false) {
    $('contents').classList.remove('open'); $('backdrop').hidden = true;
    document.body.classList.remove('menu-open'); $('menu-toggle').setAttribute('aria-expanded','false');
    if (focus && smallScreen.matches) $('menu-toggle').focus();
  }
  function openMenu() {
    $('chapter-search').value = ''; filterChapters();
    if (smallScreen.matches) {
      $('contents').classList.add('open'); $('backdrop').hidden = false;
      document.body.classList.add('menu-open'); $('menu-toggle').setAttribute('aria-expanded','true');
    }
    $('chapter-search').focus();
    links[current].scrollIntoView({block:'nearest'});
  }
  $('menu-toggle').onclick = () => $('contents').classList.contains('open') ? closeMenu(true) : openMenu();
  $('close-menu').onclick = () => closeMenu(true);
  $('backdrop').onclick = () => closeMenu(true);
  $('show-contents').onclick = openMenu;
  smallScreen.addEventListener('change',() => closeMenu());
  document.addEventListener('keydown',event => {
    if (!$('contents').classList.contains('open')) return;
    if (event.key === 'Escape') closeMenu(true);
    if (event.key === 'Tab') {
      const focusable = [...$('contents').querySelectorAll('button,input,a')].filter(el => !el.hidden);
      const first=focusable[0], last=focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {event.preventDefault();last.focus();}
      else if (!event.shiftKey && document.activeElement === last) {event.preventDefault();first.focus();}
    }
  });
  function filterChapters() {
    const query = $('chapter-search').value.trim().toLowerCase();
    links.forEach(link => link.hidden = !link.dataset.search.toLowerCase().includes(query));
    $('no-results').hidden = links.some(link => !link.hidden);
  }
  $('chapter-search').addEventListener('input',filterChapters);
  function updateFont() {
    fontSize = Math.min(26,Math.max(16,fontSize));
    document.documentElement.style.setProperty('--font-size',fontSize + 'px');
    $('font-value').textContent = fontSize;
    $('font-smaller').disabled = fontSize <= 16; $('font-larger').disabled = fontSize >= 26;
    storage.set('ethan-font-size',String(fontSize));
  }
  $('font-smaller').onclick = () => {fontSize--;updateFont();updateProgress();};
  $('font-larger').onclick = () => {fontSize++;updateFont();updateProgress();};
  updateFont();
  document.querySelector('.skip').onclick = event => {event.preventDefault();$('reader').scrollIntoView();$('reader').focus({preventScroll:true});};
  function setNavigation(id,index) {
    const link=$(id), ch=chapters[index];
    if (ch) {link.href=href(ch);link.removeAttribute('aria-disabled');link.removeAttribute('tabindex');link.title=ch.title;}
    else {link.removeAttribute('href');link.setAttribute('aria-disabled','true');link.tabIndex=-1;link.title='';}
  }
  function render(scroll = true) {
    let slug;
    try {slug=decodeURIComponent(location.hash.replace(/^#chapter\//,''));} catch {slug='';}
    const index=chapters.findIndex(ch => ch.slug === slug);
    current = index >= 0 ? index : 0;
    const ch=chapters[current], t=titleParts(ch);
    $('chapter-content').innerHTML = `<p class="chapter-kicker">${escapeHTML(t.label)}</p><h2 id="chapter-title">${escapeHTML(t.title)}</h2>${t.subtitle ? `<p class="chapter-subtitle">${escapeHTML(t.subtitle)}</p>` : ''}<div class="chapter-divider" aria-hidden="true"></div><div class="prose">${ch.paragraphs.map(p => `<p${/^[（(]|^——.*（/.test(p) ? ' class="note"' : ''}>${escapeHTML(p).replace(/\n/g,'<br>')}</p>`).join('')}</div>`;
    document.title = ch.title + ' · 潮涌双城记';
    $('reading-position').textContent = `${String(current+1).padStart(2,'0')} / ${chapters.length} 篇 · 约 ${Math.max(1,Math.ceil(ch.characters / 450))} 分钟`;
    links.forEach((link,i) => i === current ? link.setAttribute('aria-current','page') : link.removeAttribute('aria-current'));
    setNavigation('previous',current-1);setNavigation('next',current+1);
    $('reading-end').textContent = current === chapters.length-1 ? '已读至最新章节 · 未完待续' : '不必赶路，故事会等你。';
    $('resume-banner').hidden = Boolean(location.hash) || !initialSaved;
    closeMenu();
    if (scroll) {$('reader').scrollIntoView({block:'start'});$('reader').focus({preventScroll:true});}
    updateProgress();
  }
  function position() {
    const article=$('chapter-content');
    return Math.max(0,Math.min(1,-article.getBoundingClientRect().top / Math.max(1,article.offsetHeight - innerHeight * .5)));
  }
  function updateProgress() {
    frame=0;
    const fraction=position();$('progress-bar').style.width = (fraction*100)+'%';
    if (!restorePending && $('resume-banner').hidden) storage.set('ethan-reading',JSON.stringify({slug:chapters[current].slug,fraction}));
  }
  function scheduleProgress() {if (!frame) frame=requestAnimationFrame(updateProgress);}
  addEventListener('scroll',scheduleProgress,{passive:true});
  addEventListener('resize',scheduleProgress);
  addEventListener('hashchange',() => render());
  // A second tap on the current chapter still dismisses the mobile drawer.
  $('chapter-list').addEventListener('click',event => {
    const link=event.target.closest('a');
    if (link && link.hash === location.hash) {closeMenu();$('reader').scrollIntoView();$('reader').focus({preventScroll:true});}
  });
  $('resume-button').onclick = () => {
    if (!initialSaved) return;
    restorePending=true;
    history.replaceState(null,'',href(initialSaved));render(false);
    requestAnimationFrame(() => {
      const article=$('chapter-content');
      const fraction=Number.isFinite(initialSaved.fraction) ? Math.max(0,Math.min(1,initialSaved.fraction)) : 0;
      scrollTo(0,scrollY+article.getBoundingClientRect().top+fraction*Math.max(1,article.offsetHeight-innerHeight*.5));
      restorePending=false;updateProgress();
    });
  };
  render(Boolean(location.hash));
})();
</script>
</body>
</html>
